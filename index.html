/strong>, DNS <strong>006<\/strong>, Domain name <strong>015<\/strong><\/td>\n<\/tr>\n<tr>\n<td>DHCP failover<\/td>\n<td><strong>2<\/strong> servers, <strong>IPv4 only<\/strong>, <strong>TCP 647<\/strong>, MCLT <strong>1 h<\/strong> (not 0), standby <strong>5%<\/strong>, auto switchover <strong>60 min<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Dynamic DNS re-registration<\/td>\n<td>Every <strong>24 hours<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Hostname / NetBIOS name<\/td>\n<td><strong>255<\/strong> chars / <strong>16<\/strong> chars (15 + service)<\/td>\n<\/tr>\n<tr>\n<td>VHD / VHDX max<\/td>\n<td><strong>2 TB<\/strong> / <strong>64 TB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Default checkpoint<\/td>\n<td><strong>Production<\/strong><\/td>\n<\/tr>\n<tr>\n<td>AVD default load balancing<\/td>\n<td><strong>Breadth-first<\/strong><\/td>\n<\/tr>\n<tr>\n<td>AVD limits<\/td>\n<td>Workspaces 1,300 · host pools/workspace 400 · app groups 500 · RemoteApps 500 · role assignments 200 · session hosts/pool 10,000<\/td>\n<\/tr>\n<tr>\n<td>AVD VMs per subscription/region<\/td>\n<td><strong>5,000<\/strong> (2,500 with autoscale)<\/td>\n<\/tr>\n<tr>\n<td>AVD session host prefix<\/td>\n<td><strong>≤ 11<\/strong> chars<\/td>\n<\/tr>\n<tr>\n<td>AVD bandwidth<\/td>\n<td>Light 1.5 · Medium 3 · Heavy 5 · Power 15 Mbps<\/td>\n<\/tr>\n<tr>\n<td>AVD port<\/td>\n<td><strong>TCP 443<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Max savings (RI + Hybrid Benefit)<\/td>\n<td><strong>80%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Execution policy default<\/td>\n<td><strong>Restricted<\/strong> (client), <strong>RemoteSigned<\/strong> (server), <strong>Unrestricted<\/strong> (non-Windows)<\/td>\n<\/tr>\n<tr>\n<td>Module auto-load<\/td>\n<td>PowerShell <strong>3.0+<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Default hybrid auth method<\/td>\n<td><strong>Password Hash Sync<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sync direction<\/td>\n<td><strong>On-prem → Entra ID only<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "windows-8", "n": 8, "title": "Practice Questions", "html": "<p>Many of these are the exact questions your instructor wrote in the speaker notes. Cover the right column and test yourself.<\/p>\n<h3>Active Directory &amp; Windows Server<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>What protocol is used to query AD? What standard does it follow?<\/td>\n<td><strong>LDAP<\/strong>; <strong>X.500<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Which replication model does AD DS use?<\/td>\n<td><strong>Multi-master<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Which is the security boundary: forest or domain?<\/td>\n<td><strong>Forest<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Which FSMO roles and groups exist only in the forest root domain?<\/td>\n<td><strong>Schema master, Domain naming master, Enterprise Admins, Schema Admins<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Transitive vs non-transitive trust?<\/td>\n<td>Transitive extends past the two domains (A→B→C); non-transitive stops at the two linked domains<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Which trust connects AD to a non-Windows Kerberos realm?<\/td>\n<td><strong>Realm trust<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Which trust is manual and non-transitive, used for NT4 domains?<\/td>\n<td><strong>External trust<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Can you link a GPO to the Computers container?<\/td>\n<td><strong>No<\/strong> — only to sites, domains, OUs<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>What two things does every DC host?<\/td>\n<td><strong>Ntds.dit<\/strong> database and <strong>SYSVOL<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>How is SYSVOL replicated?<\/td>\n<td><strong>DFSR<\/strong><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>What does an RODC protect against?<\/td>\n<td>Unauthorized writes and <strong>credential theft<\/strong> (no cached passwords by default)<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Restore to undo an accidental deletion?<\/td>\n<td><strong>Authoritative<\/strong> restore<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Restore to bring an out-of-date DC back in sync?<\/td>\n<td><strong>Non-authoritative<\/strong> restore<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Why is the GC needed at logon?<\/td>\n<td>Checks <strong>universal group membership<\/strong> (and resolves UPNs)<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Which FSMO role is the authoritative time source?<\/td>\n<td><strong>PDC emulator<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Which FSMO role ensures unique SIDs?<\/td>\n<td><strong>RID master<\/strong><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Which role should not be on a GC (multi-domain)?<\/td>\n<td><strong>Infrastructure master<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>Who can modify the schema? Can you delete a schema attribute?<\/td>\n<td><strong>Schema Admins<\/strong>; <strong>no<\/strong>, only disable<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>GPO processing order?<\/td>\n<td><strong>Local, Site, Domain, OU, child OU<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>Two default GPOs?<\/td>\n<td><strong>Default Domain Policy<\/strong>, <strong>Default Domain Controllers Policy<\/strong><\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>Command to see applied GPOs?<\/td>\n<td><strong><code>gpresult /r<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>Must the DHCP server have a static IP?<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>What are the 4 DHCP steps?<\/td>\n<td><strong>Discover, Offer, Request, Acknowledge (DORA)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>Account to authorize DHCP in a multi-domain environment? Single domain?<\/td>\n<td><strong>Enterprise Admin<\/strong>; <strong>Domain Admins<\/strong> member<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Command to find which DHCP server gave you your IP?<\/td>\n<td><strong><code>ipconfig /all<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>DHCP failover: how many servers, which IP version, which port?<\/td>\n<td><strong>2<\/strong>, <strong>IPv4 only<\/strong>, <strong>TCP 647<\/strong><\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>Tool for a reverse lookup?<\/td>\n<td><strong><code>nslookup<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>How long does a client cache a DNS record?<\/td>\n<td>Depends on the <strong>TTL<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Ways to flush the DNS cache?<\/td>\n<td><code>ipconfig /flushdns<\/code>, <strong>reboot<\/strong>, restart <strong>DNSCache<\/strong> service<\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>Stub zone vs conditional forwarder?<\/td>\n<td>Stub = only NS records, <strong>zone transfers<\/strong>; conditional forwarder = specific servers, <strong>recursion, no zone transfers<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>Main way DNS records get created in AD?<\/td>\n<td><strong>Dynamically<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Hybrid AD<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>32<\/td>\n<td>What replaced LDAP, Kerberos and GPOs in Entra ID?<\/td>\n<td><strong>Microsoft Graph (REST)<\/strong>; <strong>OAuth2/OIDC/SAML<\/strong>; <strong>Conditional Access + Intune<\/strong><\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>Which protocol is authorization, which adds authentication?<\/td>\n<td><strong>OAuth 2.0<\/strong> = authorization; <strong>OpenID Connect<\/strong> = authentication<\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>Which direction does sync go?<\/td>\n<td><strong>On-prem AD DS → Entra ID only<\/strong><\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>Default auth method with Entra Connect?<\/td>\n<td><strong>Password Hash Sync<\/strong><\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>Method where passwords are never stored in the cloud and DCs validate them?<\/td>\n<td><strong>Pass-Through Authentication<\/strong><\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>Only method for on-prem MFA or smartcards?<\/td>\n<td><strong>AD FS (federation)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>Accounts needed to install Entra Connect?<\/td>\n<td><strong>Global Admin<\/strong> (Azure), <strong>Enterprise Admin<\/strong> (on-prem), <strong>local admin<\/strong> on the server<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>Connect server goes down — what happens?<\/td>\n<td><strong>Sync stops; sign-ins still work<\/strong><\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>Tool to fix sync errors? Tool for batch attribute changes?<\/td>\n<td><strong>IdFix<\/strong>; <strong>ADModify.NET<\/strong><\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>Can you use Contoso.local for SSO?<\/td>\n<td><strong>No<\/strong> — domains must be routable<\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>Seamless SSO requirements?<\/td>\n<td><strong>Domain-joined Windows device on the corporate network<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Hyper-V<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>43<\/td>\n<td>Type 1 vs Type 2 — which is Hyper-V?<\/td>\n<td><strong>Type 1<\/strong> (bare metal)<\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>What is the Windows host called after adding Hyper-V?<\/td>\n<td><strong>Root / parent partition<\/strong> (management OS)<\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>Only way a partition can ask the hypervisor for something?<\/td>\n<td><strong>Hypercall<\/strong><\/td>\n<\/tr>\n<tr>\n<td>46<\/td>\n<td>Where do the VSC and VSP live?<\/td>\n<td><strong>VSC in the child (VM)<\/strong>, <strong>VSP in the root<\/strong><\/td>\n<\/tr>\n<tr>\n<td>47<\/td>\n<td>What replaced slow device emulation?<\/td>\n<td><strong>VMBus<\/strong> + synthetic devices<\/td>\n<\/tr>\n<tr>\n<td>48<\/td>\n<td>VMMS vs VMWP?<\/td>\n<td>VMMS = <strong>central management service<\/strong>; VMWP = <strong>one worker process per running VM<\/strong><\/td>\n<\/tr>\n<tr>\n<td>49<\/td>\n<td>CPU requirements?<\/td>\n<td><strong>64-bit, SLAT, Intel VT/AMD-V, DEP (XD/NX)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>50<\/td>\n<td>Switch that lets VMs talk to each other but not the host?<\/td>\n<td><strong>Private<\/strong><\/td>\n<\/tr>\n<tr>\n<td>51<\/td>\n<td>VHD vs VHDX max size?<\/td>\n<td><strong>2 TB vs 64 TB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>52<\/td>\n<td>What disk type are checkpoints?<\/td>\n<td><strong>Differencing<\/strong><\/td>\n<\/tr>\n<tr>\n<td>53<\/td>\n<td>Default checkpoint type?<\/td>\n<td><strong>Production<\/strong><\/td>\n<\/tr>\n<tr>\n<td>54<\/td>\n<td>PowerShell into a VM with no network?<\/td>\n<td><strong>PowerShell Direct<\/strong><\/td>\n<\/tr>\n<tr>\n<td>55<\/td>\n<td>Which devices does DDA support?<\/td>\n<td><strong>GPUs and NVMe<\/strong><\/td>\n<\/tr>\n<tr>\n<td>56<\/td>\n<td>Can you downgrade a VM configuration version?<\/td>\n<td><strong>No<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>AVD<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>57<\/td>\n<td>Which AVD parts does Microsoft manage?<\/td>\n<td><strong>Web Access, Gateway, Connection Broker, Diagnostics, Extensibility<\/strong><\/td>\n<\/tr>\n<tr>\n<td>58<\/td>\n<td>Personal vs pooled host pool?<\/td>\n<td>Personal = same host every time; pooled = any host<\/td>\n<\/tr>\n<tr>\n<td>59<\/td>\n<td>What's needed to add session hosts to a host pool?<\/td>\n<td>A <strong>registration key<\/strong> (per pool, with an expiry)<\/td>\n<\/tr>\n<tr>\n<td>60<\/td>\n<td>Default load balancing? Which saves money?<\/td>\n<td><strong>Breadth-first<\/strong>; <strong>depth-first<\/strong><\/td>\n<\/tr>\n<tr>\n<td>61<\/td>\n<td>Recommended profile solution and storage?<\/td>\n<td><strong>FSLogix<\/strong> on <strong>Azure Files<\/strong><\/td>\n<\/tr>\n<tr>\n<td>62<\/td>\n<td>Which clients are NOT supported?<\/td>\n<td><strong>RADC and MSTSC<\/strong><\/td>\n<\/tr>\n<tr>\n<td>63<\/td>\n<td>Port AVD uses?<\/td>\n<td><strong>TCP 443<\/strong><\/td>\n<\/tr>\n<tr>\n<td>64<\/td>\n<td>Bandwidth for a heavy workload / 1080p?<\/td>\n<td><strong>5 Mbps<\/strong><\/td>\n<\/tr>\n<tr>\n<td>65<\/td>\n<td>App attach advantage over MSIX app attach?<\/td>\n<td>Package works across <strong>multiple host pools<\/strong>, upgrades without a maintenance window, per-user permissions, two versions at once<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>PowerShell<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>66<\/td>\n<td>Three parts of PowerShell?<\/td>\n<td><strong>Shell, scripting language, DSC<\/strong><\/td>\n<\/tr>\n<tr>\n<td>67<\/td>\n<td>What does PowerShell pass instead of text?<\/td>\n<td><strong>.NET objects<\/strong><\/td>\n<\/tr>\n<tr>\n<td>68<\/td>\n<td>Default execution policy on clients? Servers?<\/td>\n<td><strong>Restricted<\/strong>; <strong>RemoteSigned<\/strong><\/td>\n<\/tr>\n<tr>\n<td>69<\/td>\n<td>Which policy requires even local scripts to be signed?<\/td>\n<td><strong>AllSigned<\/strong><\/td>\n<\/tr>\n<tr>\n<td>70<\/td>\n<td>Cmdlet naming convention?<\/td>\n<td><strong>Verb-Noun<\/strong><\/td>\n<\/tr>\n<tr>\n<td>71<\/td>\n<td>What does <code>dir<\/code> run? <code>cd<\/code>?<\/td>\n<td><strong>Get-ChildItem<\/strong>; <strong>Set-Location<\/strong><\/td>\n<\/tr>\n<tr>\n<td>72<\/td>\n<td>Script extension?<\/td>\n<td><strong>.ps1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>73<\/td>\n<td>Make non-terminating errors stop the script?<\/td>\n<td><strong><code>$ErrorActionPreference = 'Stop'<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>74<\/td>\n<td>Which block always runs in Try/Catch/Finally?<\/td>\n<td><strong>Finally<\/strong><\/td>\n<\/tr>\n<tr>\n<td>75<\/td>\n<td>Run a command on many computers at once?<\/td>\n<td><strong><code>Invoke-Command<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>76<\/td>\n<td>ISE doesn't support which versions?<\/td>\n<td><strong>PowerShell 6 and 7<\/strong> (use VS Code)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": true}], "cards": [{"q": "What protocol is used to query AD? What standard does it follow?", "a": "<strong>LDAP<\/strong>; <strong>X.500<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which replication model does AD DS use?", "a": "<strong>Multi-master<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which is the security boundary: forest or domain?", "a": "<strong>Forest<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which FSMO roles and groups exist only in the forest root domain?", "a": "<strong>Schema master, Domain naming master, Enterprise Admins, Schema Admins<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Transitive vs non-transitive trust?", "a": "Transitive extends past the two domains (A→B→C); non-transitive stops at the two linked domains", "sec": "Active Directory & Windows Server"}, {"q": "Which trust connects AD to a non-Windows Kerberos realm?", "a": "<strong>Realm trust<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which trust is manual and non-transitive, used for NT4 domains?", "a": "<strong>External trust<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Can you link a GPO to the Computers container?", "a": "<strong>No<\/strong> — only to sites, domains, OUs", "sec": "Active Directory & Windows Server"}, {"q": "What two things does every DC host?", "a": "<strong>Ntds.dit<\/strong> database and <strong>SYSVOL<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "How is SYSVOL replicated?", "a": "<strong>DFSR<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "What does an RODC protect against?", "a": "Unauthorized writes and <strong>credential theft<\/strong> (no cached passwords by default)", "sec": "Active Directory & Windows Server"}, {"q": "Restore to undo an accidental deletion?", "a": "<strong>Authoritative<\/strong> restore", "sec": "Active Directory & Windows Server"}, {"q": "Restore to bring an out-of-date DC back in sync?", "a": "<strong>Non-authoritative<\/strong> restore", "sec": "Active Directory & Windows Server"}, {"q": "Why is the GC needed at logon?", "a": "Checks <strong>universal group membership<\/strong> (and resolves UPNs)", "sec": "Active Directory & Windows Server"}, {"q": "Which FSMO role is the authoritative time source?", "a": "<strong>PDC emulator<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which FSMO role ensures unique SIDs?", "a": "<strong>RID master<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Which role should not be on a GC (multi-domain)?", "a": "<strong>Infrastructure master<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Who can modify the schema? Can you delete a schema attribute?", "a": "<strong>Schema Admins<\/strong>; <strong>no<\/strong>, only disable", "sec": "Active Directory & Windows Server"}, {"q": "GPO processing order?", "a": "<strong>Local, Site, Domain, OU, child OU<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Two default GPOs?", "a": "<strong>Default Domain Policy<\/strong>, <strong>Default Domain Controllers Policy<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Command to see applied GPOs?", "a": "<strong><code>gpresult /r<\/code><\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Must the DHCP server have a static IP?", "a": "<strong>Yes<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "What are the 4 DHCP steps?", "a": "<strong>Discover, Offer, Request, Acknowledge (DORA)<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Account to authorize DHCP in a multi-domain environment? Single domain?", "a": "<strong>Enterprise Admin<\/strong>; <strong>Domain Admins<\/strong> member", "sec": "Active Directory & Windows Server"}, {"q": "Command to find which DHCP server gave you your IP?", "a": "<strong><code>ipconfig /all<\/code><\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "DHCP failover: how many servers, which IP version, which port?", "a": "<strong>2<\/strong>, <strong>IPv4 only<\/strong>, <strong>TCP 647<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Tool for a reverse lookup?", "a": "<strong><code>nslookup<\/code><\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "How long does a client cache a DNS record?", "a": "Depends on the <strong>TTL<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Ways to flush the DNS cache?", "a": "<code>ipconfig /flushdns<\/code>, <strong>reboot<\/strong>, restart <strong>DNSCache<\/strong> service", "sec": "Active Directory & Windows Server"}, {"q": "Stub zone vs conditional forwarder?", "a": "Stub = only NS records, <strong>zone transfers<\/strong>; conditional forwarder = specific servers, <strong>recursion, no zone transfers<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "Main way DNS records get created in AD?", "a": "<strong>Dynamically<\/strong>", "sec": "Active Directory & Windows Server"}, {"q": "What replaced LDAP, Kerberos and GPOs in Entra ID?", "a": "<strong>Microsoft Graph (REST)<\/strong>; <strong>OAuth2/OIDC/SAML<\/strong>; <strong>Conditional Access + Intune<\/strong>", "sec": "Hybrid AD"}, {"q": "Which protocol is authorization, which adds authentication?", "a": "<strong>OAuth 2.0<\/strong> = authorization; <strong>OpenID Connect<\/strong> = authentication", "sec": "Hybrid AD"}, {"q": "Which direction does sync go?", "a": "<strong>On-prem AD DS → Entra ID only<\/strong>", "sec": "Hybrid AD"}, {"q": "Default auth method with Entra Connect?", "a": "<strong>Password Hash Sync<\/strong>", "sec": "Hybrid AD"}, {"q": "Method where passwords are never stored in the cloud and DCs validate them?", "a": "<strong>Pass-Through Authentication<\/strong>", "sec": "Hybrid AD"}, {"q": "Only method for on-prem MFA or smartcards?", "a": "<strong>AD FS (federation)<\/strong>", "sec": "Hybrid AD"}, {"q": "Accounts needed to install Entra Connect?", "a": "<strong>Global Admin<\/strong> (Azure), <strong>Enterprise Admin<\/strong> (on-prem), <strong>local admin<\/strong> on the server", "sec": "Hybrid AD"}, {"q": "Connect server goes down — what happens?", "a": "<strong>Sync stops; sign-ins still work<\/strong>", "sec": "Hybrid AD"}, {"q": "Tool to fix sync errors? Tool for batch attribute changes?", "a": "<strong>IdFix<\/strong>; <strong>ADModify.NET<\/strong>", "sec": "Hybrid AD"}, {"q": "Can you use Contoso.local for SSO?", "a": "<strong>No<\/strong> — domains must be routable", "sec": "Hybrid AD"}, {"q": "Seamless SSO requirements?", "a": "<strong>Domain-joined Windows device on the corporate network<\/strong>", "sec": "Hybrid AD"}, {"q": "Type 1 vs Type 2 — which is Hyper-V?", "a": "<strong>Type 1<\/strong> (bare metal)", "sec": "Hyper-V"}, {"q": "What is the Windows host called after adding Hyper-V?", "a": "<strong>Root / parent partition<\/strong> (management OS)", "sec": "Hyper-V"}, {"q": "Only way a partition can ask the hypervisor for something?", "a": "<strong>Hypercall<\/strong>", "sec": "Hyper-V"}, {"q": "Where do the VSC and VSP live?", "a": "<strong>VSC in the child (VM)<\/strong>, <strong>VSP in the root<\/strong>", "sec": "Hyper-V"}, {"q": "What replaced slow device emulation?", "a": "<strong>VMBus<\/strong> + synthetic devices", "sec": "Hyper-V"}, {"q": "VMMS vs VMWP?", "a": "VMMS = <strong>central management service<\/strong>; VMWP = <strong>one worker process per running VM<\/strong>", "sec": "Hyper-V"}, {"q": "CPU requirements?", "a": "<strong>64-bit, SLAT, Intel VT/AMD-V, DEP (XD/NX)<\/strong>", "sec": "Hyper-V"}, {"q": "Switch that lets VMs talk to each other but not the host?", "a": "<strong>Private<\/strong>", "sec": "Hyper-V"}, {"q": "VHD vs VHDX max size?", "a": "<strong>2 TB vs 64 TB<\/strong>", "sec": "Hyper-V"}, {"q": "What disk type are checkpoints?", "a": "<strong>Differencing<\/strong>", "sec": "Hyper-V"}, {"q": "Default checkpoint type?", "a": "<strong>Production<\/strong>", "sec": "Hyper-V"}, {"q": "PowerShell into a VM with no network?", "a": "<strong>PowerShell Direct<\/strong>", "sec": "Hyper-V"}, {"q": "Which devices does DDA support?", "a": "<strong>GPUs and NVMe<\/strong>", "sec": "Hyper-V"}, {"q": "Can you downgrade a VM configuration version?", "a": "<strong>No<\/strong>", "sec": "Hyper-V"}, {"q": "Which AVD parts does Microsoft manage?", "a": "<strong>Web Access, Gateway, Connection Broker, Diagnostics, Extensibility<\/strong>", "sec": "AVD"}, {"q": "Personal vs pooled host pool?", "a": "Personal = same host every time; pooled = any host", "sec": "AVD"}, {"q": "What's needed to add session hosts to a host pool?", "a": "A <strong>registration key<\/strong> (per pool, with an expiry)", "sec": "AVD"}, {"q": "Default load balancing? Which saves money?", "a": "<strong>Breadth-first<\/strong>; <strong>depth-first<\/strong>", "sec": "AVD"}, {"q": "Recommended profile solution and storage?", "a": "<strong>FSLogix<\/strong> on <strong>Azure Files<\/strong>", "sec": "AVD"}, {"q": "Which clients are NOT supported?", "a": "<strong>RADC and MSTSC<\/strong>", "sec": "AVD"}, {"q": "Port AVD uses?", "a": "<strong>TCP 443<\/strong>", "sec": "AVD"}, {"q": "Bandwidth for a heavy workload / 1080p?", "a": "<strong>5 Mbps<\/strong>", "sec": "AVD"}, {"q": "App attach advantage over MSIX app attach?", "a": "Package works across <strong>multiple host pools<\/strong>, upgrades without a maintenance window, per-user permissions, two versions at once", "sec": "AVD"}, {"q": "Three parts of PowerShell?", "a": "<strong>Shell, scripting language, DSC<\/strong>", "sec": "PowerShell"}, {"q": "What does PowerShell pass instead of text?", "a": "<strong>.NET objects<\/strong>", "sec": "PowerShell"}, {"q": "Default execution policy on clients? Servers?", "a": "<strong>Restricted<\/strong>; <strong>RemoteSigned<\/strong>", "sec": "PowerShell"}, {"q": "Which policy requires even local scripts to be signed?", "a": "<strong>AllSigned<\/strong>", "sec": "PowerShell"}, {"q": "Cmdlet naming convention?", "a": "<strong>Verb-Noun<\/strong>", "sec": "PowerShell"}, {"q": "What does <code>dir<\/code> run? <code>cd<\/code>?", "a": "<strong>Get-ChildItem<\/strong>; <strong>Set-Location<\/strong>", "sec": "PowerShell"}, {"q": "Script extension?", "a": "<strong>.ps1<\/strong>", "sec": "PowerShell"}, {"q": "Make non-terminating errors stop the script?", "a": "<strong><code>$ErrorActionPreference = 'Stop'<\/code><\/strong>", "sec": "PowerShell"}, {"q": "Which block always runs in Try/Catch/Finally?", "a": "<strong>Finally<\/strong>", "sec": "PowerShell"}, {"q": "Run a command on many computers at once?", "a": "<strong><code>Invoke-Command<\/code><\/strong>", "sec": "PowerShell"}, {"q": "ISE doesn't support which versions?", "a": "<strong>PowerShell 6 and 7<\/strong> (use VS Code)", "sec": "PowerShell"}]}, {"id": "messaging", "name": "Messaging Systems", "sub": "Exchange Server · Lessons 1, 3–6", "intro": "<p>Built only from your 5 Exchange Server lessons (1, 3, 4, 5, 6 — no Lesson 2 was included). These PDFs have no speaker notes, so everything comes from the slide text. Bold = likely exam answer.<\/p>", "sections": [{"id": "messaging-1", "n": 1, "title": "Exchange, Active Directory & DNS (Lesson 1)", "html": "<p><strong>Exchange Server<\/strong> = Microsoft's <strong>messaging and collaboration<\/strong> product. Main job is email, but also scheduling/calendaring and phone-system integration (<strong>Unified Messaging (UM) is deprecated<\/strong>).<\/p>\n<p><strong>Clients:<\/strong> <strong>Outlook<\/strong>, <strong>POP/IMAP<\/strong> clients, <strong>ActiveSync<\/strong> mobile clients, <strong>Outlook on the web (OWA)<\/strong>.<\/p>\n<p>Exchange is <strong>tightly integrated with Active Directory<\/strong> — AD's configuration affects how Exchange is deployed and configured.<\/p>\n<h3>Directory services &amp; AD components<\/h3>\n<ul>\n<li>A directory service stores info about users and network resources, and is used to <strong>authenticate<\/strong> (validate identity) and <strong>authorize<\/strong> (restrict access).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Contains<\/th>\n<th>Replicated to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Domain<\/strong> partition<\/td>\n<td>All objects in that domain<\/td>\n<td>All DCs <strong>in the domain<\/strong> (one partition per domain)<\/td>\n<\/tr>\n<tr>\n<td><strong>Schema<\/strong> partition<\/td>\n<td>All object types + attributes<\/td>\n<td>All DCs <strong>in the forest<\/strong> (one per forest)<\/td>\n<\/tr>\n<tr>\n<td><strong>Global Catalog<\/strong><\/td>\n<td><strong>Partial<\/strong>, searchable copy of all objects in every domain<\/td>\n<td>GC servers, via <strong>multi-master<\/strong> replication; used for faster searching<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Forest<\/strong>: holds multiple domains of one organization. The <strong>first DC creates the forest and the forest root domain<\/strong>. Later DCs join the root domain or create <strong>child domains<\/strong>.<\/li>\n<li><strong>Tree<\/strong>: one or more domains in a <strong>contiguous namespace<\/strong>.<\/li>\n<li><strong>OUs<\/strong>: the <strong>smallest element you can delegate admin rights to<\/strong>; organize objects by location, department, etc.; flexible inheritance.<\/li>\n<li><strong>Sites<\/strong>: <strong>physical<\/strong> grouping (domains are <strong>logical<\/strong>), based on <strong>connectivity/bandwidth<\/strong>, independent of domain structure; used to optimize replication over slow WAN links.<\/li>\n<\/ul>\n<h3>How Exchange uses AD<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>AD piece<\/th>\n<th>Exchange use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Forest<\/strong><\/td>\n<td><strong>One-to-one<\/strong> relationship (one Exchange org per forest)<\/td>\n<\/tr>\n<tr>\n<td><strong>Schema<\/strong><\/td>\n<td>Exchange object classes and attributes<\/td>\n<\/tr>\n<tr>\n<td><strong>Configuration<\/strong><\/td>\n<td>Exchange config replicates <strong>throughout the forest<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Domain<\/strong><\/td>\n<td>Recipient info like email addresses<\/td>\n<\/tr>\n<tr>\n<td><strong>Global Catalog<\/strong><\/td>\n<td>Mail object attributes incl. the <strong>Global Address List (GAL)<\/strong> and <strong>mailbox locations<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>DNS and AD<\/h3>\n<ul>\n<li>Clients find DCs by querying DNS for <strong>SRV records<\/strong>.<\/li>\n<li>Every Exchange server uses DNS to find AD and GC servers. Exchange is <strong>site-aware<\/strong> — prefers DCs in the <strong>same AD site<\/strong>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Record<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A / AAAA<\/strong> (host)<\/td>\n<td>Hostname → IP<\/td>\n<\/tr>\n<tr>\n<td><strong>PTR<\/strong> (reverse)<\/td>\n<td>IP → name<\/td>\n<\/tr>\n<tr>\n<td><strong>CNAME<\/strong> (alias)<\/td>\n<td>Alias pointing to the canonical name<\/td>\n<\/tr>\n<tr>\n<td><strong>MX<\/strong><\/td>\n<td>Points to the A records of your <strong>SMTP servers<\/strong>; has a <strong>priority — lower number = preferred<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>SRV<\/strong><\/td>\n<td>Servers offering specific services (e.g. AD)<\/td>\n<\/tr>\n<tr>\n<td><strong>SPF<\/strong><\/td>\n<td>A <strong>TXT<\/strong> record listing which mail servers may <strong>send email for your domain<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Groups<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Distribution group<\/th>\n<th>Security group<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Email only<\/strong>, has an email address<\/td>\n<td><strong>Main<\/strong> AD group type<\/td>\n<\/tr>\n<tr>\n<td><strong>Can't<\/strong> be given permissions<\/td>\n<td><strong>Can<\/strong> be given permissions; can also be used for mail<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Scope<\/th>\n<th>Members<\/th>\n<th>Permissions to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Domain local<\/strong><\/td>\n<td>Users, computers, global and universal groups <strong>from any domain<\/strong><\/td>\n<td>Resources <strong>in its own domain<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Global<\/strong><\/td>\n<td>Users and computers <strong>from its own domain<\/strong><\/td>\n<td>Resources in <strong>any domain<\/strong> in the tree/forest<\/td>\n<\/tr>\n<tr>\n<td><strong>Universal<\/strong><\/td>\n<td>Users, computers, global and universal groups from <strong>any domain in the forest<\/strong><\/td>\n<td>Resources in <strong>any domain in the forest<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>FSMO roles<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Scope<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Schema Master<\/strong><\/td>\n<td>Forest<\/td>\n<td>All schema updates<\/td>\n<\/tr>\n<tr>\n<td><strong>Domain Naming Master<\/strong><\/td>\n<td>Forest<\/td>\n<td>Add/remove domains<\/td>\n<\/tr>\n<tr>\n<td><strong>PDC Master<\/strong><\/td>\n<td>Domain<\/td>\n<td>NT 4.0 backward compatibility, <strong>password changes &amp; lockouts<\/strong>, <strong>time sync<\/strong>, GPO edits, domain master browser<\/td>\n<\/tr>\n<tr>\n<td><strong>RID Master<\/strong><\/td>\n<td>Domain<\/td>\n<td>Gives <strong>RID pools<\/strong> to DCs (<strong>500<\/strong> SIDs per pool)<\/td>\n<\/tr>\n<tr>\n<td><strong>Infrastructure Master<\/strong><\/td>\n<td>Domain<\/td>\n<td>Tracks which objects belong to which domain; updates group member names/locations<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "messaging-2", "n": 2, "title": "Certificate Procedures (Lesson 3)", "html": "<p>Certificates are key to secure messaging. Manage them in the <strong>Exchange admin center (EAC)<\/strong> or the <strong>Exchange Management Shell<\/strong>. EAC certificate management helps by <strong>minimizing the number of certificates<\/strong>, minimizing interaction, and allowing <strong>centralized<\/strong> install/management on all Exchange servers.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Procedure<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Create a certificate request (CSR)<\/strong><\/td>\n<td><strong>First step<\/strong> to install a new cert for <strong>TLS<\/strong>. Send the CSR to a <strong>CA<\/strong> (internal like <strong>AD Certificate Services<\/strong>, or commercial — same steps); the CA issues the cert, you install it later<\/td>\n<\/tr>\n<tr>\n<td><strong>Self-signed certificate<\/strong><\/td>\n<td>One is <strong>auto-installed<\/strong> when Exchange is installed. Good for <strong>internal server-to-server<\/strong> encryption; <strong>bad for external<\/strong> connections because clients don't automatically trust it. <code>New-ExchangeCertificate<\/code> can assign services during creation<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Assign to services<\/strong><\/td>\n<td>A cert must be <strong>assigned to Exchange services<\/strong> before it's used. <strong>You can't remove an assignment<\/strong> — assign a different cert, then remove the unwanted one. May need to <strong>restart IIS<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Renew<\/strong><\/td>\n<td>Default self-signed cert <strong>expires 5 years<\/strong> after install. Renew a CA cert <strong>with the same CA<\/strong>; changing CAs or a problem cert → <strong>new CSR<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Export<\/strong><\/td>\n<td>For backup or use on other servers. Produces a <strong>password-protected binary PKCS #12<\/strong> file <strong>with the private key<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Import/install<\/strong><\/td>\n<td>Internal SMTP between Exchange servers is encrypted by the <strong>default self-signed cert<\/strong>; for clients/external, use a cert that's <strong>automatically trusted<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "messaging-3", "n": 3, "title": "Mailbox Databases (Lesson 4)", "html": "<p>Users now want big mailboxes, so the Exchange database engine is optimized for <strong>larger, slower, cheaper disks<\/strong>.<\/p>\n<ul>\n<li>Databases are mounted and managed by the <strong>Microsoft Exchange Information Store Service<\/strong>. The database engine is <strong>ESE (Extensible Storage Engine)<\/strong>. <strong>Stopping the Information Store Service dismounts all databases<\/strong> on the server.<\/li>\n<li><strong>Transaction logs<\/strong>: every change (new/deleted/changed email, attachments) is written to a <strong>transaction log first, then the database<\/strong>. Full log files are replaced by new ones continuously, like a production line.<\/li>\n<\/ul>\n<h3>Storage planning<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Max databases — <strong>Standard<\/strong> Edition<\/td>\n<td><strong>5<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Max databases — <strong>Enterprise<\/strong> Edition<\/td>\n<td><strong>100<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Recommended max DB size <strong>without replication<\/strong> (may need restore)<\/td>\n<td><strong>200 GB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Recommended max DB size <strong>with a DAG<\/strong> (at least <strong>3 copies<\/strong>)<\/td>\n<td><strong>2 TB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Restore time vs backup time<\/td>\n<td>Restore ≈ <strong>2×<\/strong> the backup time<\/td>\n<\/tr>\n<tr>\n<td>Transaction log space to plan<\/td>\n<td><strong>7–10 days<\/strong>; about <strong>9 GB per 1,000 average users<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Extra space per DB (dumpster, deleted mailboxes, whitespace)<\/td>\n<td><strong>10–15%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Max DB size should be based on <strong>backup/restore time<\/strong> for disaster recovery. With multiple replicated copies in a <strong>DAG (Database Availability Group)<\/strong>, you may not need backups at all.<\/li>\n<li><strong>Circular logging<\/strong> means you don't need extra disk for logs.<\/li>\n<li>In a DAG, <strong>logs only purge after successful replication (even with circular logging)<\/strong> — plan for network outages letting logs pile up.<\/li>\n<li><strong>Recoverable item space<\/strong> = the <strong>database dumpster<\/strong> (deleted items).<\/li>\n<\/ul>\n<h3>Archive mailboxes<\/h3>\n<ul>\n<li>A <strong>secondary mailbox \"joined at the hip\"<\/strong> (\"Siamese\") to the primary, for older, rarely used email.<\/li>\n<li>Primary and archive <strong>don't have to be in the same database<\/strong>.<\/li>\n<li>The archive <strong>can't be cached offline in an OST<\/strong> in Outlook.<\/li>\n<li>Lets admins give users more storage while keeping all email accessible.<\/li>\n<\/ul>\n<h3>How many databases?<\/h3>\n<ul>\n<li>The <strong>main factor is RTO (Recovery Time Objective)<\/strong> — several smaller DBs let you restore important mailboxes first.<\/li>\n<li>Performance: number of DBs only matters if spread across separate disks. Without a DAG, use <strong>RAID<\/strong>; with one RAID pool, 1 DB or 10 performs the same.<\/li>\n<li>Without a DAG, put each database's <strong>transaction logs on separate disk spindles<\/strong> from the DB files — helps performance but mainly <strong>recoverability<\/strong>.<\/li>\n<li>Another reason for multiple DBs: different <strong>mailbox limits<\/strong> (size, retention period).<\/li>\n<\/ul>\n<p><strong>Management tasks:<\/strong> create, view, <strong>move the .EDB file<\/strong>, move the log files, <strong>mount/dismount<\/strong> databases.<\/p>", "practice": false}, {"id": "messaging-4", "n": 4, "title": "Recipient Types (Lesson 5)", "html": "<p>Each recipient type has a unique value in the <strong>RecipientTypeDetails<\/strong> property (Exchange Management Shell) and shows in the EAC. Benefits: tell types apart at a glance, search/sort by type, easier <strong>bulk management<\/strong>, and type-specific property pages (e.g. <strong>capacity<\/strong> shows for a room mailbox, not a user mailbox).<\/p>\n<h3>Mailboxes<\/h3>\n<ul>\n<li>Most common recipient type. <strong>Each mailbox = an AD user account + mailbox data in the mailbox database.<\/strong><\/li>\n<li><strong>Configuration<\/strong> lives in the <strong>Exchange attributes of the AD user object<\/strong>; the <strong>database<\/strong> holds the actual mail data.<\/li>\n<li><strong>Remove<\/strong> a mailbox → mailbox data marked for deletion <strong>and the AD user is deleted<\/strong>. <strong>Disable<\/strong> a mailbox → <strong>keeps the AD account<\/strong>, deletes only the mailbox data.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mailbox type<\/th>\n<th>Used for<\/th>\n<th>AD account<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>User<\/strong><\/td>\n<td>Individual users — mail, contacts, meetings, tasks; most common<\/td>\n<td>Normal user<\/td>\n<\/tr>\n<tr>\n<td><strong>Linked<\/strong><\/td>\n<td>Users in a <strong>separate, trusted forest<\/strong> — for a <strong>resource forest<\/strong> design (Exchange centralized in one forest)<\/td>\n<td>Accessed from the trusted forest<\/td>\n<\/tr>\n<tr>\n<td><strong>Shared<\/strong><\/td>\n<td>Accessed by <strong>multiple users<\/strong>; you must assign permissions to everyone who needs it<\/td>\n<td><strong>Must be disabled<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Resource — Room<\/strong><\/td>\n<td>Meeting locations (conference rooms, auditoriums, training rooms)<\/td>\n<td><strong>Must be disabled<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Resource — Equipment<\/strong><\/td>\n<td>Non-location resources (laptops, projectors, mics, <strong>company cars<\/strong>)<\/td>\n<td><strong>Must be disabled<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>System<\/strong><\/td>\n<td>Created by Exchange in the <strong>forest root domain<\/strong> at install, for UM, migration, message approval, <strong>In-Place eDiscovery<\/strong><\/td>\n<td><strong>No one can sign in<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Other recipients<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Mail contact<\/th>\n<th>Mail user<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>External email address<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Shows in the GAL<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>AD logon credentials / access to resources<\/strong><\/td>\n<td><strong>No<\/strong><\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Typical use<\/td>\n<td>External people who <strong>don't need internal access<\/strong><\/td>\n<td><strong>Short-term consultants<\/strong> using their own email but needing network access; users who shouldn't have an Exchange mailbox<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Mail to a contact is <strong>automatically forwarded<\/strong> to their external address. Contacts can be members of distribution groups.<\/p>\n<h3>Groups<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>Mail-enabled?<\/th>\n<th>Permissions?<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Security group<\/strong><\/td>\n<td><strong>No<\/strong><\/td>\n<td>Yes<\/td>\n<td>Access to resources<\/td>\n<\/tr>\n<tr>\n<td><strong>Distribution group<\/strong><\/td>\n<td>Yes<\/td>\n<td><strong>No<\/strong><\/td>\n<td><strong>Universal<\/strong> distribution group; messages only<\/td>\n<\/tr>\n<tr>\n<td><strong>Mail-enabled security group<\/strong><\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td><strong>Universal<\/strong> security group; permissions + mail<\/td>\n<\/tr>\n<tr>\n<td><strong>Dynamic distribution group<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>Membership from <strong>recipient filters<\/strong>, not a fixed list<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Public folders<\/h3>\n<ul>\n<li><strong>Shared access<\/strong>; organize content in a <strong>deep hierarchy<\/strong> users browse (full hierarchy always shown in Outlook).<\/li>\n<li>Great for <strong>distribution group archiving<\/strong>: mail-enable the folder and add it to the group, so mail to the group is saved there.<\/li>\n<li>Simple document sharing <strong>without SharePoint<\/strong>.<\/li>\n<\/ul>", "practice": false}, {"id": "messaging-5", "n": 5, "title": "Managing Recipients (Lesson 6)", "html": "<p>Mailbox properties page sections: <strong>General, Mailbox Usage, Contact Information, Organization, Email Address, Mailbox Features, Member Of, MailTip, Mailbox Delegation<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>What's there<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>General<\/strong><\/td>\n<td>First/last name, initials; <strong>Name<\/strong> (AD name, max <strong>64<\/strong> characters); <strong>Display name<\/strong> (address book, To/From lines); user logon name; require password change; <strong>Hide from address lists<\/strong>; OU and <strong>mailbox database<\/strong> (read-only); up to <strong>15 custom attributes<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Mailbox Usage<\/strong><\/td>\n<td><strong>Storage quota<\/strong> and <strong>deleted item retention<\/strong> — default to the <strong>database's settings<\/strong>, can be customized per mailbox; last logon; % of quota used<\/td>\n<\/tr>\n<tr>\n<td><strong>Contact Information<\/strong><\/td>\n<td>Shown in the address book. <strong>State/Province<\/strong> can be used as a condition for <strong>dynamic distribution groups, email address policies, address lists<\/strong>. Users can edit their own info in Outlook/OWA <strong>except Notes and Web page<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Organization<\/strong><\/td>\n<td>User's role; shown in the address book; builds a <strong>virtual org chart<\/strong> in Outlook<\/td>\n<\/tr>\n<tr>\n<td><strong>Email Address<\/strong><\/td>\n<td><strong>Primary SMTP address<\/strong> (= <strong>default reply address<\/strong>, shown <strong>bold<\/strong> with uppercase <strong>SMTP<\/strong> type) plus <strong>proxy addresses<\/strong>. \"Make this the reply address\" sets the primary<\/td>\n<\/tr>\n<tr>\n<td><strong>Member Of<\/strong><\/td>\n<td>Groups the user belongs to — <strong>can't change membership here<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>MailTip<\/strong><\/td>\n<td>Text shown in the <strong>InfoBar<\/strong> when someone adds this recipient to To/Cc/Bcc<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Mailbox Features<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Default / meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sharing policy<\/strong><\/td>\n<td>Controls sharing <strong>calendar/contacts with people outside<\/strong> the org<\/td>\n<\/tr>\n<tr>\n<td>Role assignment policy<\/td>\n<td>Assigned role policy<\/td>\n<\/tr>\n<tr>\n<td>Retention policy<\/td>\n<td>Assigned retention policy<\/td>\n<\/tr>\n<tr>\n<td><strong>Address book policy<\/strong><\/td>\n<td><strong>Segments users<\/strong> into groups with custom address book views<\/td>\n<\/tr>\n<tr>\n<td>Unified Messaging<\/td>\n<td>Disabled by default; <strong>not in Exchange 2019<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mobile Devices<\/td>\n<td>Exchange <strong>ActiveSync<\/strong> and OWA for devices<\/td>\n<\/tr>\n<tr>\n<td><strong>Outlook Web App, IMAP, POP3, MAPI<\/strong><\/td>\n<td>All <strong>enabled by default<\/strong> (MAPI = Outlook access)<\/td>\n<\/tr>\n<tr>\n<td><strong>Litigation hold<\/strong><\/td>\n<td><strong>Disabled by default<\/strong>; preserves deleted items and records changes; returned in <strong>discovery search<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Archiving<\/td>\n<td>Disabled if no archive mailbox exists<\/td>\n<\/tr>\n<tr>\n<td>Delivery Options<\/td>\n<td><strong>Forwarding<\/strong> + max recipients per message<\/td>\n<\/tr>\n<tr>\n<td>Message Size Restrictions<\/td>\n<td>Max size sent/received<\/td>\n<\/tr>\n<tr>\n<td>Message Delivery Restrictions<\/td>\n<td><strong>Who can send<\/strong> to this user<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Mailbox Delegation permissions<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Permission<\/th>\n<th>Lets the delegate…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Send As<\/strong><\/td>\n<td>Send mail <strong>as<\/strong> the mailbox owner (looks like it came from them)<\/td>\n<\/tr>\n<tr>\n<td><strong>Send on Behalf Of<\/strong><\/td>\n<td>Send mail, but recipients <strong>see the delegate sent it on behalf of<\/strong> the owner<\/td>\n<\/tr>\n<tr>\n<td><strong>Full Access<\/strong><\/td>\n<td><strong>Open and read<\/strong> the mailbox, but <strong>can't send<\/strong> — needs Send As or Send on Behalf too<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "messaging-6", "n": 6, "title": "Cram Sheet & Practice Questions", "html": "<h3>Numbers to know<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Max mailbox DBs: Standard / Enterprise<\/td>\n<td><strong>5 / 100<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Max DB size: no replication / DAG (3+ copies)<\/td>\n<td><strong>200 GB / 2 TB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Log space<\/td>\n<td><strong>7–10 days<\/strong>, \\~<strong>9 GB per 1,000 users<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Extra DB space<\/td>\n<td><strong>10–15%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Restore time<\/td>\n<td>≈ <strong>2× backup time<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Self-signed cert lifetime<\/td>\n<td><strong>5 years<\/strong><\/td>\n<\/tr>\n<tr>\n<td>RID pool<\/td>\n<td><strong>500<\/strong> SIDs<\/td>\n<\/tr>\n<tr>\n<td>AD Name field<\/td>\n<td>max <strong>64<\/strong> chars<\/td>\n<\/tr>\n<tr>\n<td>Custom attributes<\/td>\n<td><strong>15<\/strong><\/td>\n<\/tr>\n<tr>\n<td>MX priority<\/td>\n<td><strong>Lower number wins<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Practice questions<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Which Exchange feature is deprecated?<\/td>\n<td><strong>Unified Messaging (UM)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Four Exchange client types?<\/td>\n<td><strong>Outlook, POP/IMAP, ActiveSync, OWA<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Which partition replicates to the whole forest: domain or schema?<\/td>\n<td><strong>Schema<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Smallest AD element you can delegate admin rights to?<\/td>\n<td><strong>OU<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Sites are logical or physical?<\/td>\n<td><strong>Physical<\/strong> (based on bandwidth)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Where does Exchange store the GAL and mailbox locations?<\/td>\n<td><strong>Global Catalog<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Which DNS record lets clients find DCs?<\/td>\n<td><strong>SRV<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Which record lists allowed sending mail servers? What type is it?<\/td>\n<td><strong>SPF<\/strong>; a <strong>TXT<\/strong> record<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Two MX records, priority 10 and 20 — which gets mail first?<\/td>\n<td><strong>10<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Can a distribution group be given permissions?<\/td>\n<td><strong>No<\/strong><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Which group scope can only assign permissions in its own domain?<\/td>\n<td><strong>Domain local<\/strong><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Which FSMO role handles time sync and password lockouts?<\/td>\n<td><strong>PDC<\/strong><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>First step to install a CA certificate for TLS?<\/td>\n<td><strong>Create a certificate request (CSR)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Why not use self-signed certs for external clients?<\/td>\n<td>Clients <strong>don't automatically trust<\/strong> them<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Can you remove a cert's service assignment?<\/td>\n<td><strong>No<\/strong> — assign another cert, then remove the old one<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Renewing a CA cert — which CA?<\/td>\n<td><strong>The same CA<\/strong> (else new CSR)<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Export file format?<\/td>\n<td><strong>Password-protected PKCS #12<\/strong> with the <strong>private key<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>What happens if you stop the Information Store Service?<\/td>\n<td><strong>All databases dismount<\/strong><\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>Exchange database engine name?<\/td>\n<td><strong>ESE<\/strong> (Extensible Storage Engine)<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>Written first: transaction log or database?<\/td>\n<td><strong>Transaction log<\/strong><\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>In a DAG, when do logs purge?<\/td>\n<td>Only after <strong>successful replication<\/strong> (even with circular logging)<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>Main factor for number of databases?<\/td>\n<td><strong>RTO<\/strong><\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Can an archive mailbox be in a different DB? Cached in an OST?<\/td>\n<td><strong>Yes<\/strong>; <strong>No<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>Remove vs disable a mailbox?<\/td>\n<td>Remove deletes the <strong>AD user<\/strong> too; disable <strong>keeps the AD account<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Which mailbox types need a disabled AD account?<\/td>\n<td><strong>Shared, Room, Equipment<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>Mailbox type for users in a trusted resource-forest setup?<\/td>\n<td><strong>Linked<\/strong><\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>Mailbox type for a projector or company car?<\/td>\n<td><strong>Equipment<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>External consultant needing network access with their own email?<\/td>\n<td><strong>Mail user<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Group whose members come from recipient filters?<\/td>\n<td><strong>Dynamic distribution group<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>Group that gives permissions AND receives mail?<\/td>\n<td><strong>Mail-enabled security group<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>What's the default reply address? How is it shown?<\/td>\n<td><strong>Primary SMTP address<\/strong>, <strong>bold<\/strong> with uppercase <strong>SMTP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>Which protocols are enabled by default on a mailbox?<\/td>\n<td><strong>OWA, IMAP, POP3, MAPI<\/strong><\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>Is litigation hold on by default?<\/td>\n<td><strong>No<\/strong><\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>Full Access lets the delegate send mail?<\/td>\n<td><strong>No<\/strong> — needs Send As or Send on Behalf<\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>Send As vs Send on Behalf?<\/td>\n<td>Send As looks like the owner sent it; Send on Behalf <strong>shows the delegate<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": true}], "cards": [{"q": "Which Exchange feature is deprecated?", "a": "<strong>Unified Messaging (UM)<\/strong>", "sec": "Messaging Systems"}, {"q": "Four Exchange client types?", "a": "<strong>Outlook, POP/IMAP, ActiveSync, OWA<\/strong>", "sec": "Messaging Systems"}, {"q": "Which partition replicates to the whole forest: domain or schema?", "a": "<strong>Schema<\/strong>", "sec": "Messaging Systems"}, {"q": "Smallest AD element you can delegate admin rights to?", "a": "<strong>OU<\/strong>", "sec": "Messaging Systems"}, {"q": "Sites are logical or physical?", "a": "<strong>Physical<\/strong> (based on bandwidth)", "sec": "Messaging Systems"}, {"q": "Where does Exchange store the GAL and mailbox locations?", "a": "<strong>Global Catalog<\/strong>", "sec": "Messaging Systems"}, {"q": "Which DNS record lets clients find DCs?", "a": "<strong>SRV<\/strong>", "sec": "Messaging Systems"}, {"q": "Which record lists allowed sending mail servers? What type is it?", "a": "<strong>SPF<\/strong>; a <strong>TXT<\/strong> record", "sec": "Messaging Systems"}, {"q": "Two MX records, priority 10 and 20 — which gets mail first?", "a": "<strong>10<\/strong>", "sec": "Messaging Systems"}, {"q": "Can a distribution group be given permissions?", "a": "<strong>No<\/strong>", "sec": "Messaging Systems"}, {"q": "Which group scope can only assign permissions in its own domain?", "a": "<strong>Domain local<\/strong>", "sec": "Messaging Systems"}, {"q": "Which FSMO role handles time sync and password lockouts?", "a": "<strong>PDC<\/strong>", "sec": "Messaging Systems"}, {"q": "First step to install a CA certificate for TLS?", "a": "<strong>Create a certificate request (CSR)<\/strong>", "sec": "Messaging Systems"}, {"q": "Why not use self-signed certs for external clients?", "a": "Clients <strong>don't automatically trust<\/strong> them", "sec": "Messaging Systems"}, {"q": "Can you remove a cert's service assignment?", "a": "<strong>No<\/strong> — assign another cert, then remove the old one", "sec": "Messaging Systems"}, {"q": "Renewing a CA cert — which CA?", "a": "<strong>The same CA<\/strong> (else new CSR)", "sec": "Messaging Systems"}, {"q": "Export file format?", "a": "<strong>Password-protected PKCS #12<\/strong> with the <strong>private key<\/strong>", "sec": "Messaging Systems"}, {"q": "What happens if you stop the Information Store Service?", "a": "<strong>All databases dismount<\/strong>", "sec": "Messaging Systems"}, {"q": "Exchange database engine name?", "a": "<strong>ESE<\/strong> (Extensible Storage Engine)", "sec": "Messaging Systems"}, {"q": "Written first: transaction log or database?", "a": "<strong>Transaction log<\/strong>", "sec": "Messaging Systems"}, {"q": "In a DAG, when do logs purge?", "a": "Only after <strong>successful replication<\/strong> (even with circular logging)", "sec": "Messaging Systems"}, {"q": "Main factor for number of databases?", "a": "<strong>RTO<\/strong>", "sec": "Messaging Systems"}, {"q": "Can an archive mailbox be in a different DB? Cached in an OST?", "a": "<strong>Yes<\/strong>; <strong>No<\/strong>", "sec": "Messaging Systems"}, {"q": "Remove vs disable a mailbox?", "a": "Remove deletes the <strong>AD user<\/strong> too; disable <strong>keeps the AD account<\/strong>", "sec": "Messaging Systems"}, {"q": "Which mailbox types need a disabled AD account?", "a": "<strong>Shared, Room, Equipment<\/strong>", "sec": "Messaging Systems"}, {"q": "Mailbox type for users in a trusted resource-forest setup?", "a": "<strong>Linked<\/strong>", "sec": "Messaging Systems"}, {"q": "Mailbox type for a projector or company car?", "a": "<strong>Equipment<\/strong>", "sec": "Messaging Systems"}, {"q": "External consultant needing network access with their own email?", "a": "<strong>Mail user<\/strong>", "sec": "Messaging Systems"}, {"q": "Group whose members come from recipient filters?", "a": "<strong>Dynamic distribution group<\/strong>", "sec": "Messaging Systems"}, {"q": "Group that gives permissions AND receives mail?", "a": "<strong>Mail-enabled security group<\/strong>", "sec": "Messaging Systems"}, {"q": "What's the default reply address? How is it shown?", "a": "<strong>Primary SMTP address<\/strong>, <strong>bold<\/strong> with uppercase <strong>SMTP<\/strong>", "sec": "Messaging Systems"}, {"q": "Which protocols are enabled by default on a mailbox?", "a": "<strong>OWA, IMAP, POP3, MAPI<\/strong>", "sec": "Messaging Systems"}, {"q": "Is litigation hold on by default?", "a": "<strong>No<\/strong>", "sec": "Messaging Systems"}, {"q": "Full Access lets the delegate send mail?", "a": "<strong>No<\/strong> — needs Send As or Send on Behalf", "sec": "Messaging Systems"}, {"q": "Send As vs Send on Behalf?", "a": "Send As looks like the owner sent it; Send on Behalf <strong>shows the delegate<\/strong>", "sec": "Messaging Systems"}]}];
const $ = (s, el=document) => el.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const COLORS = {security:'var(--sec)', windows:'var(--win)', messaging:'var(--msg)'};
let course = DATA.find(c => c.id === location.hash.slice(1)) || DATA.find(c => c.id === store.get('course')) || DATA[0];
let mode = store.get('mode', 'study');

/* ---------- Course switcher ---------- */
const nav = $('#courses');
DATA.forEach(c => {
  const b = document.createElement('button');
  b.id = 'c-' + c.id;
  b.innerHTML = `<span class="dot" style="background:${COLORS[c.id]}"></span><span class="long">${c.name}</span><span class="short">${c.name.split(' ')[c.id==='security'?1:0]}</span>`;
  b.onclick = () => { course = c; store.set('course', c.id); try{ history.replaceState(null,'','#'+c.id) }catch(e){} $('#q').value=''; render(); window.scrollTo({top:0}); };
  nav.appendChild(b);
});
$('#m-study').onclick = () => { mode='study'; store.set('mode',mode); render(); };
$('#m-cards').onclick = () => { mode='cards'; store.set('mode',mode); render(); };

function render(){
  document.body.dataset.course = course.id;
  DATA.forEach(c => $('#c-'+c.id).setAttribute('aria-pressed', c===course));
  $('#m-study').setAttribute('aria-pressed', mode==='study');
  $('#m-cards').setAttribute('aria-pressed', mode==='cards');
  $('#m-cards').textContent = `Flashcards (${course.cards.length})`;
  $('.search').hidden = mode !== 'study';
  renderMast();
  mode === 'study' ? renderStudy() : renderCards();
}

function renderMast(){
  const known = store.get('known-'+course.id, []).length;
  $('#mast').innerHTML = `
    <div class="eyebrow">${course.sub}</div>
    <h1>${course.name}</h1>
    <div class="intro">${course.intro}</div>
    <div class="stats">
      <span class="stat"><b>${course.sections.length}</b> sections</span>
      <span class="stat"><b>${course.cards.length}</b> practice questions</span>
      <span class="stat"><b>${known}</b> / ${course.cards.length} marked known</span>
    </div>`;
}

/* ---------- Study mode ---------- */
function renderStudy(){
  const openSet = new Set(store.get('open-'+course.id, [course.sections[0].id]));
  $('#view').innerHTML = `
    <div class="study">
      <aside class="toc">
        <h2>Sections</h2>
        <ol>${course.sections.map(s => `<li><a href="#${s.id}" data-id="${s.id}"><span>${String(s.n).padStart(2,'0')}</span>${s.title}</a></li>`).join('')}</ol>
        <div class="all"><button class="btn" id="expand">Expand all</button><button class="btn" id="collapse">Collapse all</button></div>
      </aside>
      <div>
        <p class="status" id="status" aria-live="polite"></p>
        <div class="sections">${course.sections.map(s => `
          <details class="sec" id="${s.id}" ${openSet.has(s.id)?'open':''}>
            <summary><span class="num">${String(s.n).padStart(2,'0')}</span><h2>${s.title}${s.practice?'<span class="tag">Quiz</span>':''}</h2>
              <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
            <div class="body">${s.html}</div>
          </details>`).join('')}</div>
      </div>
    </div>`;
  // remember the sections the reader has open
  document.querySelectorAll('details.sec').forEach(d => d.addEventListener('toggle', saveOpen));
  $('#expand').onclick = () => { document.querySelectorAll('details.sec').forEach(d => d.open = true); saveOpen(); };
  $('#collapse').onclick = () => { document.querySelectorAll('details.sec').forEach(d => d.open = false); saveOpen(); };
  document.querySelectorAll('.toc a').forEach(a => a.onclick = e => {
    e.preventDefault();
    const d = document.getElementById(a.dataset.id); d.open = true; saveOpen();
    d.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  });
  setupPractice();
  if ($('#q').value) runSearch();
}
function saveOpen(){
  store.set('open-'+course.id, [...document.querySelectorAll('details.sec[open]')].map(d => d.id));
}

function setupPractice(){
  document.querySelectorAll('.body .tw table').forEach(t => {
    const heads = [...t.querySelectorAll('th')].map(th => th.textContent.trim());
    const ai = heads.indexOf('Answer');
    if (ai < 0 || heads.indexOf('Question') < 0) return;
    t.querySelectorAll('tbody tr').forEach(r => { const c = r.children[ai]; if (c) { c.classList.add('ans'); c.onclick = () => c.classList.toggle('shown'); } });
    const wrap = t.closest('.tw');
    let hidden = store.get('hideAns', true);
    wrap.classList.toggle('hide-ans', hidden);
    const bar = document.createElement('div');
    bar.className = 'qa-tools';
    bar.innerHTML = `<button class="btn">${hidden ? 'Show all answers' : 'Hide answers'}</button><span>${hidden ? 'Tap an answer to reveal it.' : ''}</span><button class="btn primary">Practice as flashcards</button>`;
    const [tog, hint, fcb] = [bar.children[0], bar.children[1], bar.children[2]];
    tog.onclick = () => {
      hidden = !hidden; store.set('hideAns', hidden);
      wrap.classList.toggle('hide-ans', hidden);
      wrap.querySelectorAll('td.ans').forEach(c => c.classList.remove('shown'));
      tog.textContent = hidden ? 'Show all answers' : 'Hide answers';
      hint.textContent = hidden ? 'Tap an answer to reveal it.' : '';
    };
    fcb.onclick = () => { mode='cards'; store.set('mode',mode); render(); window.scrollTo({top:0}); };
    wrap.before(bar);
  });
}

/* Search: highlight matches, hide sections without any */
let searchT;
$('#q').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(runSearch, 120); });
$('#qclear').onclick = () => { $('#q').value=''; runSearch(); $('#q').focus(); };
function unmark(root){
  root.querySelectorAll('mark').forEach(m => { m.replaceWith(document.createTextNode(m.textContent)); });
  root.normalize();
}
function runSearch(){
  const term = $('#q').value.trim();
  $('#qclear').hidden = !term;
  const secs = [...document.querySelectorAll('details.sec')];
  const status = $('#status');
  secs.forEach(d => unmark(d));
  if (!term){
    secs.forEach(d => d.hidden = false);
    document.querySelectorAll('.toc a').forEach(a => a.classList.remove('hit','dim'));
    const openSet = new Set(store.get('open-'+course.id, []));
    secs.forEach(d => d.open = openSet.has(d.id));
    if (status) status.textContent = '';
    return;
  }
  const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  let total = 0, inSecs = 0;
  secs.forEach(d => {
    let n = 0;
    const walker = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const t = node.nodeValue; re.lastIndex = 0;
      if (!re.test(t)) return;
      re.lastIndex = 0;
      const frag = document.createDocumentFragment(); let last = 0, m;
      while ((m = re.exec(t))){ frag.append(t.slice(last, m.index)); const mk = document.createElement('mark'); mk.textContent = m[0]; frag.append(mk); last = m.index + m[0].length; n++; }
      frag.append(t.slice(last)); node.replaceWith(frag);
    });
    d.hidden = n === 0; if (n) { d.open = true; inSecs++; total += n; d.querySelectorAll('td.ans').forEach(c => c.classList.add('shown')); }
    const a = document.querySelector(`.toc a[data-id="${d.id}"]`);
    if (a){ a.classList.toggle('hit', n>0); a.classList.toggle('dim', n===0); }
  });
  status.textContent = total ? `${total} match${total>1?'es':''} in ${inSecs} section${inSecs>1?'s':''}` : `No matches for "${term}" in ${course.name}. Try another word or switch course.`;
}

/* ---------- Flashcards ---------- */
let deck = [], pos = 0, filter = 'all', secFilter = '';
function buildDeck(shuffle){
  const known = new Set(store.get('known-'+course.id, []));
  deck = course.cards.map((c,i) => ({...c, i})).filter(c =>
    (filter === 'all' || (filter === 'left' ? !known.has(c.i) : known.has(c.i))) && (!secFilter || c.sec === secFilter));
  if (shuffle) for (let i = deck.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]] = [deck[j],deck[i]]; }
  pos = 0;
}
function renderCards(){
  const secs = [...new Set(course.cards.map(c => c.sec))];
  $('#view').innerHTML = `
    <div class="fc">
      <div class="fc-top">
        <div class="seg" role="group" aria-label="Which cards">
          <button data-f="all">All</button><button data-f="left">Still learning</button><button data-f="known">Known</button>
        </div>
        ${secs.length > 1 ? `<select id="fsec" aria-label="Topic"><option value="">All topics</option>${secs.map(s=>`<option>${s}</option>`).join('')}</select>` : ''}
        <div style="display:flex;gap:6px"><button class="btn" id="shuf">Shuffle</button><button class="btn" id="reset">Reset progress</button></div>
      </div>
      <div class="prog"><i id="pbar"></i></div>
      <div class="prog-l"><span id="ppos"></span><span id="pknown"></span></div>
      <div id="stage"></div>
      <p class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> still learning · <kbd>2</kbd> got it</p>
    </div>`;
  document.querySelectorAll('.seg button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.f === filter);
    b.onclick = () => { filter = b.dataset.f; renderCards(); };
  });
  const fs = $('#fsec'); if (fs){ fs.value = secFilter; fs.onchange = () => { secFilter = fs.value; buildDeck(false); drawCard(); }; }
  $('#shuf').onclick = () => { buildDeck(true); drawCard(); };
  let armed = false;
  $('#reset').onclick = e => {
    if (!armed){ armed = true; e.target.textContent = 'Tap again to reset'; setTimeout(()=>{ armed=false; if(e.target.isConnected) e.target.textContent='Reset progress'; }, 2500); return; }
    store.set('known-'+course.id, []); renderMast(); buildDeck(false); renderCards();
  };
  if (!secs.includes(secFilter)) secFilter = '';
  buildDeck(false); drawCard();
}
function drawCard(){
  const known = new Set(store.get('known-'+course.id, []));
  $('#pbar').style.width = (course.cards.length ? known.size / course.cards.length * 100 : 0) + '%';
  $('#pknown').textContent = `${known.size} of ${course.cards.length} known`;
  const stage = $('#stage');
  if (!deck.length){
    $('#ppos').textContent = '0 cards';
    stage.innerHTML = `<div class="done"><h3>${filter==='left' ? 'Nothing left to learn here' : 'No cards in this view'}</h3><p>${filter==='left' ? 'You marked every card in this set as known.' : 'Pick another filter or topic.'}</p><button class="btn primary" id="again">Show all cards</button></div>`;
    $('#again').onclick = () => { filter='all'; secFilter=''; renderCards(); };
    return;
  }
  if (pos >= deck.length){
    $('#ppos').textContent = `${deck.length} / ${deck.length}`;
    stage.innerHTML = `<div class="done"><h3>Round done</h3><p>${known.size} of ${course.cards.length} cards marked known in ${course.name}.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="left">Review the ones still learning</button><button class="btn" id="restart">Start over</button></div></div>`;
    $('#left').onclick = () => { filter='left'; renderCards(); };
    $('#restart').onclick = () => { buildDeck(true); drawCard(); };
    return;
  }
  const c = deck[pos];
  $('#ppos').textContent = `Card ${pos+1} / ${deck.length}`;
  stage.innerHTML = `
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard. Press to flip.">
      <div class="card-in">
        <div class="face front"><div class="lbl"><span>Question</span><b>${c.sec}</b></div><div class="txt">${c.q}</div><div class="hint">Tap to see the answer${known.has(c.i)?' · marked known':''}</div></div>
        <div class="face back"><div class="lbl"><span>Answer</span><b>${c.sec}</b></div><div class="txt">${c.a}</div><div class="hint">${c.q.replace(/<[^>]+>/g,'')}</div></div>
      </div>
    </div>
    <div class="fc-actions">
      <button class="btn side" id="prev" aria-label="Previous card">←</button>
      <button class="btn again" id="no">Still learning</button>
      <button class="btn got" id="yes">Got it</button>
      <button class="btn side" id="next" aria-label="Next card">→</button>
    </div>`;
  const card = $('#card');
  card.onclick = () => card.classList.toggle('flip');
  $('#prev').onclick = () => { pos = Math.max(0, pos-1); drawCard(); };
  $('#next').onclick = () => { pos++; drawCard(); };
  $('#yes').onclick = () => mark(c.i, true);
  $('#no').onclick = () => mark(c.i, false);
}
function mark(i, ok){
  const known = new Set(store.get('known-'+course.id, []));
  ok ? known.add(i) : known.delete(i);
  store.set('known-'+course.id, [...known]);
  renderMast(); pos++; drawCard();
}
document.addEventListener('keydown', e => {
  if (mode !== 'cards' || e.target.matches('input,select,textarea')) return;
  const card = $('#card'); if (!card) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); card.classList.toggle('flip'); }
  else if (e.key === 'ArrowRight') $('#next').click();
  else if (e.key === 'ArrowLeft') $('#prev').click();
  else if (e.key === '1') $('#no').click();
  else if (e.key === '2') $('#yes').click();
});
window.addEventListener('hashchange', () => { const c = DATA.find(x => x.id === location.hash.slice(1)); if (c && c !== course){ course = c; render(); } });

render();
</script>
