<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CISA Midterm Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky control bar, course masthead, then a two-column study sheet (section index left, collapsible sections right); one column on phones. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e9ee; --ink:#16212c; --muted:#596776; --line:#d3dae2;
  --sec:#0b7a72; --win:#2a54c6; --msg:#b0531a;
  --accent:var(--sec); --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --good:#1d7a3e; --bad:#b3261e; --mark:#ffe58a; --mark-ink:#16212c;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --ink:#e2e8ee; --muted:#93a1ae; --line:#2a3743;
  --sec:#3fc2b6; --win:#82a0f4; --msg:#f0935c; --good:#5fd08a; --bad:#ff8a80; --mark:#7a6312; --mark-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --ink:#e2e8ee; --muted:#93a1ae; --line:#2a3743;
  --sec:#3fc2b6; --win:#82a0f4; --msg:#f0935c; --good:#5fd08a; --bad:#ff8a80; --mark:#7a6312; --mark-ink:#fff6d6; color-scheme:dark}
body[data-course="windows"]{--accent:var(--win)}
body[data-course="messaging"]{--accent:var(--msg)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:500 .86em/1.4 var(--f-mono);background:var(--sunk);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font:400 13px/1.55 var(--f-mono)}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}

/* Control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{font:800 17px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transition:background .2s}
.courses{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.courses button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:500;font-size:14px;color:var(--muted)}
.courses button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.courses .short{display:none}
.courses button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 360px;justify-content:flex-end;min-width:0}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.mode button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.search{position:relative;flex:1 1 180px;min-width:0;max-width:340px}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 30px 7px 32px;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;translate:0 -50%;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search .clear{position:absolute;right:4px;top:50%;translate:0 -50%;border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 7px}

/* Masthead */
.mast{padding-block:34px 18px}
.eyebrow{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.mast h1{font:800 clamp(32px,6vw,56px)/1.02 var(--f-display);letter-spacing:-.025em;margin:10px 0 8px;text-wrap:balance}
.mast .sub{font:500 15px/1.4 var(--f-mono);color:var(--muted);margin:0}
.mast .intro{max-width:68ch;color:var(--muted);margin-top:14px}
.mast .intro p{margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{font:500 13px/1 var(--f-mono);padding:7px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.stat b{color:var(--accent);font-weight:500}

/* Study layout */
.study{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:64px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.toc h2{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 10px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.toc a{display:grid;grid-template-columns:2.1em 1fr;gap:4px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
.toc a span{font:500 12px/1.6 var(--f-mono);color:var(--muted)}
.toc a:hover{background:var(--surface)}
.toc a.hit{background:var(--accent-soft)}
.toc a.dim{opacity:.4}
.toc .all{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.status{font:500 13px/1.4 var(--f-mono);color:var(--muted);margin:0 0 12px;min-height:1.4em}

.sections{display:grid;gap:12px;min-width:0}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;scroll-margin-top:90px}
details.sec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px 18px}
details.sec>summary::-webkit-details-marker{display:none}
.num{font:500 13px/1 var(--f-mono);color:var(--accent);border:1px solid currentColor;border-radius:5px;padding:5px 6px;min-width:2.4em;text-align:center}
.sec h2{font:600 clamp(18px,2.4vw,22px)/1.2 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:rotate .2s}
details[open] .chev{rotate:180deg}
.tag{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:4px 6px;border-radius:4px;margin-left:8px;vertical-align:3px;white-space:nowrap}
.body{padding:0 18px 20px;border-top:1px solid var(--line);min-width:0}
.body>:first-child{margin-top:16px}
.body h3{font:600 17px/1.3 var(--f-display);margin:26px 0 8px;padding-top:4px}
.body p,.body li{max-width:75ch}
.body ul,.body ol{padding-left:1.3em}
.body li{margin:3px 0}
.body li>p{margin:0}
.body strong{font-weight:600}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:8px 11px;border-bottom:1px solid var(--line)}
th{background:var(--sunk);font:600 12px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td{min-width:9ch}
td:first-child{font-variant-numeric:tabular-nums}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

/* Practice tables: answers hidden until tapped */
.qa-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.qa-tools span{font-size:13px;color:var(--muted)}
.hide-ans td.ans{cursor:pointer;position:relative}
.hide-ans td.ans:not(.shown) > *,.hide-ans td.ans:not(.shown){color:transparent}
.hide-ans td.ans:not(.shown) code{background:transparent}
.hide-ans td.ans:not(.shown)::after{content:"Tap to reveal";position:absolute;inset:6px 8px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;color:var(--muted);font:500 12px/1 var(--f-mono)}

/* Flashcards */
.fc{max-width:760px;margin:0 auto;padding-bottom:64px}
.fc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.fc-top select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:14px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sunk);font-weight:600}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.prog-l{display:flex;justify-content:space-between;font:500 13px/1.3 var(--f-mono);color:var(--muted);margin-bottom:16px;gap:12px}
.card{perspective:1400px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.card-in{position:relative;display:grid;min-height:300px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.face.back{transform:rotateY(180deg);border-color:var(--accent)}
.face .lbl{font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.face .lbl b{color:var(--accent);font-weight:500}
.face .txt{font:600 clamp(20px,3.4vw,27px)/1.3 var(--f-display);letter-spacing:-.01em;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere}
.face.back .txt{font:500 clamp(18px,3vw,23px)/1.45 var(--f-body)}
.face .hint{font-size:13px;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;margin-top:14px}
.fc-actions .btn{padding:11px 12px;font-size:15px}
.btn.again{border-color:var(--bad);color:var(--bad);font-weight:600}
.btn.got{border-color:var(--good);background:var(--good);color:var(--surface);font-weight:600}
.done{text-align:center;padding:48px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.done h3{font:800 28px/1.1 var(--f-display);margin:0 0 8px}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.keys kbd{font:500 11px/1 var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface)}

@media (max-width:900px){
  .study{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;max-height:none;padding:0}
  .toc h2{display:none}
  .toc ol{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .toc a{display:flex;white-space:nowrap;background:var(--surface);border:1px solid var(--line);padding:6px 10px}
  .toc .all{margin-top:6px}
  .tools{flex-basis:100%}
  .search{max-width:none}
}
@media (max-width:520px){
  .brand{font-size:15px}
  .courses{order:3;width:100%}
  .courses button{flex:1;padding:7px 8px;font-size:13px}
  .courses button .dot{display:none}
  .courses .long{display:none}
  .courses .short{display:inline}
  .mast{padding-block:24px 12px}
  details.sec>summary{padding:14px;gap:10px}
  .body{padding:0 14px 16px}
  .fc-actions{grid-template-columns:1fr 1fr}
  .fc-actions .side{order:3}
  .face{padding:20px 18px}
  .card-in{min-height:260px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand"><i></i>CISA Midterm Prep</div>
    <nav class="courses" id="courses" aria-label="Course"></nav>
    <div class="tools">
      <div class="mode" role="group" aria-label="Mode">
        <button id="m-study" aria-pressed="true">Study</button>
        <button id="m-cards" aria-pressed="false">Flashcards</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search this course" autocomplete="off" aria-label="Search this course">
        <button class="clear" id="qclear" aria-label="Clear search" hidden>×</button>
      </label>
    </div>
  </div>
</header>

<main>
  <section class="mast wrap" id="mast"></section>
  <div class="wrap" id="view"></div>
</main>

<script>
const DATA = [{"id": "security", "name": "Network Security", "sub": "FortiGate · Firewalls · L2 · VPN · ZPF", "intro": "<p>Everything here comes only from your 8 course files: the 4 FortiGate Security decks (Intro, Firewall Policies, Application Control, NAT) and the 4 handouts (Firewall Technologies, Ch 4 Layer 2, Ch 5 VPN, Ch 6 Zone-Based Firewall). Bold = likely exam answer.<\/p>", "sections": [{"id": "security-1", "n": 1, "title": "FortiGate — Introduction & Initial Configuration", "html": "<p>Modern firewalls are <strong>multifunctional devices that inspect traffic at the perimeter AND internally<\/strong>, because there is no single clear perimeter anymore (mobile workforce, partners, cloud, IoT, BYOD). FortiGate can act as a distributed enterprise firewall, NGFW, internal segmentation firewall (contains a breach) or data center firewall, and can also run DNS, DHCP, web filter, AV and IPS.<\/p>\n<h3>Platform design<\/h3>\n<ul>\n<li><strong>UTM<\/strong> (one box doing many security jobs) is usually better than separate appliances for small/mid businesses and branches — less duplication of policies, logging and routing.<\/li>\n<li>FortiGate hardware uses Fortinet-made <strong>ASICs<\/strong> for better performance than CPU-only devices.<\/li>\n<li>You enable/disable UTM and NGFW modules <strong>per firewall policy<\/strong> — no wasted CPU on features you don't use.<\/li>\n<li>Prefers open standards, and integrates with FortiSandbox, FortiWeb, FortiMail, FortiClient = the <strong>Security Fabric<\/strong>.<\/li>\n<\/ul>\n<h3>Virtual / cloud versions<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Product<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FortiGate VM<\/td>\n<td>Same features as a physical box <strong>except SPUs (no hardware acceleration)<\/strong>. Guest VM on the hypervisor.<\/td>\n<\/tr>\n<tr>\n<td>FortiGate VMX<\/td>\n<td>Subset of features for VMware NSX-V <strong>east-west<\/strong> traffic, sits between guest VMs<\/td>\n<\/tr>\n<tr>\n<td>FortiGate Connector for Cisco ACI<\/td>\n<td>Subset for Cisco ACI <strong>north-south<\/strong> traffic<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Why no SPUs on a VM? Hypervisors use generic vCPUs to abstract hardware, and a virtualized ASIC wouldn't give the same speed. You'd still pick a VM for fast deploy/teardown and scale on cheap hardware. VM specs: 1/2/4/8 vCPU, 1/4/8/12 GB RAM, 2–4 vNICs, 40+ GB storage; runs on VMware, Hyper-V, KVM, Xen, Azure, AWS.<\/p>\n<h3>SPUs (Security Processing Units)<\/h3>\n<p>SPUs offload resource-heavy work from the CPU.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Processor<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CP<\/strong> (content processor, e.g. CP9)<\/td>\n<td>Not tied to an interface, outside the traffic flow. <strong>SSL encryption/decryption, antivirus<\/strong>, content inspection; fast path for IPS<\/td>\n<\/tr>\n<tr>\n<td><strong>SP<\/strong> (security processor)<\/td>\n<td>Attached to interfaces, <strong>accelerates IPS<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>NP<\/strong> (network processor, NP6/NP7)<\/td>\n<td>Attached to interfaces, <strong>packet forwarding<\/strong>; NP7 provides <strong>NTurbo<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>SoC<\/strong> (system-on-a-chip, SoC4)<\/td>\n<td>CP + NP + RISC CPU in one chip for <strong>entry-level<\/strong> models; includes NTurbo<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>NTurbo<\/strong> offloads firewall sessions with flow-based security profiles to NP6/NP7. Without it, those go to the CPU.<\/li>\n<li>Enable <strong>per-session accounting<\/strong> to see offloaded NP sessions (total sessions, % SPU, % NTurbo).<\/li>\n<\/ul>\n<h3>Operation modes (set per VDOM)<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>NAT mode (default)<\/th>\n<th>Transparent mode<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Acts like<\/td>\n<td><strong>Layer 3 router<\/strong><\/td>\n<td><strong>Layer 2 switch/bridge<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Interface IPs<\/td>\n<td>Yes<\/td>\n<td>No (only a management IP)<\/td>\n<\/tr>\n<tr>\n<td>Forwards by<\/td>\n<td>Destination IP + routing table<\/td>\n<td>Destination MAC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>VDOMs<\/strong> split one FortiGate into multiple independent virtual firewalls. Disabled by default, but the <strong>root VDOM<\/strong> always exists. A new VDOM starts in NAT mode.<\/li>\n<\/ul>\n<h3>Factory defaults<\/h3>\n<ul>\n<li>IP <strong>192.168.1.99/24<\/strong> on MGMT (high/mid-range) or port1/internal (entry-level).<\/li>\n<li><strong>PING, HTTPS, SSH<\/strong> management allowed. DHCP server on port1/internal (entry-level models only).<\/li>\n<li>Login <strong>admin<\/strong> / <strong>blank password<\/strong> (both case-sensitive) — change it right away.<\/li>\n<li>GUI: https://192.168.1.99. CLI without network: <strong>console port<\/strong> (PuTTY / Tera Term) or the GUI CLI console widget.<\/li>\n<\/ul>\n<h3>FortiGuard subscription services<\/h3>\n<p>Needs internet + a contract. Delivered by the <strong>FortiGuard Distribution Network (FDN)<\/strong> (data centers in N. America, Asia, Europe) or through FortiManager.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Package updates<\/th>\n<th>Live queries<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Services<\/td>\n<td><strong>Antivirus, IPS<\/strong><\/td>\n<td><strong>Web filtering, DNS filtering, antispam<\/strong><\/td>\n<\/tr>\n<tr>\n<td>How<\/td>\n<td>Downloaded (often once a day)<\/td>\n<td>Asked in real time, every scan<\/td>\n<\/tr>\n<tr>\n<td>Transport<\/td>\n<td><strong>TCP 443<\/strong> (update.fortiguard.net)<\/td>\n<td><strong>UDP 53 or 8888<\/strong> (service.fortiguard.net) or HTTPS 443/53/8888 (securewf.fortiguard.net)<\/td>\n<\/tr>\n<tr>\n<td>Needs reliable internet?<\/td>\n<td>No — keeps working after download<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Queries are used because the web filter DB is too big and changes too often to download.<\/li>\n<li>Default FortiGuard access mode = <strong>anycast<\/strong> (one IP per service, forces <strong>HTTPS port 443<\/strong>).<\/li>\n<li><strong>OCSP stapling<\/strong> validates FortiGuard certs. FortiGuard servers check the CA's OCSP responder <strong>every 4 hours<\/strong>; keep last status <strong>7 days<\/strong> if unreachable.<\/li>\n<li>FortiGate aborts the connection if: cert CN ≠ DNS name, OCSP status not good, or issuer CA revoked.<\/li>\n<\/ul>\n<h3>Administration<\/h3>\n<ul>\n<li><strong>CLI<\/strong>: console, SSH, Telnet, GUI widget. <strong>GUI<\/strong>: browser (HTTP/HTTPS), FortiExplorer. SNMP = <strong>read-only<\/strong>.<\/li>\n<li>Can't view reports on the CLI; some advanced/diagnostic commands aren't in the GUI.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>CLI command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>System status (firmware, serial, etc.)<\/td>\n<td><code>get system status<\/code><\/td>\n<\/tr>\n<tr>\n<td>All interface settings<\/td>\n<td><code>show full-configuration system interface &lt;port&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>Only non-default interface settings<\/td>\n<td><code>show system interface &lt;port&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>List sub-commands<\/td>\n<td><code>&lt;command&gt; ?<\/code> (e.g. <code>execute backup ?<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Admin profiles<\/strong> (System &gt; Admin Profiles) give read-write / read-only / none per area.<\/p>\n<ul>\n<li><strong>super_admin<\/strong> — full global access, used by <code>admin<\/code>, <strong>can't be changed<\/strong>.<\/li>\n<li><strong>prof_admin<\/strong> — full access but <strong>only within its VDOM<\/strong>, can be edited.<\/li>\n<li>Lower-permission admins <strong>can't see or reset<\/strong> accounts with higher permissions.<\/li>\n<li>Best practice: each admin has their own account, least privilege. Can also use REST API admin, remote auth server, or certificates.<\/li>\n<li><strong>Override Idle Timeout<\/strong> lets you change the timeout per profile.<\/li>\n<\/ul>\n<p><strong>Lost admin password → <code>maintainer<\/code> account<\/strong><\/p>\n<ul>\n<li>User <code>maintainer<\/code>, password <code>bcpb<\/code> + serial number in <strong>UPPERCASE<\/strong> (e.g. bcpbFGT60…).<\/li>\n<li>Only via <strong>physical console port<\/strong>, only after a <strong>hard power cycle<\/strong> (not a reboot), only in the <strong>first \\~60 seconds<\/strong>.<\/li>\n<li><strong>Not on VMs<\/strong> — revert a snapshot or reprovision instead.<\/li>\n<li>Can disable it: <code>config sys global<\/code> → <code>set admin-maintainer disable<\/code>. If you then lose the password, you must factory reset.<\/li>\n<\/ul>\n<p><strong>Securing admin access<\/strong><\/p>\n<ul>\n<li><strong>Trusted hosts<\/strong> restrict which IPs an admin can log in from. Default 0.0.0.0/0 = anywhere. If all admins have trusted hosts and you're not in any, you get \"Unable to contact server\". Watch out for NAT changing the source IP.<\/li>\n<li>Default <strong>idle timeout = 5 minutes<\/strong>. Port numbers are customizable.<\/li>\n<li>Enable management protocols <strong>per interface<\/strong>; IPv4 and IPv6 separate. Disable <strong>HTTP and Telnet<\/strong> (unencrypted). PING on an external interface risks DoS.<\/li>\n<li>Other FortiGate-destined protocols: <strong>CAPWAP<\/strong> (FortiAP/FortiSwitch/FortiExtender), <strong>FortiTelemetry<\/strong> (FortiClient &amp; Security Fabric), <strong>FMG-Access<\/strong> (FortiManager), <strong>RADIUS accounting<\/strong> (SSO), <strong>FTM<\/strong> (FortiToken Mobile push 2FA), <strong>LLDP<\/strong> (detect upstream Security Fabric FortiGate).<\/li>\n<li><strong>Feature Visibility<\/strong> hides features in the GUI — <strong>hidden ≠ disabled<\/strong> (still on in CLI). IPv6 is hidden by default.<\/li>\n<\/ul>\n<h3>Interfaces &amp; routing<\/h3>\n<ul>\n<li>In NAT mode every interface needs an IP: <strong>manual, DHCP, or PPPoE<\/strong>. <strong>FortiIPAM<\/strong> (paid) auto-assigns non-overlapping subnets.<\/li>\n<li>Exception: <strong>One-Arm Sniffer<\/strong> — no IP, gets a mirrored copy, promiscuous, <strong>can only log, not change traffic<\/strong>. CLI only: <code>set ips-sniffer-mode enable<\/code> (unreferenced interface only).<\/li>\n<li><strong>Interface role<\/strong> (WAN / LAN / DMZ / Undefined) hides settings that don't fit — e.g. no DHCP server on WAN. Undefined shows all.<\/li>\n<li><strong>Alias<\/strong> = friendly name shown in the policy list (e.g. port3 = internal_network).<\/li>\n<li>Need at least one <strong>default route 0.0.0.0/0<\/strong> (static, or learned via DHCP/PPPoE) or FortiGate can't reach FortiGuard.<\/li>\n<li><strong>Link aggregation<\/strong> bundles ports for more bandwidth + redundancy.<\/li>\n<\/ul>\n<h3>Built-in DHCP server<\/h3>\n<ul>\n<li>Enable on an interface with a static IP. <strong>IP Address Assignment Rules<\/strong> by MAC:<\/li>\n<li><strong>Assign IP<\/strong> (default for unknown MACs) — dynamically gives an IP from the pool<\/li>\n<li><strong>Block<\/strong> — no IP for that MAC<\/li>\n<li><strong>Reserve IP<\/strong> — binds a specific IP to a MAC<\/li>\n<\/ul>\n<h3>Built-in DNS server<\/h3>\n<p>Enabled per interface, internal use only (not public-facing). One DNS database shared by interfaces (or per VDOM).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Behaviour<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Forward<\/strong><\/td>\n<td>Relays all queries to the system DNS server (DNS relay, no local DB needed)<\/td>\n<\/tr>\n<tr>\n<td><strong>Non-recursive<\/strong><\/td>\n<td>Answers <strong>only from the FortiGate DNS database<\/strong>, doesn't forward<\/td>\n<\/tr>\n<tr>\n<td><strong>Recursive<\/strong><\/td>\n<td>Checks FortiGate DB first, forwards anything it can't resolve<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Supported records: A, AAAA, NS, CNAME, MX, PTR (IPv4/IPv6). DNS database must be made visible in Feature Visibility.<\/p>\n<h3>Backup, restore &amp; firmware<\/h3>\n<ul>\n<li>Config backups can go to an external device, optionally <strong>encrypted<\/strong>; can auto-backup on logout (some models). Restore <strong>reboots<\/strong> FortiGate.<\/li>\n<li>Even unencrypted, passwords inside are <strong>hashed<\/strong>.<\/li>\n<li>File holds only non-default + key settings. Header (always cleartext) shows <strong>model, firmware version, build<\/strong>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Restoring…<\/th>\n<th>Needs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unencrypted file<\/td>\n<td><strong>Same model<\/strong> (firmware mismatch → it tries to upgrade the config)<\/td>\n<\/tr>\n<tr>\n<td>Encrypted file<\/td>\n<td><strong>Same model + same firmware/build + the password<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Check firmware: dashboard System widget, System &gt; Firmware, or <code>get system status<\/code>.<\/li>\n<li><strong>Upgrade steps<\/strong>: back up config → download current firmware → have physical/console access → <strong>read the Release Notes<\/strong> (upgrade path) → upgrade.<\/li>\n<li><strong>Downgrade<\/strong>: get the pre-upgrade config, read Release Notes (may not keep config — sometimes must format &amp; reinstall), downgrade, restore matching config.<\/li>\n<li>Clean install (wipe firmware + config) = boot loader menu via console during reboot.<\/li>\n<\/ul>", "practice": false}, {"id": "security-2", "n": 2, "title": "FortiGate — Firewall Policies", "html": "<p>A firewall policy defines <strong>which traffic matches<\/strong> and <strong>what to do with it<\/strong> (allow/deny, NAT, authentication, security profiles). FortiGate checks policies <strong>top to bottom and applies the first match<\/strong>. No match → dropped by the <strong>Implicit Deny<\/strong> policy (policy ID 0).<\/p>\n<h3>Policy types<\/h3>\n<p>Firewall policy (IPv4/IPv6), virtual wire pair, proxy, multicast, <strong>local-in<\/strong> (traffic to/from FortiGate itself), DoS, traffic shaping. Objects used: interfaces/zones, addresses, users, internet services, services, schedules, NAT, security profiles.<\/p>\n<h3>Matching criteria<\/h3>\n<p>Incoming interface → outgoing interface → <strong>source<\/strong> (address, user, internet service) → <strong>destination<\/strong> (address or internet service) → <strong>service<\/strong> → <strong>schedule<\/strong> → then <strong>Action = ACCEPT or DENY<\/strong>. Security profiles are NOT match criteria; they're applied after ACCEPT.<\/p>\n<ul>\n<li><strong>Interfaces<\/strong>: by default only ONE in/out interface on the GUI. Enable <strong>Multiple Interface Policies<\/strong> in Feature Visibility (CLI always allows it). If you pick <strong>any<\/strong>, you can't add more.<\/li>\n<li><strong>Source<\/strong>: must have <strong>at least one address object or ISDB object<\/strong>. Users/groups are <strong>optional<\/strong> (local, remote LDAP/RADIUS/AD, FSSO, PKI cert). Address types: IP/range, subnet, FQDN (must resolve via DNS or you get a warning), geography, dynamic, Fabric connector, MAC range.<\/li>\n<li><strong>Destination<\/strong>: address objects or ISDB. <strong>No user option<\/strong> — users are identified at the ingress interface.<\/li>\n<li><strong>Service<\/strong>: protocol + <strong>destination port<\/strong> (source ports are random). e.g. HTTP = TCP 80, HTTPS = TCP 443. <strong>ALL<\/strong> = every port/protocol.<\/li>\n<\/ul>\n<h3>Internet Service Database (ISDB)<\/h3>\n<ul>\n<li>Database of IPs, protocols and ports for common internet services (Dropbox, Facebook…), updated by FortiGuard.<\/li>\n<li>Can be <strong>source or destination<\/strong>. It's <strong>either ISDB or address, not both<\/strong>, in that field.<\/li>\n<li>ISDB as destination → <strong>can't select a Service<\/strong> (ports are built into the ISDB entry).<\/li>\n<li><strong>Geographic ISDB<\/strong> = filter by country/region/city. ISDB objects are referenced <strong>by name<\/strong>, not ID.<\/li>\n<li>Updates on by default; disable for change windows: <code>config system fortiguard<\/code> → <code>set update-uwdb disable<\/code>.<\/li>\n<\/ul>\n<h3>Schedules (24-hour clock)<\/h3>\n<ul>\n<li><strong>Recurring<\/strong> — same time on chosen days. Stop time earlier than start → ends next day (Sun 10:00–09:00 ends Mon 09:00). Same start/stop = 24 h.<\/li>\n<li><strong>One-time<\/strong> — happens once; optional <strong>pre-expiration event log<\/strong> 1–100 days before it ends.<\/li>\n<li>Default schedule = always.<\/li>\n<\/ul>\n<h3>Configuring policies<\/h3>\n<ul>\n<li><strong>Name is mandatory on the GUI<\/strong> (optional on CLI). Turn on <strong>Allow Unnamed Policies<\/strong> in Feature Visibility to relax it.<\/li>\n<li>Each policy/object gets a <strong>UUID<\/strong> for logs (FortiManager/FortiAnalyzer).<\/li>\n<li>FortiGate is <strong>stateful<\/strong> — one policy in the direction that starts the session; replies are allowed automatically.<\/li>\n<li><strong>Security profiles<\/strong> (AV, IPS, web filter, app control…) block threats, control apps/URLs, stop data leaving. Inspection is <strong>flow-based or proxy-based<\/strong>. No default profile is pre-applied. Video Filter, VoIP and WAF are hidden by default.<\/li>\n<\/ul>\n<h3>Logging<\/h3>\n<ul>\n<li>Default <strong>Log Allowed Traffic = Security Events<\/strong> (logs only for applied security profiles). Can change to <strong>All Sessions<\/strong>.<\/li>\n<li><strong>Generate Logs when Session Starts<\/strong> = extra log at session start (CLI <code>set logtraffic-start enable<\/code>). More logging = lower performance.<\/li>\n<li>Traffic logs are written when the session <strong>closes<\/strong>; attack logs are immediate.<\/li>\n<li><code>ses-denied-traffic enable<\/code> keeps denied sessions in the session table to cut CPU/log load; <code>block-session-timer<\/code> (1–300 s, <strong>default 30 s<\/strong>).<\/li>\n<\/ul>\n<h3>Traffic shaping<\/h3>\n<ul>\n<li><strong>Shared shaper<\/strong> — total bandwidth for all traffic using it (per policy or across all policies).<\/li>\n<li><strong>Per-IP shaper<\/strong> — bandwidth per user IP.<\/li>\n<li>Three shaping policy types: shared policy, per-IP, <strong>application control<\/strong> shaping.<\/li>\n<li>Sets <strong>guaranteed<\/strong> and <strong>maximum<\/strong> bandwidth. Shaping policy match criteria must line up with the firewall policy. UDP recovers poorly from drops.<\/li>\n<\/ul>\n<h3>Consolidated IPv4 + IPv6 policy<\/h3>\n<p>One policy table for both. In/out interface, schedule and service are shared, but source/destination/IP pool need addresses per version. <strong>IP versions of source and destination must match<\/strong> (no IPv4 source with IPv6-only destination).<\/p>\n<h3>Managing policies<\/h3>\n<ul>\n<li><strong>Interface Pair View<\/strong> groups by in/out pair. <strong>By Sequence<\/strong> = one flat list. Using <strong>multiple interfaces or any → By Sequence only<\/strong>.<\/li>\n<li><strong>Policy ID<\/strong>: assigned by the system, <strong>never changes when you move the policy<\/strong>. Hidden by default (add the column). Next highest number is used for new policies. Manual IDs need Policy Advanced Options.<\/li>\n<li><strong>Policy order<\/strong> is what matters: put <strong>specific policies above general ones<\/strong> (e.g. Block_FTP above Full_Access). Drag-and-drop on GUI.<\/li>\n<li>Real-time status: last used, first used, hit count, active sessions, bytes, bandwidth.<\/li>\n<li><strong>Groups<\/strong> of addresses/services simplify policies (e.g. Web-FTP = HTTP, HTTPS, FTP, DNS).<\/li>\n<li><strong>Ref column<\/strong> = how many places an object is used. <strong>You can't delete an object that's in use.<\/strong><\/li>\n<li>Right-click: enable/disable, insert above/below, copy/paste, <strong>clone reverse (only if NAT is off)<\/strong>, Edit in CLI.<\/li>\n<\/ul>\n<h3>Best practices &amp; troubleshooting<\/h3>\n<ul>\n<li>Object names: <strong>max 35 characters<\/strong>; allowed = letters, numbers, <strong>hyphen and underscore<\/strong>, spaces (avoid spaces). <code>Good_Training<\/code> ✓, <code>Good(Training)<\/code> ✗.<\/li>\n<li>Changes take effect <strong>immediately<\/strong> and can reset sessions — test in a maintenance window.<\/li>\n<li>Make policies as specific as possible; use correct subnets.<\/li>\n<li>When combining policies, check interfaces, addresses, services, schedules, profiles, logging, NAT. Note: ALL_ICMP isn't scanned by web filter/AV, and Security Events logging won't log it.<\/li>\n<li><strong>Policy Lookup<\/strong> (GUI) finds the matching policy <strong>without sending real traffic<\/strong>. Input: source interface, protocol, source IP, destination IP/FQDN (+ ports for TCP, type/code for ICMP). It checks RPF, DNAT/VIP and route lookup, <strong>skips disabled policies<\/strong>, then highlights the match.<\/li>\n<\/ul>", "practice": false}, {"id": "security-3", "n": 3, "title": "FortiGate — Application Control", "html": "<p>Application control detects apps (Facebook, Skype, Gmail, LogMeIn, P2P, proxies…) and lets you <strong>monitor, block or shape<\/strong> them — beyond just blocking ports/IPs. It <strong>uses the IPS engine<\/strong>, so it's <strong>always flow-based<\/strong> (even in a proxy-based policy). It matches known patterns in the byte stream and works even on non-standard ports or through an external proxy. Scanning encrypted apps needs an <strong>SSL/SSH inspection profile<\/strong> (deep inspection).<\/p>\n<h3>Why P2P is hard to catch<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Client-server (HTTP, FTP)<\/th>\n<th>Peer-to-peer (BitTorrent, Skype)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One client, one server<\/td>\n<td>One client, <strong>many peers<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Known port, easy to block with one policy<\/td>\n<td><strong>Dynamic ports<\/strong>, optional dynamic encryption<\/td>\n<\/tr>\n<tr>\n<td>Popularity can DoS the server<\/td>\n<td>More peers = faster download, eats bandwidth<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>P2P uses evasive tricks (port randomization, pinholes, changing encryption) — needs IPS-engine pattern matching, not firewall policies or proxy inspection.<\/p>\n<h3>Signatures &amp; database<\/h3>\n<ul>\n<li>Requires a <strong>FortiGuard application control subscription<\/strong>.<\/li>\n<li>App control DB is <strong>separate from the IPS DB<\/strong>; can auto-update (System &gt; FortiGuard).<\/li>\n<li>Browse/request signatures at fortiguard.com. <strong>Risk rating is Fortinet-specific<\/strong> (not CVSS).<\/li>\n<li>Signatures are <strong>hierarchical<\/strong> (e.g. Facebook → Facebook_Chat, Facebook_Apps). <strong>Parent takes precedence over child<\/strong>. Lets you block Facebook apps but allow chat.<\/li>\n<\/ul>\n<h3>Two configuration modes<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Profile-based mode<\/th>\n<th>NGFW policy-based mode<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>How<\/td>\n<td>Create an <strong>App Control profile<\/strong>, apply it to a firewall policy<\/td>\n<td>Pick apps/categories/groups <strong>directly in the security policy<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Inspection<\/td>\n<td>Flow-based scanning (in flow or proxy policies)<\/td>\n<td><strong>Flow-based only<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Action<\/td>\n<td>Per-filter actions<\/td>\n<td>Policy <strong>ACCEPT or DENY<\/strong> (+ AV/IPS on ACCEPT)<\/td>\n<\/tr>\n<tr>\n<td>Extra requirements<\/td>\n<td>SSL/SSH inspection profile on the policy<\/td>\n<td>SSL inspection on an <strong>SSL Inspection &amp; Authentication<\/strong> policy + <strong>Central SNAT required<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Log shows profile name?<\/td>\n<td>Yes<\/td>\n<td><strong>No<\/strong> (no sensor name)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>In NGFW mode, adding a <strong>URL Category<\/strong> limits app matching to the <strong>browser-based technology<\/strong> category.<\/li>\n<li>NGFW policies match top-down — e.g. block Facebook <strong>above<\/strong> allow Social.Media.<\/li>\n<\/ul>\n<h3>The profile (Security Profiles &gt; Application Control)<\/h3>\n<ul>\n<li><strong>Categories<\/strong> — groups of similar apps; set an action per category.<\/li>\n<li><strong>Application overrides<\/strong> — action for specific apps/signatures.<\/li>\n<li><strong>Filter overrides<\/strong> — group apps by behaviour, popularity, protocol, risk, vendor, technology.<\/li>\n<li><strong>Unknown Applications<\/strong> — traffic with no signature match; logs a lot (hurts performance).<\/li>\n<li>Cloud icon number = cloud apps in that category; SSL cloud apps need deep inspection.<\/li>\n<li><strong>Allow and Log DNS Traffic<\/strong> — only short-term (heavy).<\/li>\n<li><strong>QUIC<\/strong> (Google, runs over UDP, skips web filter) — <strong>default Block<\/strong>, which forces Chrome to HTTP2/TLS1.2.<\/li>\n<li><strong>Replacement messages<\/strong> only for HTTP-based apps; others just drop/reset.<\/li>\n<li><strong>Protocol enforcement<\/strong> — allow services (FTP 21, HTTP 80, HTTPS 443) only on their known ports, block them elsewhere.<\/li>\n<\/ul>\n<h3>Scan order<\/h3>\n<ol>\n<li>IPS engine identifies the app.<\/li>\n<li><strong>Application &amp; filter overrides first<\/strong> (top to bottom — the order between them matters).<\/li>\n<li><strong>Categories<\/strong> last.<\/li>\n<\/ol>\n<p>Example: Game category = Block but Battle.Net override = Monitor → Battle.Net allowed + logged. If a filter override (Excessive bandwidth = Block) sits <strong>above<\/strong> the Dailymotion Monitor override, Dailymotion gets <strong>blocked<\/strong>.<\/p>\n<p>App control runs <strong>before web filtering<\/strong>. Web filter can still block an app that app control allowed, and a web filter <strong>exempt can't bypass<\/strong> app control.<\/p>\n<h3>Actions<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Action<\/th>\n<th>Traffic<\/th>\n<th>Log<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Allow<\/strong><\/td>\n<td>Passes<\/td>\n<td><strong>No<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Monitor<\/strong><\/td>\n<td>Passes<\/td>\n<td><strong>Yes<\/strong> (good for first studying your network)<\/td>\n<\/tr>\n<tr>\n<td><strong>Block<\/strong><\/td>\n<td>Dropped<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>Quarantine<\/strong><\/td>\n<td>Blocks the attacker IP until expiry (days/hours/min)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Block page (HTTP apps)<\/h3>\n<p>Shows signature, category, URL, user + group (if auth), <strong>policy UUID<\/strong>. With deep inspection, HTTPS apps get it too. <strong>Only for web (HTTP-based) apps.<\/strong><\/p>\n<h3>App control traffic shaping<\/h3>\n<ul>\n<li>Rate-limit an app instead of blocking it (e.g. throttle <strong>only YouTube video<\/strong>, not comments — same port/protocol, so firewall policies can't tell them apart).<\/li>\n<li>Shape by <strong>application, category or group<\/strong> (also web filter categories). Firewall policy must allow the traffic; shaping policy criteria must align.<\/li>\n<li><strong>Shared shaper<\/strong> = ingress→egress (limits <strong>upload<\/strong>). <strong>Reverse shaper<\/strong> = egress→ingress (limits <strong>download/streaming<\/strong>). <strong>Per-IP shaper<\/strong> splits bandwidth equally per source IP.<\/li>\n<\/ul>\n<h3>Logging &amp; monitoring<\/h3>\n<ul>\n<li>Enable logging (Security Events / All Sessions) <strong>in the firewall/security policy<\/strong>. For DENY policies, turn on <strong>Log Violations<\/strong>.<\/li>\n<li>Logs: <strong>Log &amp; Report &gt; Application Control<\/strong> (also Forward Traffic). Find the policy by <strong>Policy ID or UUID<\/strong>.<\/li>\n<li><strong>Dashboard &gt; Top Applications<\/strong> needs <strong>disk logging<\/strong> (or FortiCloud on diskless models for FortiView).<\/li>\n<\/ul>\n<h3>Best practices<\/h3>\n<ul>\n<li>Apply only where needed; specify subnets; <strong>not on internal-to-internal<\/strong> traffic.<\/li>\n<li>Identical app control on all redundant/load-balanced policies.<\/li>\n<li>Use <strong>Deep-Inspection, not certificate inspection<\/strong>.<\/li>\n<li>Use hardware acceleration (NP/CP) for signature matching.<\/li>\n<\/ul>\n<h3>Troubleshooting FortiGuard updates<\/h3>\n<p>Check: stable internet (or FortiManager), DNS resolves <strong>update.fortiguard.net<\/strong>, <strong>TCP 443<\/strong> open. Force update: <code>execute update-now<\/code>. Updates use <strong>TCP<\/strong>.<\/p>", "practice": false}, {"id": "security-4", "n": 4, "title": "FortiGate — NAT", "html": "<p>NAT changes the IP-layer address of a packet. Why use it: <strong>security<\/strong> (hides internal addresses), <strong>saving/amplifying addresses<\/strong> (hundreds of hosts on one public IP), and <strong>address stability<\/strong> if the ISP changes.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SNAT<\/strong><\/td>\n<td>Source NAT — outgoing connections (interface IP, IP pool, central SNAT)<\/td>\n<\/tr>\n<tr>\n<td><strong>DNAT<\/strong><\/td>\n<td>Destination NAT — incoming connections (<strong>VIPs<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>PAT / NAT overload / NAPT<\/strong><\/td>\n<td>Many private IPs → one public IP using <strong>different source ports<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>NAT64 / NAT46<\/strong><\/td>\n<td>IPv6 hosts ↔ IPv4 hosts<\/td>\n<\/tr>\n<tr>\n<td><strong>NAT66<\/strong><\/td>\n<td>NAT <strong>between two IPv6 networks<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Protocols with addresses inside the application layer (like <strong>SIP<\/strong>) need <strong>session helpers or proxies<\/strong>.<\/p>\n<h3>Two configuration modes<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Firewall policy NAT (default)<\/th>\n<th>Central NAT<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where configured<\/td>\n<td><strong>On each firewall policy<\/strong><\/td>\n<td><strong>Per VDOM<\/strong>, rules apply to many policies<\/td>\n<\/tr>\n<tr>\n<td>SNAT<\/td>\n<td>Outgoing interface IP or IP pool in the policy<\/td>\n<td><strong>Central SNAT<\/strong> table<\/td>\n<\/tr>\n<tr>\n<td>DNAT<\/td>\n<td>VIP selected as policy destination<\/td>\n<td><strong>DNAT &amp; Virtual IPs<\/strong> (auto-applied)<\/td>\n<\/tr>\n<tr>\n<td>Best for<\/td>\n<td>Few NAT IPs, each with its own policies/profiles<\/td>\n<td>Complex setups, many NAT IPs with same policies, <strong>NGFW policy mode<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Both give the same results.<\/p>\n<h3>Firewall policy SNAT<\/h3>\n<ul>\n<li><strong>Use outgoing interface address<\/strong> — many-to-one with PAT (e.g. 10.10.10.10:1025 → 203.0.113.10:30912). Same as overload pool. <strong>Fixed port<\/strong> turns off port translation (only one connection per source port).<\/li>\n<li><strong>Use dynamic IP pool<\/strong> — translate to an address from a pool instead. Pool is usually in the same range as the interface IP, or routing must be set up.<\/li>\n<\/ul>\n<h3>IP pool types<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>How it works<\/th>\n<th>PAT?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Overload (default)<\/strong><\/td>\n<td>Many-to-one / many-to-few<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>One-to-one<\/strong><\/td>\n<td>One internal IP ↔ one pool IP, <strong>first-come first-served<\/strong>; <strong>refuses connection<\/strong> if none left<\/td>\n<td><strong>No<\/strong> (source port unchanged)<\/td>\n<\/tr>\n<tr>\n<td><strong>Fixed port range<\/strong><\/td>\n<td>Maps an <strong>internal IP range to an external IP range<\/strong>; port range per host is calculated<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>Port block allocation<\/strong><\/td>\n<td>Each host gets <strong>block size<\/strong> (ports per block) × <strong>blocks per user<\/strong><\/td>\n<td>Yes — <strong>limits a rogue host<\/strong> (e.g. hping SYN flood capped at 64) so others aren't hurt<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>VIPs (DNAT)<\/h3>\n<ul>\n<li>VIP = DNAT object, used as the <strong>destination<\/strong> in a firewall policy (public IP → private server IP).<\/li>\n<li><strong>Default type = static NAT<\/strong> (one-to-one, both directions: the server's outgoing traffic also uses the VIP IP, unless overridden by an IP pool).<\/li>\n<li>Can <strong>port-forward<\/strong> (e.g. external 8080 → internal 80). CLI also has <strong>load-balance<\/strong> and <strong>server-load-balance<\/strong> (virtual + real servers, persistence, health checks).<\/li>\n<li>VIPs must be routable to the ingress interface; FortiGate answers ARP for VIPs and IP pools.<\/li>\n<\/ul>\n<p><strong>VIP gotcha:<\/strong> address objects <strong>don't match VIPs<\/strong> by default. A deny policy with destination <strong>all<\/strong> at the top <strong>won't<\/strong> block traffic to a VIP — it falls through to the VIP allow policy. Fix the deny policy with either:<\/p>\n<ul>\n<li><code>set match-vip enable<\/code> (<strong>only on DENY policies<\/strong>), or<\/li>\n<li>set its destination to the <strong>VIP object<\/strong>.<\/li>\n<\/ul>\n<h3>Central NAT<\/h3>\n<ul>\n<li><strong>Disabled by default<\/strong>; enable <strong>only on CLI<\/strong>: <code>config system settings<\/code> → <code>set central-nat enable<\/code>.<\/li>\n<li>Must first <strong>remove VIP/IP pool references<\/strong> from existing policies or the CLI refuses.<\/li>\n<li><strong>Central SNAT is mandatory for NGFW policy-based mode.<\/strong><\/li>\n<li>Central SNAT rules: top to bottom. Match on source/destination interface, source/destination address, protocol, source port.<\/li>\n<li><strong>No matching central SNAT rule → NO NAT<\/strong> (session uses the original source IP). No NAT option inside the firewall policy.<\/li>\n<li>Example: rule for TCP to 192.168.10.10 only → ICMP/UDP to it, or TCP to 192.168.10.20, is <strong>not<\/strong> NATed.<\/li>\n<li><strong>DNAT &amp; VIPs<\/strong>: as soon as a VIP is created a <strong>kernel rule<\/strong> does DNAT, no other config. Firewall policy destination = <strong>all or the VIP's mapped IP<\/strong> (VIP can't be selected). Exclude a VIP with <code>set status disable<\/code>.<\/li>\n<li><strong>Disabling central NAT<\/strong>: outgoing SNAT stops; incoming VIP traffic <strong>breaks<\/strong> (denied by policy ID 0) until you re-add NAT/IP pools and VIPs to policies.<\/li>\n<\/ul>\n<h3>Session helpers &amp; ALG<\/h3>\n<ul>\n<li>Some protocols need more than header changes: <strong>FTP active mode<\/strong> (separate control and data connections), <strong>SIP SDP<\/strong> payload rewrites after NAT.<\/li>\n<li>Session helper rewrites the app-layer address and opens a <strong>pinhole<\/strong> for the return media (e.g. SIP: 172.16.1.2 rewritten to 203.0.113.15 in the payload; incoming RTP to UDP 12546 allowed with <strong>no explicit policy<\/strong>). Same idea as NAT-T for IPsec.<\/li>\n<li>View: <code>show system session-helper<\/code>.<\/li>\n<li>For <strong>advanced application tracking and control → ALG<\/strong>. <strong>VoIP profile = example of an ALG.<\/strong><\/li>\n<\/ul>", "practice": false}, {"id": "security-5", "n": 5, "title": "Firewall Technologies, NGFW & Cisco ASA/Firepower", "html": "<h3>Types of firewall<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Key idea<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Packet filtering<\/strong><\/td>\n<td>Usually a router; filters <strong>Layer 3 (sometimes L4)<\/strong> info<\/td>\n<\/tr>\n<tr>\n<td><strong>Stateful<\/strong><\/td>\n<td>Tracks connection <strong>state<\/strong> (initiation, data transfer, termination) in a <strong>state table<\/strong>; works at L3 and analyzes <strong>L4 and L5<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Application gateway (proxy)<\/strong><\/td>\n<td>Filters at <strong>L3, 4, 5 and 7<\/strong>; mostly done in software<\/td>\n<\/tr>\n<tr>\n<td><strong>Host-based<\/strong><\/td>\n<td>Firewall software on a PC/server<\/td>\n<\/tr>\n<tr>\n<td><strong>Transparent<\/strong><\/td>\n<td>Filters IP traffic between a pair of <strong>bridged<\/strong> interfaces<\/td>\n<\/tr>\n<tr>\n<td><strong>Hybrid<\/strong><\/td>\n<td>Mix of types (e.g. stateful + application gateway = application inspection firewall)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Classic firewall config (ACL-based):<\/strong> 1) choose inside/outside interfaces, 2) configure ACLs per interface, 3) define inspection rules, 4) apply the inspection rule to an interface.<\/p>\n<h3>Stateful firewall: pros vs limits<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Benefits<\/th>\n<th>Limitations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary defence, filters unwanted traffic<\/td>\n<td><strong>Can't stop Application Layer attacks<\/strong> (doesn't read HTTP content)<\/td>\n<\/tr>\n<tr>\n<td>Stricter control than packet filters<\/td>\n<td><strong>UDP and ICMP aren't stateful<\/strong> — less filtering support<\/td>\n<\/tr>\n<tr>\n<td>Better performance than packet filters or proxies<\/td>\n<td>Hard to track <strong>dynamic port negotiation<\/strong> / multiple connections<\/td>\n<\/tr>\n<tr>\n<td>Defends against <strong>spoofing and DoS<\/strong> (checks if packet belongs to a connection)<\/td>\n<td><strong>No user authentication<\/strong><\/td>\n<\/tr>\n<tr>\n<td>More log info than packet filtering<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>NGFW (Next-Generation Firewall)<\/h3>\n<ul>\n<li>Old <strong>multi-pass UTM<\/strong> = separate modules (IPS, AV, URL filter) each re-decoding traffic → big slowdown.<\/li>\n<li>Apps changed: <strong>ports ≠ applications, IP addresses ≠ users, headers ≠ content<\/strong>.<\/li>\n<li>NGFW requirements: 1) identify <strong>apps<\/strong> regardless of port/protocol/evasion/SSL, 2) identify <strong>users<\/strong> regardless of IP, 3) scan <strong>content<\/strong> in real time, 4) granular app control, 5) multi-gigabit inline, no slowdown.<\/li>\n<li>Palo Alto's ID technologies: <strong>App-ID<\/strong> (app), <strong>User-ID<\/strong> (user), <strong>Content-ID<\/strong> (content). Prisma Access (formerly GlobalProtect cloud) is managed by <strong>Panorama<\/strong>.<\/li>\n<li>NGFW trends: built-in IPS replaces standalone IDPS; cloud malware sandboxing; granular branch blocking.<\/li>\n<li>Gartner leaders: <strong>Palo Alto, Fortinet, Cisco, Check Point<\/strong>. NSS Labs: FortiGate 500E <strong>99.3%<\/strong>, PA-5220 <strong>98.7%<\/strong>, Cisco Firepower 4120 <strong>71.8%<\/strong>.<\/li>\n<li>Consultant pick: <strong>Small business → Fortinet<\/strong>; Medium → Cisco, Palo Alto or Fortinet; <strong>Enterprise → Palo Alto<\/strong>.<\/li>\n<\/ul>\n<h3>Cisco firewall timeline<\/h3>\n<p><strong>PIX<\/strong> (\\~1994) → <strong>ASA Classic<\/strong> (2005) → <strong>ASA with Sourcefire/FirePOWER<\/strong> (2014) → <strong>FTD<\/strong>. GUI for ASA classic = <strong>ASDM<\/strong>; new devices ship with <strong>FTD<\/strong>, managed by <strong>FMC<\/strong> (Firepower Management Center — appliance or VM). Licenses: Base vs Security Plus; extra time-based/optional licenses (e.g. Botnet Traffic Filter, AnyConnect Premium). Check with <code>show version<\/code>.<\/p>\n<h3>ASA Classic commands<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>IOS router<\/th>\n<th>ASA equivalent<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>enable secret<\/code><\/td>\n<td><code>enable password<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>line vty<\/code> password<\/td>\n<td><code>passwd<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ip route<\/code><\/td>\n<td><code>route outside<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>show ip interface brief<\/code><\/td>\n<td><code>show interface ip brief<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>show ip route<\/code><\/td>\n<td><code>show route<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>show vlan<\/code><\/td>\n<td><code>show switch vlan<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>show ip nat translations<\/code><\/td>\n<td><code>show xlate<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>copy run start<\/code><\/td>\n<td><code>write [memory]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>erase startup-config<\/code><\/td>\n<td><code>write erase<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Basic: <code>hostname<\/code>, <code>domain-name<\/code>, <code>enable password<\/code>, <code>banner motd<\/code>.<\/li>\n<li>VLAN interfaces: <code>interface vlan 1<\/code> → <code>nameif inside<\/code> (security level auto <strong>100<\/strong>) → <code>ip address …<\/code>; <code>nameif outside<\/code> → security level <strong>0<\/strong>. Security level range <strong>0 (lowest) – 100 (highest)<\/strong>. IP can be manual, <code>ip address dhcp [setroute]<\/code>, or PPPoE.<\/li>\n<li>Remote mgmt: <code>http server enable<\/code>, <code>http &lt;net&gt; &lt;mask&gt; inside<\/code>, <code>ssh … inside<\/code>, <code>telnet … inside<\/code>.<\/li>\n<li>NTP: <code>ntp authenticate<\/code>, <code>ntp trusted-key 1<\/code>, <code>ntp authentication-key 1 md5 &lt;key&gt;<\/code>, <code>ntp server &lt;ip&gt;<\/code>.<\/li>\n<li>DHCP: <code>dhcpd address &lt;start&gt;-&lt;end&gt; inside<\/code>, <code>dhcpd dns<\/code>, <code>dhcpd lease<\/code>, <strong><code>dhcpd enable inside<\/code><\/strong>.<\/li>\n<li>Default route: <code>route outside 0.0.0.0 0.0.0.0 &lt;next-hop&gt;<\/code>.<\/li>\n<li>Object groups: <code>object-group network<\/code>, <code>object-group icmp-type<\/code>, <code>object-group service<\/code>.<\/li>\n<li><strong>Dynamic NAT<\/strong>: <code>object network PUBLIC<\/code> (range) + <code>object network DYNAMIC-NAT<\/code> → <code>subnet …<\/code> → <code>nat (inside,outside) dynamic PUBLIC<\/code>. Return ICMP: add icmp to <code>global_policy<\/code> inspection or an ACL on outside.<\/li>\n<li><strong>Dynamic PAT<\/strong>: <code>nat (inside,outside) dynamic interface<\/code>.<\/li>\n<li><strong>Static NAT<\/strong> (DMZ server): <code>object network DMZ-SERVER<\/code> → <code>host 192.168.2.3<\/code> → <code>nat (dmz,outside) static 209.165.200.227<\/code> + ACL on outside.<\/li>\n<li>Verify NAT: <code>show xlate<\/code>, <code>show nat<\/code>, <code>show nat detail<\/code>.<\/li>\n<\/ul>\n<h3>Firepower / FTD<\/h3>\n<p>Firepower software components:<\/p>\n<ul>\n<li><strong>Core software<\/strong> — includes the <strong>Snort engine<\/strong> (IDS/IPS), web GUI, event database.<\/li>\n<li><strong>Patches/hotfixes<\/strong>, <strong>Snort/Sourcefire rules<\/strong>.<\/li>\n<li><strong>VDB<\/strong> (vulnerability DB) — fingerprints of apps/services/OSs.<\/li>\n<li><strong>GeoDB<\/strong> — IP-to-country info.<\/li>\n<li><strong>URL filtering DB<\/strong> — categories + reputation.<\/li>\n<li><strong>Security Intelligence Feed<\/strong> — from <strong>Talos<\/strong> (Cisco threat intel) — bad IPs, domains, URLs.<\/li>\n<\/ul>\n<p>FTD = ASA + FirePOWER in one image:<\/p>\n<ul>\n<li><strong>ASA side<\/strong>: L2–L4 stateful firewall, NAT, ACL, routing, VPN, ALGs, HA/clustering.<\/li>\n<li><strong>FirePOWER side<\/strong>: NGIPS, AVC, URL filtering, <strong>AMP<\/strong>.<\/li>\n<li>FTD internals: <strong>Lina<\/strong> (traditional ASA functions, gets packets from interfaces), <strong>Snort<\/strong> (heart of inspection, L7), <strong>management<\/strong> components.<\/li>\n<li>FTD on ASA needs <strong>≥ 3 GB free + \\~100 MB boot image<\/strong>, and an <strong>SSD<\/strong>.<\/li>\n<li>Licensing: buy subscriptions → register FMC with <strong>Smart Licensing<\/strong> → apply licenses to FTD from FMC.<\/li>\n<li>FTD CLI: <code>firepower&gt;<\/code> (user EXEC) → <code>enable<\/code> → <code>firepower#<\/code>. On Firepower appliances the console CLI is <strong>FXOS<\/strong>; use <code>connect ftd<\/code>.<\/li>\n<li>Filter output: <code>show … | grep / include / exclude / begin &lt;regex&gt;<\/code>.<\/li>\n<\/ul>\n<h3>Snort architecture<\/h3>\n<p>Packet sniffer (<strong>DAQ<\/strong>) → packet decoder → <strong>preprocessors<\/strong> (normalize) → <strong>detection engine<\/strong> (rules builder builds rule chains + inspection) → output module (alerts/logs). Rule = <strong>rule header<\/strong> (where from/to, action, protocol) + <strong>rule options<\/strong> (what to look for in payload).<\/p>\n<h3>AMP (Advanced Malware Protection)<\/h3>\n<ul>\n<li>Files carved from traffic → SHA-256/Spero hash lookup, local <strong>ClamAV<\/strong> analysis, or <strong>Threat Grid<\/strong> sandbox.<\/li>\n<li>Block by <strong>file type<\/strong> (first block → whole file blocked) or by <strong>malware verdict<\/strong> (needs the whole file → only the <strong>last piece<\/strong> is blocked).<\/li>\n<li>Detection methods: one-to-one signatures, fuzzy fingerprinting, machine learning, advanced analytics, dynamic analysis — <strong>all point-in-time detection is &lt; 100%<\/strong>.<\/li>\n<li><strong>Retrospective<\/strong> detection + <strong>file trajectory<\/strong>: a file first marked unknown is later flagged malicious and all hosts that got it are alerted; endpoint connector quarantines it.<\/li>\n<li>Security is <strong>before (discover/harden), during (detect/block), after (scope/contain/remediate)<\/strong>.<\/li>\n<\/ul>\n<h3>Other FTD features<\/h3>\n<ul>\n<li><strong>URL filtering<\/strong> by URL or category (gambling, social media…).<\/li>\n<li><strong>Integrated SSL decryption<\/strong>: passive inbound (known keys), inbound inline, outbound inline (<strong>MitM<\/strong>, no keys); can block self-signed certs, old SSL versions, weak ciphers.<\/li>\n<\/ul>", "practice": false}, {"id": "security-6", "n": 6, "title": "Layer 2 Security (Chapter 4)", "html": "<p>If <strong>Layer 2 is compromised, every layer above it is affected<\/strong>. The 6 switch attack categories: <strong>CAM table, VLAN, DHCP, ARP, address spoofing, STP<\/strong>.<\/p>\n<h3>Attack → mitigation map<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Attack<\/th>\n<th>What happens<\/th>\n<th>Tool<\/th>\n<th>Mitigation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CAM / MAC table overflow<\/strong><\/td>\n<td>Flood fake source MACs until the fixed-size CAM table is full<\/td>\n<td><strong>macof<\/strong> (\\~8,000 frames/s)<\/td>\n<td><strong>Port security<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>VLAN hopping — switch spoofing<\/strong><\/td>\n<td>Attacker sends <strong>DTP<\/strong> to a dynamic auto/desirable port and forms a trunk<\/td>\n<td><strong>Yersinia<\/strong><\/td>\n<td>Access mode + disable DTP<\/td>\n<\/tr>\n<tr>\n<td><strong>VLAN hopping — double tagging<\/strong><\/td>\n<td>Attacker in the <strong>native VLAN<\/strong> sends 2 tags; switch 1 strips the outer, switch 2 forwards on the inner VLAN<\/td>\n<td>Yersinia<\/td>\n<td>Native VLAN ≠ VLAN 1 (unused VLAN)<\/td>\n<\/tr>\n<tr>\n<td><strong>DHCP spoofing<\/strong><\/td>\n<td>Rogue DHCP server hands out wrong gateway (MitM), wrong DNS, or bad IP (DoS)<\/td>\n<td>—<\/td>\n<td><strong>DHCP snooping<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>DHCP starvation<\/strong><\/td>\n<td>Leases the whole scope with bogus MACs<\/td>\n<td><strong>Gobbler<\/strong> (also Yersinia)<\/td>\n<td>Port security (but Gobbler can beat it by varying the hardware address)<\/td>\n<\/tr>\n<tr>\n<td><strong>ARP spoofing / poisoning<\/strong><\/td>\n<td>Gratuitous ARP replies map gateway/host IPs to attacker MAC → MitM<\/td>\n<td>dsniff, Cain &amp; Abel, ettercap, Yersinia<\/td>\n<td><strong>DAI<\/strong> (+ DHCP snooping)<\/td>\n<\/tr>\n<tr>\n<td><strong>MAC/IP address spoofing<\/strong><\/td>\n<td>Attacker copies a target's MAC; switch moves the CAM entry to the attacker port<\/td>\n<td>—<\/td>\n<td><strong>IP Source Guard<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>STP manipulation<\/strong><\/td>\n<td>Attacker sends superior BPDUs (priority 0) to become root bridge and see traffic<\/td>\n<td>—<\/td>\n<td><strong>BPDU Guard, Root Guard<\/strong> etc.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Port security<\/h3>\n<pre><code>SW1(config)# int range fa0/1-24\nSW1(config-if)# switchport mode access          ← ports default to dynamic auto, must set access first\nSW1(config-if)# switchport port-security maximum 2\nSW1(config-if)# switchport port-security mac-address sticky\nSW1(config-if)# switchport port-security violation shutdown\nSW1(config-if)# switchport port-security\nSW1# show port-security int fa0/1\n<\/code><\/pre>\n<ul>\n<li>Learn MACs <strong>manually<\/strong> (<code>port-security mac-address &lt;mac&gt;<\/code>) or <strong>dynamically<\/strong> (<code>mac-address sticky<\/code>). Max range 1–132.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Violation mode<\/th>\n<th>Forwards traffic<\/th>\n<th>Syslog<\/th>\n<th>Violation counter<\/th>\n<th>Shuts port<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Protect<\/strong><\/td>\n<td>No<\/td>\n<td><strong>No<\/strong><\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Restrict<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Shutdown<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Aging<\/strong>: <strong>Absolute<\/strong> = delete after the time; <strong>Inactivity<\/strong> = delete only if inactive for the time.<\/li>\n<li><strong>IP phones<\/strong>: allow <strong>2 MACs (3 on some switches)<\/strong> — phone on voice + access VLAN, plus the PC. <strong>Voice MACs can't be sticky.<\/strong><\/li>\n<\/ul>\n<h3>Mitigate VLAN hopping<\/h3>\n<ul>\n<li><code>switchport mode access<\/code> on non-trunk ports (disables DTP).<\/li>\n<li><code>switchport mode trunk<\/code> manually on trunks.<\/li>\n<li><code>switchport nonegotiate<\/code> on trunks.<\/li>\n<li><code>switchport trunk native vlan &lt;unused&gt;<\/code> — <strong>not VLAN 1<\/strong>.<\/li>\n<li>Shut unused ports and put them in an unused VLAN.<\/li>\n<\/ul>\n<h3>DHCP snooping<\/h3>\n<pre><code>S1(config)# ip dhcp snooping\nS1(config)# interface f0/1\nS1(config-if)# ip dhcp snooping trust              ← uplink to real DHCP server\nS1(config)# interface range f0/5 - 24\nS1(config-if-range)# ip dhcp snooping limit rate 6  ← untrusted, 6 packets/s\nS1(config)# ip dhcp snooping vlan 5,10,50-52\nS1# show ip dhcp snooping\nS1# show ip dhcp snooping binding\n<\/code><\/pre>\n<h3>Dynamic ARP Inspection (DAI)<\/h3>\n<ol>\n<li>Enable DHCP snooping globally.<\/li>\n<li>Enable DHCP snooping on chosen VLANs.<\/li>\n<li>Enable DAI on those VLANs: <code>ip arp inspection vlan 10<\/code>.<\/li>\n<li>Trust uplinks: <code>ip dhcp snooping trust<\/code> + <code>ip arp inspection trust<\/code>. <strong>Untrusted is the default<\/strong> — access ports untrusted, switch uplinks trusted.<\/li>\n<\/ol>\n<p>Extra checks: <code>ip arp inspection validate src-mac | dst-mac | ip<\/code>.<\/p>\n<h3>IP Source Guard (IPSG)<\/h3>\n<ul>\n<li>Like DAI but checks <strong>every packet<\/strong>, not just ARP. <strong>Requires DHCP snooping<\/strong> (for the IP-MAC bindings).<\/li>\n<li>Only on L2 access/trunk ports, untrusted: <code>ip verify source<\/code>.<\/li>\n<\/ul>\n<h3>Private VLANs (PVLANs)<\/h3>\n<p>L2 isolation between ports in the same broadcast domain.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Port type<\/th>\n<th>Can talk to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Promiscuous<\/strong><\/td>\n<td>Everyone (isolated + community) — usually the router port<\/td>\n<\/tr>\n<tr>\n<td><strong>Isolated<\/strong><\/td>\n<td><strong>Only promiscuous<\/strong> ports<\/td>\n<\/tr>\n<tr>\n<td><strong>Community<\/strong><\/td>\n<td>Same community + promiscuous<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Example: WWW + FTP need to talk → community; SQL server hidden from them → isolated.<\/p>\n<pre><code>vtp mode transparent\nvlan 100 → private-vlan primary\nvlan 101 → private-vlan community\nvlan 102 → private-vlan isolated\nvlan 100 → private-vlan association 101,102\nint fa0/1 → switchport mode private-vlan host → switchport private-vlan host-association 100 101\nint fa0/10 → switchport mode private-vlan promiscuous → switchport private-vlan mapping 100 101,102\nshow vlan private-vlan\n<\/code><\/pre>\n<p><code>switchport protected<\/code> = similar idea on 2960 switches.<\/p>\n<h3>STP<\/h3>\n<ul>\n<li>STP prevents L2 loops using <strong>BPDUs<\/strong>; redundant ports go to <strong>blocking<\/strong>.<\/li>\n<li><strong>Root bridge = lowest priority / lowest BID<\/strong>; tie on priority → lowest MAC wins.<\/li>\n<li><strong>Root port<\/strong> = closest to the root bridge. <strong>Designated port<\/strong> = non-root ports still forwarding. <strong>Alternate/backup<\/strong> = blocking.<\/li>\n<li>Set root: <code>spanning-tree vlan 1 root primary<\/code>, <code>… priority 24576<\/code>, or <code>… root secondary<\/code>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>What it does<\/th>\n<th>Apply to<\/th>\n<th>Command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>PortFast<\/strong><\/td>\n<td>Skip listening/learning → straight to forwarding<\/td>\n<td>End-host ports only (never switches)<\/td>\n<td><code>spanning-tree portfast<\/code> (global: <code>portfast default<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><strong>BPDU Guard<\/strong><\/td>\n<td><strong>Err-disables<\/strong> a port that receives a BPDU<\/td>\n<td>PortFast / end-user ports<\/td>\n<td><code>spanning-tree bpduguard enable<\/code> (global: <code>portfast bpduguard default<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Root Guard<\/strong><\/td>\n<td>Stops a port from becoming a path to a new root<\/td>\n<td>Ports that should never be root ports<\/td>\n<td><code>spanning-tree guard root<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Loop Guard<\/strong><\/td>\n<td>Stops alternate/root ports becoming designated after a unidirectional link failure<\/td>\n<td>Non-designated ports<\/td>\n<td><code>spanning-tree guard loop<\/code> (global: <code>loopguard default<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Root Guard and Loop Guard can't both be on the same port.<\/strong><\/p>\n<p>Bonus: Cisco <strong>vPC<\/strong> (2010) removes STP blocked ports for active-active uplinks, but only 2 parallel uplinks.<\/p>", "practice": false}, {"id": "security-7", "n": 7, "title": "VPN & IPsec (Chapter 5)", "html": "<p>A <strong>VPN is a private network built over a public network<\/strong> using virtual connections through the internet. Benefits: <strong>cost savings, security, scalability, compatibility<\/strong>. <strong>GRE<\/strong> (Cisco) tunnels many network-layer protocols inside IP.<\/p>\n<h3>VPN types<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Remote-access VPN<\/th>\n<th>Site-to-site VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Setup<\/td>\n<td><strong>Dynamic<\/strong>, enabled/disabled when needed<\/td>\n<td><strong>Static<\/strong>, both ends configured in advance<\/td>\n<\/tr>\n<tr>\n<td>Who starts it<\/td>\n<td>The <strong>client<\/strong> (software like Cisco <strong>AnyConnect<\/strong>)<\/td>\n<td>The gateways<\/td>\n<\/tr>\n<tr>\n<td>Hosts aware?<\/td>\n<td>Yes<\/td>\n<td><strong>No<\/strong> — internal hosts don't know a VPN exists<\/td>\n<\/tr>\n<tr>\n<td>Endpoints<\/td>\n<td>User device → gateway<\/td>\n<td>Router–router, firewall–firewall, or firewall–router<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Hub-and-spoke<\/strong>: spokes each have a tunnel to a central hub (main office ↔ branches).<\/li>\n<li><strong>Full mesh<\/strong>: every device has a tunnel to every other — no bottleneck at one gateway.<\/li>\n<li><strong>DMVPN<\/strong> = <strong>NHRP + mGRE + IPsec<\/strong>, auto-provisions site-to-site tunnels.<\/li>\n<li><strong>GETVPN<\/strong> = <strong>tunnel-less<\/strong>; all group members share one <strong>group SA<\/strong>.<\/li>\n<li><strong>Split tunneling<\/strong>: only corporate traffic goes through the VPN; internet traffic goes direct.<\/li>\n<\/ul>\n<h3>IPsec framework<\/h3>\n<p>IPsec = IETF standard (<strong>RFC 2401–2412<\/strong>), protects <strong>Layer 4–7<\/strong> traffic between peers.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Function<\/th>\n<th>Provided by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality<\/strong><\/td>\n<td>Encryption (DES default 56-bit, 3DES, AES, SEAL)<\/td>\n<\/tr>\n<tr>\n<td><strong>Integrity<\/strong><\/td>\n<td>Hashing (MD5, SHA)<\/td>\n<\/tr>\n<tr>\n<td><strong>Authentication<\/strong><\/td>\n<td><strong>IKE<\/strong> (e.g. pre-shared key, PSK)<\/td>\n<\/tr>\n<tr>\n<td><strong>Secure key exchange<\/strong><\/td>\n<td><strong>Diffie-Hellman (DH)<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>DH groups<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Groups<\/th>\n<th>Key size<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1, 2, 5<\/td>\n<td>768 / 1024 / 1536 bit<\/td>\n<td>Not recommended after 2012<\/td>\n<\/tr>\n<tr>\n<td>14, 15, 16<\/td>\n<td>2048 / 3072 / 4096 bit<\/td>\n<td>OK until 2030<\/td>\n<\/tr>\n<tr>\n<td>19, 20, 21, 24<\/td>\n<td>256 / 384 / 521 / 2048 bit (<strong>ECC<\/strong>)<\/td>\n<td>Faster key generation; <strong>24 = preferred next-gen<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>AH vs ESP<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>AH (Authentication Header)<\/th>\n<th>ESP (Encapsulating Security Payload)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Encryption / confidentiality<\/td>\n<td><strong>No<\/strong><\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Integrity + authentication<\/td>\n<td>Yes (hashes IP header + payload with shared key)<\/td>\n<td>Yes (hashes the encrypted payload)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Transport vs tunnel mode<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Transport mode<\/th>\n<th>Tunnel mode<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Protects <strong>L4 and up (payload only)<\/strong>; original IP header stays in plaintext<\/td>\n<td>Protects the <strong>whole original IP packet<\/strong>, then wraps it in a new IP header (<strong>IP-in-IP<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td>Used <strong>between hosts<\/strong><\/td>\n<td>Used between gateways; outer IP routes it<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>IKE<\/h3>\n<ul>\n<li>IKE = key management protocol, a hybrid running inside <strong>ISAKMP<\/strong> (which defines message format and SA negotiation). Uses <strong>UDP 500<\/strong>.<\/li>\n<li><strong>Phase 1<\/strong>: negotiate ISAKMP policy, authenticate peers, build a secure tunnel. <strong>Main mode = 6 packets (default)<\/strong>, <strong>aggressive mode = 3 packets<\/strong>.<\/li>\n<li><strong>Phase 2 = quick mode<\/strong>: negotiates IPsec SAs inside the Phase 1 tunnel.<\/li>\n<li><strong>IKEv2<\/strong> (RFC 4306): <strong>NAT detection + NAT-T<\/strong> in Phase 1 (auto if both sides support it), adds <strong>Dead Peer Detection<\/strong>, key rings, more config/policies.<\/li>\n<\/ul>\n<h3>Site-to-site IPsec config (IKEv1)<\/h3>\n<p><strong>Step 1 — ISAKMP Phase 1 policy: remember HAGLE<\/strong> = <strong>H<\/strong>ash, <strong>A<\/strong>uthentication, <strong>G<\/strong>roup, <strong>L<\/strong>ifetime, <strong>E<\/strong>ncryption.<\/p>\n<pre><code>R1(config)# crypto isakmp policy 1\nR1(config-isakmp)# hash md5\nR1(config-isakmp)# authentication pre-share\nR1(config-isakmp)# group 2\nR1(config-isakmp)# lifetime 86400\nR1(config-isakmp)# encryption 3des\nR1(config)# crypto isakmp key cisco1234 address 1.1.1.2\n<\/code><\/pre>\n<p><strong>Step 2 — IPsec (Phase 2):<\/strong><\/p>\n<ol>\n<li><strong>Crypto ACL / interesting traffic<\/strong>: <code>ip access-list extended VPN-TRAFFIC<\/code> → <code>permit ip 10.10.10.0 0.0.0.255 20.20.20.0 0.0.0.255<\/code><\/li>\n<li><strong>Transform set<\/strong>: <code>crypto ipsec transform-set TS esp-3des esp-md5-hmac<\/code><\/li>\n<li><strong>Crypto map<\/strong>: <code>crypto map CMAP 10 ipsec-isakmp<\/code> → <code>set peer 1.1.1.2<\/code> → <code>set transform-set TS<\/code> → <code>match address VPN-TRAFFIC<\/code><\/li>\n<li><strong>Apply to the public interface<\/strong>: <code>interface fa0/1<\/code> → <code>crypto map CMAP<\/code> (<strong>only one crypto map per interface<\/strong>; router says \"ISAKMP is ON\")<\/li>\n<\/ol>\n<ul>\n<li>R2 is the mirror image (peer 1.1.1.1, ACL reversed, same key/policy).<\/li>\n<li>If NAT is used for internet access, <strong>deny NAT for traffic going to the remote VPN network<\/strong>.<\/li>\n<li>Verify: <code>show crypto session<\/code>, <code>show crypto isakmp sa<\/code>, <code>show crypto ipsec sa<\/code>.<\/li>\n<\/ul>\n<h3>FlexVPN (IKEv2)<\/h3>\n<p>FlexVPN = <strong>IKEv2 + NGE (Next Generation Encryption)<\/strong>.<\/p>\n<ul>\n<li>IKEv2 parts: <strong>proposal<\/strong> (HAGLE), <strong>keyring<\/strong> (keys, can differ local vs remote), <strong>policy<\/strong>, <strong>profile<\/strong> (identities, auth methods).<\/li>\n<li>IPsec parts: transform sets, <strong>IPsec profile<\/strong>.<\/li>\n<li>Tunnel: <code>tunnel source<\/code>, <code>tunnel destination<\/code>, <code>tunnel mode ipsec ipv4<\/code>, <code>tunnel protection ipsec profile default<\/code>.<\/li>\n<li>Verify: <code>show crypto ikev2 sa<\/code>, <code>show crypto engine active connections<\/code>.<\/li>\n<\/ul>", "practice": false}, {"id": "security-8", "n": 8, "title": "Zone-Based Policy Firewall (Chapter 6)", "html": "<p>The old <strong>Cisco IOS Classic Firewall (CBAC)<\/strong> applied stateful inspection <strong>per interface<\/strong>. <strong>ZPF/ZFW<\/strong> (introduced in IOS <strong>12.4(6)T<\/strong>) applies policy <strong>between zones<\/strong>, with a <strong>default deny-all<\/strong> between zones until you allow traffic. Still supports stateful inspection, VRF-aware firewall, URL filtering, DoS mitigation.<\/p>\n<h3>The 5 configuration steps<\/h3>\n<ol>\n<li><strong>Create the zones<\/strong> — <code>zone security INSIDE<\/code> (also OUTSIDE, DMZ).<\/li>\n<li><strong>Identify traffic with a class-map<\/strong> — <code>class-map type inspect match-any|match-all &lt;name&gt;<\/code>, then <code>match protocol http<\/code>, <code>match access-group &lt;acl&gt;<\/code>, or <code>match class-map &lt;name&gt;<\/code>. (<code>match-any<\/code> = any one condition; <code>match-all<\/code> = every condition.) When allowing HTTP, also include HTTPS and DNS.<\/li>\n<li><strong>Define an action with a policy-map<\/strong> — <code>policy-map type inspect &lt;name&gt;<\/code> → <code>class type inspect &lt;class&gt;<\/code> → <code>inspect<\/code> | <code>drop<\/code> | <code>pass<\/code>.<\/li>\n<li><strong>Create a zone-pair and attach the policy<\/strong> — <code>zone-pair security IN-to-OUT source INSIDE destination OUTSIDE<\/code> → <code>service-policy type inspect &lt;policy-map&gt;<\/code>.<\/li>\n<li><strong>Assign interfaces to zones<\/strong> — on the interface: <code>zone-member security INSIDE<\/code>.<\/li>\n<\/ol>\n<h3>The 3 actions<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Action<\/th>\n<th>Stateful?<\/th>\n<th>Behaviour<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Drop<\/strong><\/td>\n<td>—<\/td>\n<td><strong>Default<\/strong> (class-default). <strong>Silently<\/strong> dropped — no ICMP unreachable (unlike an ACL). Add <code>log<\/code> for syslog.<\/td>\n<\/tr>\n<tr>\n<td><strong>Pass<\/strong><\/td>\n<td><strong>No<\/strong><\/td>\n<td>Forwards <strong>one direction only<\/strong>; return traffic needs its own policy. Good for IPsec ESP/AH, ISAKMP.<\/td>\n<\/tr>\n<tr>\n<td><strong>Inspect<\/strong><\/td>\n<td><strong>Yes<\/strong><\/td>\n<td>Tracks TCP/UDP sessions and <strong>auto-allows return traffic<\/strong>; can do app inspection; audit-trail via parameter-map.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Rules to remember<\/h3>\n<ul>\n<li><strong>No filtering for intra-zone traffic<\/strong> (same zone).<\/li>\n<li><strong>Only one zone per interface.<\/strong><\/li>\n<li><strong>Can't mix Classic Firewall (CBAC) and ZPF<\/strong> on the same interface.<\/li>\n<li>If only one interface is a zone member, <strong>all traffic is dropped<\/strong>.<\/li>\n<li>Only <strong>explicitly allowed<\/strong> traffic passes between zones.<\/li>\n<li>Traffic to the <strong>self zone<\/strong> (the router itself) is <strong>not filtered<\/strong>.<\/li>\n<\/ul>\n<h3>Verify<\/h3>\n<p><code>show run | begin class-map<\/code> · <code>show policy-map type inspect zone-pair sessions<\/code> · <code>show class-map type inspect<\/code> · <code>show zone security<\/code> · <code>show zone-pair security<\/code> · <code>show policy-map type inspect<\/code><\/p>", "practice": false}, {"id": "security-9", "n": 9, "title": "Cram Sheet — Defaults & Numbers", "html": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FortiGate default IP<\/td>\n<td><strong>192.168.1.99/24<\/strong> (MGMT or port1/internal)<\/td>\n<\/tr>\n<tr>\n<td>Default login<\/td>\n<td><strong>admin / (blank)<\/strong>, case-sensitive<\/td>\n<\/tr>\n<tr>\n<td>Default management protocols<\/td>\n<td>PING, HTTPS, SSH<\/td>\n<\/tr>\n<tr>\n<td>Default operation mode<\/td>\n<td><strong>NAT mode<\/strong> (L3); VDOMs off but <strong>root VDOM<\/strong> always exists<\/td>\n<\/tr>\n<tr>\n<td>Admin idle timeout<\/td>\n<td><strong>5 minutes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Trusted host default<\/td>\n<t
