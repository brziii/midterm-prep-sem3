d><strong>0.0.0.0/0<\/strong> (anywhere)<\/td>\n<\/tr>\n<tr>\n<td>Maintainer login<\/td>\n<td><code>maintainer<\/code> / <code>bcpb&lt;SERIAL&gt;<\/code>, console only, hard reboot, \\~<strong>60 s<\/strong> window, not on VMs<\/td>\n<\/tr>\n<tr>\n<td>AV/IPS updates<\/td>\n<td>Package download over <strong>TCP 443<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Web filter / antispam / DNS filter<\/td>\n<td><strong>Live queries<\/strong>, UDP 53 or 8888 (or HTTPS)<\/td>\n<\/tr>\n<tr>\n<td>FortiGuard access mode<\/td>\n<td><strong>Anycast<\/strong>, HTTPS 443<\/td>\n<\/tr>\n<tr>\n<td>FortiGuard OCSP check<\/td>\n<td>Every <strong>4 h<\/strong>; keeps last status <strong>7 days<\/strong><\/td>\n<\/tr>\n<tr>\n<td>DHCP unknown-MAC action<\/td>\n<td><strong>Assign IP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Firewall policy match<\/td>\n<td><strong>Top-down, first match<\/strong>; no match = <strong>Implicit Deny<\/strong> (ID 0)<\/td>\n<\/tr>\n<tr>\n<td>Policy name<\/td>\n<td><strong>Required on GUI<\/strong>, optional on CLI<\/td>\n<\/tr>\n<tr>\n<td>Default policy logging<\/td>\n<td><strong>Security Events<\/strong><\/td>\n<\/tr>\n<tr>\n<td>block-session-timer<\/td>\n<td><strong>30 s<\/strong> default (1–300)<\/td>\n<\/tr>\n<tr>\n<td>Object name length<\/td>\n<td><strong>35 characters<\/strong> max; only letters, numbers, <code>-<\/code>, <code>_<\/code>, spaces<\/td>\n<\/tr>\n<tr>\n<td>Policy ID<\/td>\n<td>Never changes when moved<\/td>\n<\/tr>\n<tr>\n<td>App control engine<\/td>\n<td><strong>IPS engine, flow-based<\/strong><\/td>\n<\/tr>\n<tr>\n<td>App control scan order<\/td>\n<td><strong>Overrides first<\/strong>, then categories<\/td>\n<\/tr>\n<tr>\n<td>QUIC default<\/td>\n<td><strong>Block<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Default IP pool<\/td>\n<td><strong>Overload<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Default VIP type<\/td>\n<td><strong>Static NAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Central NAT<\/td>\n<td><strong>Off by default<\/strong>, CLI only; mandatory in NGFW policy mode<\/td>\n<\/tr>\n<tr>\n<td>No central SNAT match<\/td>\n<td><strong>No NAT applied<\/strong><\/td>\n<\/tr>\n<tr>\n<td>match-vip<\/td>\n<td>Only on <strong>deny<\/strong> policies<\/td>\n<\/tr>\n<tr>\n<td>Port-security max<\/td>\n<td>1–132; IP phone needs 2 (or 3)<\/td>\n<\/tr>\n<tr>\n<td>macof speed<\/td>\n<td>\\~8,000 frames/s<\/td>\n<\/tr>\n<tr>\n<td>DHCP snooping/DAI ports<\/td>\n<td><strong>Untrusted by default<\/strong><\/td>\n<\/tr>\n<tr>\n<td>STP root<\/td>\n<td><strong>Lowest priority/BID<\/strong><\/td>\n<\/tr>\n<tr>\n<td>IKE port<\/td>\n<td><strong>UDP 500<\/strong><\/td>\n<\/tr>\n<tr>\n<td>IKE Phase 1<\/td>\n<td>Main mode <strong>6 packets<\/strong> (default), aggressive <strong>3<\/strong><\/td>\n<\/tr>\n<tr>\n<td>IKE Phase 2<\/td>\n<td><strong>Quick mode<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ISAKMP policy params<\/td>\n<td><strong>HAGLE<\/strong> — hash, auth, group, lifetime, encryption<\/td>\n<\/tr>\n<tr>\n<td>IPsec default encryption<\/td>\n<td><strong>56-bit DES<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Preferred DH group<\/td>\n<td><strong>24<\/strong> (ECC); 14–16 OK to 2030; 1/2/5 not after 2012<\/td>\n<\/tr>\n<tr>\n<td>ZPF default action<\/td>\n<td><strong>Drop<\/strong> (silent)<\/td>\n<\/tr>\n<tr>\n<td>ZPF introduced<\/td>\n<td>IOS <strong>12.4(6)T<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ASA security levels<\/td>\n<td>inside <strong>100<\/strong>, outside <strong>0<\/strong> (range 0–100)<\/td>\n<\/tr>\n<tr>\n<td>FTD on ASA needs<\/td>\n<td>≥ 3 GB free + \\~100 MB boot image, SSD<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "security-10", "n": 10, "title": "Practice Questions", "html": "<p>Questions 1–32 are the knowledge-check questions from the FortiGate decks; the rest come straight from the handouts. Cover the right column and test yourself.<\/p>\n<h3>FortiGate decks<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>More accurate description of a modern firewall?<\/td>\n<td>A <strong>multifunctional device<\/strong> inspecting traffic at the perimeter <strong>or internally<\/strong>, in a network with many entry points<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Fortinet solution that boosts performance and cuts latency?<\/td>\n<td><strong>SPUs<\/strong> (acceleration hardware)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Protocol for downloading AV and IPS packages?<\/td>\n<td><strong>TCP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>How does FortiGate check for spam / malicious websites?<\/td>\n<td><strong>Live queries to FortiGuard over UDP or HTTPS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>How do you restrict admin logins to specific IPs?<\/td>\n<td><strong>Trusted hosts<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Which admin protocol should you disable?<\/td>\n<td><strong>Telnet<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>DHCP rule \"Assign IP\" does what?<\/td>\n<td><strong>Dynamically assigns<\/strong> an IP to the MAC<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Which DNS method uses only the FortiGate DNS database?<\/td>\n<td><strong>Non-recursive<\/strong><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Restoring an encrypted config also needs…?<\/td>\n<td><strong>The password<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Read what before upgrading/downgrading firmware?<\/td>\n<td><strong>Release Notes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>What does FortiGate match traffic on?<\/td>\n<td><strong>Source and destination interfaces<\/strong> (not security profiles)<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>What must the Source field contain?<\/td>\n<td><strong>At least one address object or ISDB object<\/strong><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Policy name is mandatory on the…?<\/td>\n<td><strong>GUI<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Purpose of security profiles on a policy?<\/td>\n<td><strong>Protect against threats, control apps and URLs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Policy with <strong>any<\/strong> interface shows in which view?<\/td>\n<td><strong>By Sequence<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Valid address object name?<\/td>\n<td><strong>Good_Training<\/strong> (not Good(Training))<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Purpose of policy lookup?<\/td>\n<td><strong>Find the matching policy from input criteria<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>True about application control?<\/td>\n<td><strong>Uses the IPS engine<\/strong> to scan for app patterns<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>True about the app control database?<\/td>\n<td><strong>Separate from the IPS database<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>App control in NGFW policy-based mode?<\/td>\n<td><strong>Applications are applied directly to security policies<\/strong><\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td>App control HTTP block page works for…?<\/td>\n<td><strong>Only web applications<\/strong><\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>Where do you enable app control logging?<\/td>\n<td><strong>In the firewall policy<\/strong><\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Missing from the app log in NGFW policy mode?<\/td>\n<td><strong>App control profile name<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>Protocol for app control FortiGuard updates?<\/td>\n<td><strong>TCP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Recommended SSL inspection for app control?<\/td>\n<td><strong>Deep-inspection<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>What is NAT used for?<\/td>\n<td><strong>Preserving IP addresses<\/strong> (not traffic shaping)<\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>NAT66 is…?<\/td>\n<td>NAT <strong>between two IPv6 networks<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>Default IP pool type? Default VIP type?<\/td>\n<td><strong>Overload<\/strong>; <strong>static-nat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Is central NAT on by default?<\/td>\n<td><strong>No<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>No matching central SNAT policy → ?<\/td>\n<td><strong>NAT is not applied<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>Advanced application tracking and control?<\/td>\n<td><strong>Application layer gateway (ALG)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>Example of an ALG?<\/td>\n<td><strong>VoIP profile<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Handouts<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Question<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>33<\/td>\n<td>Which firewall type filters at L3, 4, 5 and 7, mostly in software?<\/td>\n<td><strong>Application gateway (proxy)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>Name two stateful firewall limitations.<\/td>\n<td>Can't stop <strong>application-layer attacks<\/strong>; UDP/ICMP not stateful; dynamic ports hard; <strong>no user auth<\/strong><\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>Palo Alto's three identification technologies?<\/td>\n<td><strong>App-ID, User-ID, Content-ID<\/strong><\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>Cisco IPS engine inside Firepower?<\/td>\n<td><strong>Snort<\/strong><\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>Cisco threat-intelligence team feeding Security Intelligence?<\/td>\n<td><strong>Talos<\/strong><\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>Two main FTD software parts?<\/td>\n<td><strong>Lina<\/strong> (ASA functions) and <strong>Snort<\/strong> (inspection)<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>ASA equivalent of <code>show ip nat translations<\/code>?<\/td>\n<td><code>show xlate<\/code><\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>Attack that floods fake MACs to fill the switch table? Mitigation?<\/td>\n<td><strong>CAM table overflow<\/strong> (macof) → <strong>port security<\/strong><\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>Port-security mode with no notification?<\/td>\n<td><strong>Protect<\/strong><\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>Two VLAN hopping attacks?<\/td>\n<td><strong>Switch spoofing<\/strong> (DTP) and <strong>double tagging<\/strong> (native VLAN)<\/td>\n<\/tr>\n<tr>\n<td>43<\/td>\n<td>Feature that stops rogue DHCP servers?<\/td>\n<td><strong>DHCP snooping<\/strong> (trust the uplink)<\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>DAI and IPSG both require…?<\/td>\n<td><strong>DHCP snooping<\/strong><\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>Difference between DAI and IPSG?<\/td>\n<td>DAI checks <strong>ARP<\/strong> packets; IPSG checks <strong>every packet<\/strong><\/td>\n<\/tr>\n<tr>\n<td>46<\/td>\n<td>PVLAN port that can only talk to promiscuous ports?<\/td>\n<td><strong>Isolated<\/strong><\/td>\n<\/tr>\n<tr>\n<td>47<\/td>\n<td>Which STP feature err-disables a port that receives a BPDU?<\/td>\n<td><strong>BPDU Guard<\/strong><\/td>\n<\/tr>\n<tr>\n<td>48<\/td>\n<td>Which two STP guards can't be on together?<\/td>\n<td><strong>Root Guard and Loop Guard<\/strong><\/td>\n<\/tr>\n<tr>\n<td>49<\/td>\n<td>Remote-access vs site-to-site: which is static and invisible to hosts?<\/td>\n<td><strong>Site-to-site<\/strong><\/td>\n<\/tr>\n<tr>\n<td>50<\/td>\n<td>IPsec: AH or ESP gives confidentiality?<\/td>\n<td><strong>ESP<\/strong><\/td>\n<\/tr>\n<tr>\n<td>51<\/td>\n<td>Which mode encrypts the whole original IP packet?<\/td>\n<td><strong>Tunnel mode<\/strong><\/td>\n<\/tr>\n<tr>\n<td>52<\/td>\n<td>IKE port? Phase 1 main vs aggressive packets?<\/td>\n<td><strong>UDP 500<\/strong>; <strong>6 vs 3<\/strong><\/td>\n<\/tr>\n<tr>\n<td>53<\/td>\n<td>What does HAGLE stand for?<\/td>\n<td><strong>Hash, Authentication, Group, Lifetime, Encryption<\/strong><\/td>\n<\/tr>\n<tr>\n<td>54<\/td>\n<td>How many crypto maps per interface?<\/td>\n<td><strong>One<\/strong><\/td>\n<\/tr>\n<tr>\n<td>55<\/td>\n<td>ZPF config steps in order?<\/td>\n<td><strong>Zones → class-map → policy-map → zone-pair + service-policy → assign interfaces<\/strong><\/td>\n<\/tr>\n<tr>\n<td>56<\/td>\n<td>ZPF action that is stateful? One-way only?<\/td>\n<td><strong>Inspect<\/strong>; <strong>Pass<\/strong><\/td>\n<\/tr>\n<tr>\n<td>57<\/td>\n<td>Is traffic within the same zone filtered? To the self zone?<\/td>\n<td><strong>No<\/strong>; <strong>No<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": true}], "cards": [{"q": "More accurate description of a modern firewall?", "a": "A <strong>multifunctional device<\/strong> inspecting traffic at the perimeter <strong>or internally<\/strong>, in a network with many entry points", "sec": "FortiGate decks"}, {"q": "Fortinet solution that boosts performance and cuts latency?", "a": "<strong>SPUs<\/strong> (acceleration hardware)", "sec": "FortiGate decks"}, {"q": "Protocol for downloading AV and IPS packages?", "a": "<strong>TCP<\/strong>", "sec": "FortiGate decks"}, {"q": "How does FortiGate check for spam / malicious websites?", "a": "<strong>Live queries to FortiGuard over UDP or HTTPS<\/strong>", "sec": "FortiGate decks"}, {"q": "How do you restrict admin logins to specific IPs?", "a": "<strong>Trusted hosts<\/strong>", "sec": "FortiGate decks"}, {"q": "Which admin protocol should you disable?", "a": "<strong>Telnet<\/strong>", "sec": "FortiGate decks"}, {"q": "DHCP rule \"Assign IP\" does what?", "a": "<strong>Dynamically assigns<\/strong> an IP to the MAC", "sec": "FortiGate decks"}, {"q": "Which DNS method uses only the FortiGate DNS database?", "a": "<strong>Non-recursive<\/strong>", "sec": "FortiGate decks"}, {"q": "Restoring an encrypted config also needs…?", "a": "<strong>The password<\/strong>", "sec": "FortiGate decks"}, {"q": "Read what before upgrading/downgrading firmware?", "a": "<strong>Release Notes<\/strong>", "sec": "FortiGate decks"}, {"q": "What does FortiGate match traffic on?", "a": "<strong>Source and destination interfaces<\/strong> (not security profiles)", "sec": "FortiGate decks"}, {"q": "What must the Source field contain?", "a": "<strong>At least one address object or ISDB object<\/strong>", "sec": "FortiGate decks"}, {"q": "Policy name is mandatory on the…?", "a": "<strong>GUI<\/strong>", "sec": "FortiGate decks"}, {"q": "Purpose of security profiles on a policy?", "a": "<strong>Protect against threats, control apps and URLs<\/strong>", "sec": "FortiGate decks"}, {"q": "Policy with <strong>any<\/strong> interface shows in which view?", "a": "<strong>By Sequence<\/strong>", "sec": "FortiGate decks"}, {"q": "Valid address object name?", "a": "<strong>Good_Training<\/strong> (not Good(Training))", "sec": "FortiGate decks"}, {"q": "Purpose of policy lookup?", "a": "<strong>Find the matching policy from input criteria<\/strong>", "sec": "FortiGate decks"}, {"q": "True about application control?", "a": "<strong>Uses the IPS engine<\/strong> to scan for app patterns", "sec": "FortiGate decks"}, {"q": "True about the app control database?", "a": "<strong>Separate from the IPS database<\/strong>", "sec": "FortiGate decks"}, {"q": "App control in NGFW policy-based mode?", "a": "<strong>Applications are applied directly to security policies<\/strong>", "sec": "FortiGate decks"}, {"q": "App control HTTP block page works for…?", "a": "<strong>Only web applications<\/strong>", "sec": "FortiGate decks"}, {"q": "Where do you enable app control logging?", "a": "<strong>In the firewall policy<\/strong>", "sec": "FortiGate decks"}, {"q": "Missing from the app log in NGFW policy mode?", "a": "<strong>App control profile name<\/strong>", "sec": "FortiGate decks"}, {"q": "Protocol for app control FortiGuard updates?", "a": "<strong>TCP<\/strong>", "sec": "FortiGate decks"}, {"q": "Recommended SSL inspection for app control?", "a": "<strong>Deep-inspection<\/strong>", "sec": "FortiGate decks"}, {"q": "What is NAT used for?", "a": "<strong>Preserving IP addresses<\/strong> (not traffic shaping)", "sec": "FortiGate decks"}, {"q": "NAT66 is…?", "a": "NAT <strong>between two IPv6 networks<\/strong>", "sec": "FortiGate decks"}, {"q": "Default IP pool type? Default VIP type?", "a": "<strong>Overload<\/strong>; <strong>static-nat<\/strong>", "sec": "FortiGate decks"}, {"q": "Is central NAT on by default?", "a": "<strong>No<\/strong>", "sec": "FortiGate decks"}, {"q": "No matching central SNAT policy → ?", "a": "<strong>NAT is not applied<\/strong>", "sec": "FortiGate decks"}, {"q": "Advanced application tracking and control?", "a": "<strong>Application layer gateway (ALG)<\/strong>", "sec": "FortiGate decks"}, {"q": "Example of an ALG?", "a": "<strong>VoIP profile<\/strong>", "sec": "FortiGate decks"}, {"q": "Which firewall type filters at L3, 4, 5 and 7, mostly in software?", "a": "<strong>Application gateway (proxy)<\/strong>", "sec": "Handouts"}, {"q": "Name two stateful firewall limitations.", "a": "Can't stop <strong>application-layer attacks<\/strong>; UDP/ICMP not stateful; dynamic ports hard; <strong>no user auth<\/strong>", "sec": "Handouts"}, {"q": "Palo Alto's three identification technologies?", "a": "<strong>App-ID, User-ID, Content-ID<\/strong>", "sec": "Handouts"}, {"q": "Cisco IPS engine inside Firepower?", "a": "<strong>Snort<\/strong>", "sec": "Handouts"}, {"q": "Cisco threat-intelligence team feeding Security Intelligence?", "a": "<strong>Talos<\/strong>", "sec": "Handouts"}, {"q": "Two main FTD software parts?", "a": "<strong>Lina<\/strong> (ASA functions) and <strong>Snort<\/strong> (inspection)", "sec": "Handouts"}, {"q": "ASA equivalent of <code>show ip nat translations<\/code>?", "a": "<code>show xlate<\/code>", "sec": "Handouts"}, {"q": "Attack that floods fake MACs to fill the switch table? Mitigation?", "a": "<strong>CAM table overflow<\/strong> (macof) → <strong>port security<\/strong>", "sec": "Handouts"}, {"q": "Port-security mode with no notification?", "a": "<strong>Protect<\/strong>", "sec": "Handouts"}, {"q": "Two VLAN hopping attacks?", "a": "<strong>Switch spoofing<\/strong> (DTP) and <strong>double tagging<\/strong> (native VLAN)", "sec": "Handouts"}, {"q": "Feature that stops rogue DHCP servers?", "a": "<strong>DHCP snooping<\/strong> (trust the uplink)", "sec": "Handouts"}, {"q": "DAI and IPSG both require…?", "a": "<strong>DHCP snooping<\/strong>", "sec": "Handouts"}, {"q": "Difference between DAI and IPSG?", "a": "DAI checks <strong>ARP<\/strong> packets; IPSG checks <strong>every packet<\/strong>", "sec": "Handouts"}, {"q": "PVLAN port that can only talk to promiscuous ports?", "a": "<strong>Isolated<\/strong>", "sec": "Handouts"}, {"q": "Which STP feature err-disables a port that receives a BPDU?", "a": "<strong>BPDU Guard<\/strong>", "sec": "Handouts"}, {"q": "Which two STP guards can't be on together?", "a": "<strong>Root Guard and Loop Guard<\/strong>", "sec": "Handouts"}, {"q": "Remote-access vs site-to-site: which is static and invisible to hosts?", "a": "<strong>Site-to-site<\/strong>", "sec": "Handouts"}, {"q": "IPsec: AH or ESP gives confidentiality?", "a": "<strong>ESP<\/strong>", "sec": "Handouts"}, {"q": "Which mode encrypts the whole original IP packet?", "a": "<strong>Tunnel mode<\/strong>", "sec": "Handouts"}, {"q": "IKE port? Phase 1 main vs aggressive packets?", "a": "<strong>UDP 500<\/strong>; <strong>6 vs 3<\/strong>", "sec": "Handouts"}, {"q": "What does HAGLE stand for?", "a": "<strong>Hash, Authentication, Group, Lifetime, Encryption<\/strong>", "sec": "Handouts"}, {"q": "How many crypto maps per interface?", "a": "<strong>One<\/strong>", "sec": "Handouts"}, {"q": "ZPF config steps in order?", "a": "<strong>Zones → class-map → policy-map → zone-pair + service-policy → assign interfaces<\/strong>", "sec": "Handouts"}, {"q": "ZPF action that is stateful? One-way only?", "a": "<strong>Inspect<\/strong>; <strong>Pass<\/strong>", "sec": "Handouts"}, {"q": "Is traffic within the same zone filtered? To the self zone?", "a": "<strong>No<\/strong>; <strong>No<\/strong>", "sec": "Handouts"}]}, {"id": "windows", "name": "Windows Server", "sub": "AD · Hybrid · Hyper-V · AVD · PowerShell", "intro": "<p>Built only from your 5 Windows decks (Active Directory, Hybrid AD, Hyper-V, Azure Virtual Desktop, PowerShell), using both the slides and the speaker notes. Bold = likely exam answer.<\/p>", "sections": [{"id": "windows-1", "n": 1, "title": "Active Directory", "html": "<p><strong>AD<\/strong> is Microsoft's <strong>directory service and identity provider<\/strong>. It manages access through <strong>authentication<\/strong> (who you are) and <strong>authorization<\/strong> (what you can do) in a domain. It follows the <strong>X.500<\/strong> standard (hierarchical, object-based), uses a <strong>distributed<\/strong> model for scale and redundancy, and is accessed with <strong>LDAP<\/strong>.<\/p>\n<p><strong>AD DS<\/strong> is the Windows Server <strong>role<\/strong> that delivers AD. Install it, then <strong>promote the server to a domain controller (DC)<\/strong>. It holds the directory database and uses <strong>multi-master replication<\/strong> — a change on one DC replicates to all DCs in the domain. (People say \"AD\" and \"AD DS\" interchangeably.)<\/p>\n<h3>Forests, domains, trees<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Forest<\/th>\n<th>Domain<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What it is<\/td>\n<td><strong>Top-level<\/strong> logical container: one or more domains/trees sharing a <strong>common root, schema and global catalog<\/strong><\/td>\n<td>Logical container of objects (users, computers, groups)<\/td>\n<\/tr>\n<tr>\n<td>Boundary<\/td>\n<td><strong>Security<\/strong>, replication and administrative boundary<\/td>\n<td><strong>Replication<\/strong> and administrative boundary<\/td>\n<\/tr>\n<tr>\n<td>Notes<\/td>\n<td>Root domain = first domain created. All domains in a forest <strong>trust each other by default<\/strong>. Different domains in one forest are <strong>NOT isolated<\/strong>.<\/td>\n<td>Has at least one DC; each DC holds a writable copy of its domain's database (RODC = read-only)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What lives where<\/strong> (from the notes):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Forest root domain only<\/th>\n<th>Every domain (incl. root)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Schema master role<\/td>\n<td>RID master role<\/td>\n<\/tr>\n<tr>\n<td>Domain naming master role<\/td>\n<td>Infrastructure master role<\/td>\n<\/tr>\n<tr>\n<td>Enterprise Admins group<\/td>\n<td>PDC emulator role<\/td>\n<\/tr>\n<tr>\n<td>Schema Admins group<\/td>\n<td>Domain Admins group<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Trusts<\/h3>\n<p>A trust lets users in one domain access resources in another. One-way or two-way.<\/p>\n<ul>\n<li><strong>Transitive<\/strong> = A trusts B and B trusts C → A trusts C. <strong>Non-transitive<\/strong> = stops at the two linked domains.<\/li>\n<li>Two-way trusts inside a forest are transitive. <strong>Trusts between forests are not transitive<\/strong> (per the slide).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Trust type<\/th>\n<th>Created<\/th>\n<th>Direction<\/th>\n<th>Transitive?<\/th>\n<th>Used for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Parent/child<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Two-way<\/td>\n<td>Yes<\/td>\n<td>New child domain<\/td>\n<\/tr>\n<tr>\n<td><strong>Tree-root<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Two-way<\/td>\n<td>Yes<\/td>\n<td>New tree added to forest<\/td>\n<\/tr>\n<tr>\n<td><strong>External<\/strong><\/td>\n<td>Manual<\/td>\n<td>One/two-way<\/td>\n<td><strong>No<\/strong><\/td>\n<td>NT4 domain, or another forest without a forest trust<\/td>\n<\/tr>\n<tr>\n<td><strong>Forest<\/strong><\/td>\n<td>Manual<\/td>\n<td>One/two-way<\/td>\n<td>Yes (between the 2 forests)<\/td>\n<td>Linking two forests<\/td>\n<\/tr>\n<tr>\n<td><strong>Shortcut<\/strong><\/td>\n<td>Manual<\/td>\n<td>One/two-way<\/td>\n<td>Yes<\/td>\n<td>Speed up auth between far-apart domains in one forest<\/td>\n<\/tr>\n<tr>\n<td><strong>Realm<\/strong><\/td>\n<td>Manual<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>AD ↔ <strong>non-Windows Kerberos realm<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Objects<\/h3>\n<ul>\n<li>Common objects: <strong>users, computers, groups<\/strong>.<\/li>\n<li>Group <strong>types<\/strong>: <strong>Security<\/strong> and <strong>Distribution<\/strong>. Group <strong>scopes<\/strong>: Local, <strong>Domain-local, Global, Universal<\/strong>.<\/li>\n<li><strong>Computers are security principals<\/strong> too: account + password that Windows changes automatically, authenticate to the domain, join groups, get Group Policy.<\/li>\n<li>Computer lifecycle: create object/join domain → configure, move between OUs, rename, reset, disable/enable, delete.<\/li>\n<\/ul>\n<h3>Containers vs OUs<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Containers<\/th>\n<th>Organizational Units (OUs)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hold objects<\/td>\n<td>Hold objects<\/td>\n<\/tr>\n<tr>\n<td><strong>Can NOT link GPOs<\/strong><\/td>\n<td><strong>Can link GPOs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Default location for new objects (e.g. <strong>CN=Computers<\/strong>)<\/td>\n<td>Usually built by location, department or object type<\/td>\n<\/tr>\n<tr>\n<td>Can't create an OU inside one<\/td>\n<td>Can nest OUs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Best practice: make custom OUs for computers instead of using the Computers container.<\/p>\n<h3>Domain Controllers<\/h3>\n<ul>\n<li>Host the AD DS database <strong>Ntds.dit<\/strong> and <strong>SYSVOL<\/strong>, and run the <strong>Kerberos KDC<\/strong> for authentication.<\/li>\n<li><strong>SYSVOL<\/strong> = shared folder on every DC with logon scripts, <strong>GPO template files<\/strong> and other AD files; replicated with <strong>DFSR<\/strong>.<\/li>\n<li>Availability: <strong>at least two DCs per domain<\/strong>. Security: use an <strong>RODC<\/strong> and <strong>BitLocker<\/strong>.<\/li>\n<li><strong>RODC<\/strong> prevents unauthorized local writes and <strong>doesn't cache passwords by default<\/strong> (if stolen, no domain credentials).<\/li>\n<li><strong>BitLocker<\/strong> = full-disk encryption.<\/li>\n<li>Upgrading DCs: <strong>in-place upgrade<\/strong> (e.g. 2008 R2 → 2022) OR <strong>add a new server and promote it<\/strong>. (The slide asks which one Microsoft recommends but doesn't give the answer — check your readings.)<\/li>\n<\/ul>\n<h3>Maintaining DCs<\/h3>\n<ul>\n<li><strong>AD Recycle Bin<\/strong> restores deleted objects.<\/li>\n<li><strong>Non-authoritative restore<\/strong> — restored DC accepts the <strong>latest data from its partners<\/strong>. Use for a DC that lost contact and stopped replicating.<\/li>\n<li><strong>Authoritative restore<\/strong> — restored DC's data <strong>wins<\/strong> and replicates out. Use to <strong>undo an accidental deletion<\/strong>.<\/li>\n<\/ul>\n<h3>Global Catalog (GC)<\/h3>\n<ul>\n<li><strong>Partial, read-only, searchable copy of all objects in the forest<\/strong> (all objects, not all attributes). Speeds up cross-domain searches.<\/li>\n<li>Needed for <strong>logon<\/strong> (checks <strong>universal group membership<\/strong> — only stored in the GC; no GC = logon may fail or use cached creds) and <strong>UPN resolution<\/strong> (user@contoso.com).<\/li>\n<li>Which attributes go in: the <strong>Partial Attribute Set (PAS)<\/strong>, flagged by <strong>isMemberOfPartialAttributeSet<\/strong> in the schema.<\/li>\n<li>Placement: <strong>single domain → all DCs are GCs<\/strong>; <strong>multi-domain → infrastructure master should NOT be a GC<\/strong> unless all DCs are GCs; <strong>multi-site → at least one GC per site<\/strong>.<\/li>\n<\/ul>\n<h3>FSMO / Operations master roles (5)<\/h3>\n<p>Check holders with <strong><code>netdom query fsmo<\/code><\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Scope<\/th>\n<th>Job<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Schema master<\/strong><\/td>\n<td>1 per <strong>forest<\/strong><\/td>\n<td>Only DC that can update the schema (e.g. Exchange install)<\/td>\n<\/tr>\n<tr>\n<td><strong>Domain naming master<\/strong><\/td>\n<td>1 per <strong>forest<\/strong><\/td>\n<td>Adds/removes domains (e.g. new child domain)<\/td>\n<\/tr>\n<tr>\n<td><strong>RID master<\/strong><\/td>\n<td>1 per <strong>domain<\/strong><\/td>\n<td>Hands out RID pools so every object gets a unique <strong>SID<\/strong> (domain SID + RID)<\/td>\n<\/tr>\n<tr>\n<td><strong>PDC emulator<\/strong><\/td>\n<td>1 per <strong>domain<\/strong><\/td>\n<td><strong>Time sync<\/strong> (authoritative time), <strong>password changes<\/strong>/lockouts, <strong>GPO conflict tie-breaker<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Infrastructure master<\/strong><\/td>\n<td>1 per <strong>domain<\/strong><\/td>\n<td>Updates <strong>cross-domain references<\/strong> (foreign security principals). Don't put on a GC unless all DCs are GCs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Schema<\/h3>\n<ul>\n<li>Rules and syntax of the AD DS database: <strong>object classes<\/strong> (classSchema) and <strong>attributes<\/strong> (attributeSchema). Attributes are defined once and reused.<\/li>\n<li>Classes define <strong>must-have<\/strong> (e.g. sAMAccountName) and <strong>may-have<\/strong> (e.g. telephoneNumber) attributes.<\/li>\n<li><strong>One schema per forest<\/strong>, stored in the schema partition, replicated to all DCs but <strong>writable only on the Schema Master<\/strong>.<\/li>\n<li>Only <strong>Schema Admins<\/strong> can modify it. Changes are <strong>permanent<\/strong> — you can <strong>disable but never delete<\/strong> new classes/attributes. Exchange, SCCM, Skype, third parties extend it.<\/li>\n<\/ul>\n<h3>Group Policy<\/h3>\n<ul>\n<li>Enforces settings on users and computers. <strong>Computer Configuration<\/strong> (applies regardless of who logs in) vs <strong>User Configuration<\/strong> (applies when the user logs in).<\/li>\n<li>Link GPOs to <strong>Sites, Domains, OUs<\/strong> (not containers).<\/li>\n<li><strong>Processing order: Local → Site → Domain → OU → Child OU<\/strong> (LSDOU).<\/li>\n<li>Default GPOs: <strong>Default Domain Policy<\/strong> and <strong>Default Domain Controllers Policy<\/strong>.<\/li>\n<li>Check applied policies: <strong><code>gpresult /r<\/code><\/strong>. Tools: <strong>Group Policy Management console<\/strong> and <strong>Group Policy Management Editor<\/strong>.<\/li>\n<\/ul>\n<h3>Monitoring &amp; troubleshooting tools<\/h3>\n<ul>\n<li><strong>Repadmin.exe<\/strong> — replication status: <code>repadmin /showrepl<\/code>, <code>/replsummary<\/code>, <code>/syncall<\/code>.<\/li>\n<li><strong>Dcdiag.exe<\/strong> — runs tests, reports overall domain health.<\/li>\n<li><strong>Event Viewer<\/strong>, <strong>PerfMon<\/strong>.<\/li>\n<\/ul>\n<h3>Least privilege &amp; admin groups<\/h3>\n<p><strong>Least privilege<\/strong> = give only the rights needed for the task; applies to user accounts, service accounts and processes.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>Where / what<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Enterprise Admins<\/strong><\/td>\n<td>In the <strong>forest root domain<\/strong>; admin anywhere<\/td>\n<\/tr>\n<tr>\n<td><strong>Domain Admins<\/strong><\/td>\n<td>Global group in the Users folder of every domain; any admin task in that domain<\/td>\n<\/tr>\n<tr>\n<td><strong>Schema Admins<\/strong><\/td>\n<td><strong>Universal<\/strong> group in the forest root domain; can <strong>modify the schema<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Administrators<\/strong><\/td>\n<td><strong>Domain local<\/strong> group in the <strong>Builtin<\/strong> folder; also exists locally on every computer<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "windows-2", "n": 2, "title": "Windows Server Tools, DHCP & DNS", "html": "<h3>Server Manager<\/h3>\n<ul>\n<li>Manages the local server <strong>plus up to 100 remote servers<\/strong>.<\/li>\n<li>Dashboard: configure local server, <strong>add roles and features<\/strong>, add servers, create server groups, connect to cloud services.<\/li>\n<li>Shows hardware info: OS version, processor, memory, total disk space.<\/li>\n<\/ul>\n<h3>Sconfig<\/h3>\n<p>Text-based config tool for <strong>Server Core<\/strong> and Desktop Experience. Options: domain/workgroup, computer name, add local admin, remote management, Windows Update, network settings, telemetry, shutdown/restart.<\/p>\n<h3>DHCP<\/h3>\n<ul>\n<li>Auto-assigns IP addresses. <strong>The DHCP server itself must have a static IP.<\/strong><\/li>\n<li><strong>DORA<\/strong>: <strong>D<\/strong>iscover (client broadcast) → <strong>O<\/strong>ffer (server proposes an IP) → <strong>R<\/strong>equest (client picks the first offer, names the server) → <strong>A<\/strong>cknowledge (DHCPACK). If the server can't give the offered address → <strong>DHCPNAK<\/strong>.<\/li>\n<li>Only DHCP servers or <strong>DHCP relay agents<\/strong> answer a Discover.<\/li>\n<li>Client tries to <strong>renew at 50% of the lease<\/strong>.<\/li>\n<li>Find which server gave you your address: <strong><code>ipconfig /all<\/code><\/strong>.<\/li>\n<\/ul>\n<p><strong>Authorizing DHCP in AD<\/strong><\/p>\n<ul>\n<li>A Windows DHCP server must be <strong>authorized in AD DS<\/strong> before it leases addresses (post-install task — <strong>flag icon<\/strong> in Server Manager).<\/li>\n<li><strong>Multiple domains → Enterprise Admin<\/strong> account. <strong>Single domain → Domain Admins<\/strong> member is enough.<\/li>\n<li>One DHCP server can serve subnets with multiple AD DS domains.<\/li>\n<li><strong>Standalone DHCP server<\/strong> = has the role but <strong>isn't an AD member<\/strong>.<\/li>\n<\/ul>\n<p><strong>Scopes &amp; options<\/strong><\/p>\n<ul>\n<li><strong>Scope<\/strong> = range of IPs for lease. Define: name/description, IP range, subnet mask, <strong>exclusions<\/strong> (e.g. first 20 for routers/printers/servers), delay, <strong>lease duration<\/strong>, options, <strong>activation<\/strong>.<\/li>\n<li><strong>Reservation<\/strong> = always give a specific IP to a device (e.g. printers). Action menu → New Reservation.<\/li>\n<li>Options (scope options) are usually set at the <strong>scope level<\/strong>. Main three:<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Router<\/td>\n<td><strong>003<\/strong><\/td>\n<\/tr>\n<tr>\n<td>DNS Server<\/td>\n<td><strong>006<\/strong><\/td>\n<\/tr>\n<tr>\n<td>DNS Domain Name<\/td>\n<td><strong>015<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>DHCP Failover<\/strong><\/p>\n<ul>\n<li><strong>Only two<\/strong> servers, <strong>IPv4 scopes only<\/strong>. Relationship needs a <strong>unique name<\/strong>; use the Configuration Failover Wizard.<\/li>\n<li>Modes: <strong>Load balance<\/strong> or <strong>Hot standby<\/strong>.<\/li>\n<li>Hot standby reserves <strong>5%<\/strong> of addresses for the standby server by default.<\/li>\n<li><strong>MCLT<\/strong> (Maximum Client Lead Time) = how long to wait before taking over the partner's range. <strong>Default 1 hour, can't be 0.<\/strong> After MCLT the secondary takes the whole range.<\/li>\n<li><strong>Auto state switchover interval<\/strong> (communication-interrupted → partner down) default <strong>60 minutes<\/strong>.<\/li>\n<li><strong>Message authentication<\/strong> with a shared secret.<\/li>\n<li>Failover traffic uses <strong>TCP 647<\/strong> (rules: Microsoft-Windows-DHCP-Failover-TCP-In/Out).<\/li>\n<\/ul>\n<h3>DNS<\/h3>\n<ul>\n<li>Resolves <strong>hostnames → IPs<\/strong>. <strong>Reverse lookup<\/strong> = IP → name (tool: <strong><code>nslookup<\/code><\/strong>). FQDN example: <strong>dc01.bcit.ca<\/strong>.<\/li>\n<li><strong>DNS resolver<\/strong> = server that resolves queries. Client <strong>caches<\/strong> answers for the <strong>TTL<\/strong>.<\/li>\n<li><strong>Hostname<\/strong>: max <strong>255 characters<\/strong>, letters/numbers/periods/hyphens.<\/li>\n<li><strong>NetBIOS name<\/strong>: <strong>non-hierarchical<\/strong>, legacy, <strong>16 characters<\/strong> (15 for the name + 1 for the service, e.g. SEA-SVR2[20h]).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>See cached records + TTL<\/td>\n<td><code>ipconfig /displaydns<\/code><\/td>\n<\/tr>\n<tr>\n<td>Flush cache<\/td>\n<td><code>ipconfig /flushdns<\/code> (a <strong>reboot<\/strong> or restarting the <strong>DNSCache<\/strong> service also flushes)<\/td>\n<\/tr>\n<tr>\n<td>Re-register in DNS<\/td>\n<td><code>ipconfig /registerdns<\/code> or <code>Register-DNSClient<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Windows name resolution order:<\/strong> DNS resolver cache → <strong>Hosts<\/strong> file (C:\\Windows\\System32\\Drivers\\etc) → DNS server → NetBIOS broadcast → <strong>LMHOSTS<\/strong> file → WINS.<\/p>\n<p><strong>Zones<\/strong><\/p>\n<ul>\n<li>Zone = a portion of the DNS namespace. <strong>Forward lookup<\/strong> zones hold many record types (mostly <strong>A<\/strong>). <strong>Reverse lookup<\/strong> zones only resolve <strong>IP → name<\/strong>.<\/li>\n<li>File-based zone: only one writable copy; read-only copies = <strong>secondary zones<\/strong>.<\/li>\n<\/ul>\n<p><strong>Records<\/strong> — every zone has <strong>SOA<\/strong> and <strong>NS<\/strong>; every record has a <strong>TTL<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Record<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Name → IPv4<\/td>\n<\/tr>\n<tr>\n<td><strong>AAAA<\/strong><\/td>\n<td>Name → IPv6<\/td>\n<\/tr>\n<tr>\n<td><strong>CNAME<\/strong> (alias)<\/td>\n<td>Name → another name<\/td>\n<\/tr>\n<tr>\n<td><strong>PTR<\/strong><\/td>\n<td>IP → name<\/td>\n<\/tr>\n<tr>\n<td><strong>MX<\/strong><\/td>\n<td>Mail servers for a domain<\/td>\n<\/tr>\n<tr>\n<td><strong>TXT<\/strong><\/td>\n<td>Arbitrary text<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Forwarding<\/strong><\/p>\n<ul>\n<li>By default DNS uses <strong>root hints<\/strong> to resolve internet names. <strong>Forwarders<\/strong> send queries elsewhere (common for internet resolution).<\/li>\n<li><strong>Conditional forwarder<\/strong> = per-domain; stored locally or in AD DS; <strong>does recursion, no zone transfers<\/strong>; you pick specific servers.<\/li>\n<li><strong>Stub zone<\/strong> = holds only <strong>NS records<\/strong> (+ their A records + SOA); <strong>takes part in zone transfers<\/strong>; uses all NS records in the zone.<\/li>\n<\/ul>\n<p><strong>Creating records<\/strong>: manually (DNS Manager, Windows Admin Center, PowerShell <code>Add-DnsServerResourceRecord&lt;Type&gt;<\/code>) or <strong>dynamically<\/strong> (the main method). Dynamic registration happens at DHCP client service start, <strong>every 24 hours<\/strong>, on IP change, or via <code>Register-DNSClient<\/code> / <code>ipconfig /registerdns<\/code>.<\/p>", "practice": false}, {"id": "windows-3", "n": 3, "title": "Hybrid Active Directory", "html": "<p><strong>Hybrid AD (hybrid identity)<\/strong> = using on-premises <strong>AD DS together with Microsoft Entra ID<\/strong> (formerly Azure AD), so users sign in to on-prem and cloud with <strong>one common identity<\/strong>. Benefits: <strong>seamless sign-in<\/strong>, hybrid work support, security (GPOs + Entra Conditional Access, MFA, identity protection), and a <strong>gradual migration path<\/strong> to the cloud.<\/p>\n<h3>Microsoft Entra ID<\/h3>\n<ul>\n<li>Microsoft-managed <strong>PaaS<\/strong> directory in the cloud; cloud-native and hybrid scenarios; manages users, groups, devices.<\/li>\n<li><strong>Multi-tenant<\/strong> — each tenant is logically isolated.<\/li>\n<li>Extra features AD DS lacks: <strong>MFA<\/strong>, identity protection, <strong>self-service password reset<\/strong>, SSO to SaaS apps, Conditional Access, Application Proxy, irregular sign-in detection, federation.<\/li>\n<li>Designed for internet apps over <strong>HTTP 80 / HTTPS 443<\/strong>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>AD DS (on-prem)<\/th>\n<th>Entra ID (cloud)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Authentication<\/td>\n<td><strong>Kerberos<\/strong> (default, ticket-based, KDC on DCs), <strong>NTLM<\/strong> (legacy, hash-based)<\/td>\n<td><strong>OAuth 2.0, OpenID Connect, SAML<\/strong> (also WS-Federation)<\/td>\n<\/tr>\n<tr>\n<td>Directory access<\/td>\n<td><strong>LDAP<\/strong><\/td>\n<td><strong>Microsoft Graph (REST API)<\/strong> — no LDAP<\/td>\n<\/tr>\n<tr>\n<td>Policy<\/td>\n<td><strong>Group Policy (GPOs)<\/strong><\/td>\n<td><strong>Conditional Access + Intune<\/strong> — no GPOs<\/td>\n<\/tr>\n<tr>\n<td>Structure<\/td>\n<td>Forests, domains, OUs<\/td>\n<td><strong>Flat tenant<\/strong>, no OUs<\/td>\n<\/tr>\n<tr>\n<td>Deployment<\/td>\n<td>DCs / VMs<\/td>\n<td>PaaS — no DCs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Protocols in Entra ID:<\/p>\n<ul>\n<li><strong>OAuth 2.0<\/strong> — <strong>authorization<\/strong> (granting apps access, e.g. Microsoft Graph).<\/li>\n<li><strong>OpenID Connect (OIDC)<\/strong> — layer on OAuth 2.0 for <strong>authentication<\/strong>; SSO.<\/li>\n<li><strong>SAML<\/strong> — older <strong>XML-based<\/strong> SSO, common in enterprise SaaS.<\/li>\n<\/ul>\n<h3>Ways to integrate AD DS with Azure<\/h3>\n<ol>\n<li><strong>Extend AD DS to Azure<\/strong> — Azure VMs promoted to DCs in your on-prem domain.<\/li>\n<li><strong>Directory sync only<\/strong> — users/groups/contacts copied; <strong>separate passwords<\/strong> for cloud and on-prem.<\/li>\n<li><strong>Sync + password hash sync<\/strong> — same password both places.<\/li>\n<li><strong>SSO / federation<\/strong> (AD FS or PTA) — the widest feature range.<\/li>\n<\/ol>\n<p>Entra ID is <strong>a copy, not an extension<\/strong> of on-prem AD. <strong>Sync is one-way: on-prem AD DS → Entra ID.<\/strong> Changes in Entra ID don't go back. Entra ID can also be used with <strong>no<\/strong> on-prem directory.<\/p>\n<h3>Hybrid authentication methods<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>How it works<\/th>\n<th>Key facts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Password Hash Sync (PHS)<\/strong><\/td>\n<td>A <strong>hash of the AD password hash<\/strong> is synced to Entra ID<\/td>\n<td><strong>Default<\/strong> with Entra Connect. Never plain text. Users use same password for M365. Needed for <strong>leaked-credentials report<\/strong>, and can be a <strong>failover<\/strong> method<\/td>\n<\/tr>\n<tr>\n<td><strong>Pass-Through Authentication (PTA)<\/strong><\/td>\n<td>Passwords <strong>never stored in Entra ID<\/strong>; validation passed to <strong>on-prem DCs<\/strong><\/td>\n<td>Simpler than ADFS. Put a replica DC in Azure to avoid downtime<\/td>\n<\/tr>\n<tr>\n<td><strong>Federation (AD FS)<\/strong><\/td>\n<td>Credentials go to a separate identity provider (Windows Server on-prem or Azure IaaS VM) that talks to your DC<\/td>\n<td><strong>Only option for on-prem MFA or smartcard/certificate sign-in<\/strong>; also third-party auth<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>On-prem components are needed if you must enforce per-sign-in AD policies (expired/disabled/locked accounts, password expired, sign-in hours).<\/p>\n<h3>Directory synchronization &amp; Entra Connect<\/h3>\n<ul>\n<li>Sync syncs <strong>users, groups and contacts<\/strong>. Filter by <strong>OU, domain, user attributes, applications<\/strong>.<\/li>\n<li><strong>Microsoft Entra Connect<\/strong> can include: Entra Sync, Exchange hybrid, <strong>password writeback<\/strong>, AD FS / Web Application Proxy, Graph PowerShell module. Usually on a <strong>dedicated sync server<\/strong>.<\/li>\n<li>If the Connect server goes down, <strong>sync stops but sign-ins still work<\/strong>.<\/li>\n<li><strong>Required accounts<\/strong>: <strong>Global Administrator<\/strong> in Azure + <strong>Enterprise Administrator<\/strong> on-prem + <strong>local admin<\/strong> on the sync server.<\/li>\n<li>The Enterprise Admin account is only needed during setup and <strong>isn't stored<\/strong> — make a dedicated install account and remove it from Enterprise Admins afterward.<\/li>\n<li>Installer account is added to <strong>ADSyncAdmins<\/strong> (sign out/in to use Synchronization Service Manager).<\/li>\n<li>Service accounts created: <strong>MSOL_\\<id><\/strong> (directory-replication permissions on-prem, syncs to tenant) and <strong>AAD_\\<id><\/strong> (sync engine service account, random password, never expires). <strong>Don't change the service account<\/strong> after install or sync stops.<\/li>\n<li>What sync does: new objects added (<strong>licenses not auto-assigned<\/strong>), changed attributes updated (not all attributes), deleted objects deleted, disabled users disabled (licenses not removed). On-prem is the <strong>single source of authority<\/strong>.<\/li>\n<\/ul>\n<h3>Entra Cloud Sync<\/h3>\n<p>Newer option: <strong>lightweight provisioning agent<\/strong> instead of the full Connect app; orchestration and config live in Entra ID.<\/p>\n<h3>Pre-deployment checks<\/h3>\n<ul>\n<li>Look for invalid characters and bad <strong>UPNs<\/strong>, count users/email domains, check functional levels &amp; schema extensions, Exchange/Skype proxies, SharePoint domains, SSO readiness, ports and M365 DNS records.<\/li>\n<li>Fix duplicate <strong>proxyAddress/userPrincipalName<\/strong>, blank/invalid UPNs, invalid characters (givenName, sn, sAMAccountName, displayName, mail, proxyAddresses, mailNickname, UPN).<\/li>\n<li>SSO UPNs: only letters, numbers, periods, dashes, underscores. Domains must be <strong>routable<\/strong> — <strong>no .local<\/strong> (e.g. Contoso.local).<\/li>\n<li>Tools: <strong>IdFix<\/strong> (finds/fixes most sync errors like duplicate proxyAddresses/UPNs) and <strong>ADModify.NET<\/strong> (<strong>batch<\/strong> attribute changes across OUs/domains).<\/li>\n<\/ul>\n<h3>SSO vs Seamless SSO<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>SSO<\/th>\n<th>Seamless SSO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sign in once, then other SSO apps (e.g. Outlook → OneDrive)<\/td>\n<td><strong>No initial login<\/strong> on corporate devices on the corporate network<\/td>\n<\/tr>\n<tr>\n<td>Device doesn't need to be domain-joined<\/td>\n<td>Must be <strong>domain-joined Windows<\/strong> device<\/td>\n<\/tr>\n<tr>\n<td>Works anywhere, any device<\/td>\n<td><strong>Only on the corporate network<\/strong><\/td>\n<\/tr>\n<tr>\n<td>General SSO across apps<\/td>\n<td>Passwordless experience; works with <strong>PHS or PTA<\/strong>; enabled in <strong>Entra Connect<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "windows-4", "n": 4, "title": "Hyper-V", "html": "<p><strong>Hyper-V<\/strong> is Microsoft's <strong>hypervisor<\/strong> — the layer that abstracts hardware. It fixes physical-server problems of <strong>utilization, scale and cost<\/strong>, and runs Windows, Linux and FreeBSD guests.<\/p>\n<h3>Hypervisor types<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Type 1 — Bare metal<\/th>\n<th>Type 2 — Hosted<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Runs on<\/td>\n<td><strong>Directly on hardware<\/strong><\/td>\n<td>On top of a <strong>host OS<\/strong>, like an app<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td><strong>Hyper-V, ESXi, Proxmox<\/strong><\/td>\n<td><strong>VirtualBox, VMware Workstation<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Layers<\/td>\n<td>Hardware → hypervisor → management OS → guest VMs → apps<\/td>\n<td>Hardware → host OS → hypervisor app → guest VMs → apps<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why Hyper-V is Type 1:<\/strong> install Windows Server, add the Hyper-V role, and it <strong>reboots into a thin hypervisor that loads before Windows<\/strong>. Windows becomes the <strong>management OS = parent = root partition<\/strong>. The hypervisor controls all hardware access.<\/p>\n<h3>Architecture pieces<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Lives in<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Root (parent) partition<\/strong><\/td>\n<td>Created when the role is installed<\/td>\n<td>Full Windows host OS; <strong>direct hardware access<\/strong>; runs the <strong>VSPs<\/strong>; creates/manages child partitions<\/td>\n<\/tr>\n<tr>\n<td><strong>Child partition<\/strong><\/td>\n<td>Each VM<\/td>\n<td><strong>No direct hardware access<\/strong>; talks to root via <strong>VMBus<\/strong>; uses <strong>Enlightened I/O<\/strong> (Hyper-V-aware drivers)<\/td>\n<\/tr>\n<tr>\n<td><strong>Hypercall<\/strong><\/td>\n<td>Partition → hypervisor<\/td>\n<td>Virtualization version of a <strong>system call<\/strong>; the <strong>only way<\/strong> a partition asks the hypervisor for something<\/td>\n<\/tr>\n<tr>\n<td><strong>VSC<\/strong> (Virtual Service Client)<\/td>\n<td><strong>Child<\/strong> partition<\/td>\n<td><strong>Synthetic device driver<\/strong>; turns guest I/O into VMBus messages (NetVSC, StorVSC, VidVSC)<\/td>\n<\/tr>\n<tr>\n<td><strong>VSP<\/strong> (Virtual Service Provider)<\/td>\n<td><strong>Root<\/strong> partition<\/td>\n<td><strong>Kernel-mode<\/strong> driver paired with a VSC; talks to the real hardware driver (NetVSP, StorVSP, VidVSP)<\/td>\n<\/tr>\n<tr>\n<td><strong>VMBus<\/strong><\/td>\n<td>Between root and child<\/td>\n<td>High-speed <strong>shared-memory<\/strong> channel + <strong>event signaling<\/strong>; replaces slow <strong>device emulation<\/strong> with synthetic devices<\/td>\n<\/tr>\n<tr>\n<td><strong>VMMS<\/strong> (VM Management Service)<\/td>\n<td>Root<\/td>\n<td><strong>Central management service<\/strong>; listens to Hyper-V Manager, PowerShell, SCVMM, WMI; creates/deletes, configures, starts/stops/saves VMs<\/td>\n<\/tr>\n<tr>\n<td><strong>VMWP<\/strong> (VM Worker Process)<\/td>\n<td>Root, <strong>user mode<\/strong><\/td>\n<td><strong>One per running VM<\/strong>, spawned by VMMS; lifecycle tasks (start, pause, checkpoint) and monitoring<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Hypercalls<\/strong> are used for: processor management (add/remove vCPUs, interrupts), memory management (guest-physical → host-physical mapping), I/O virtualization (VMBus, SR-IOV), partition control (create/destroy, power state). Flow: request via <strong>Hypercall Page<\/strong> → CPU switches to hypervisor mode → hypervisor runs it → control returns.<\/p>\n<p><strong>I/O path (network example):<\/strong> App → guest TCP/IP → <strong>NetVSC<\/strong> → <strong>VMBus<\/strong> ring → <strong>NetVSP<\/strong> (root) → Hyper-V virtual switch → physical NIC driver → wire. Inbound is the reverse. Without VMBus: emulated device → slow.<\/p>\n<p><strong>Starting a VM:<\/strong> Start-VM → <strong>VMMS<\/strong> → spawns <strong>VMWP.exe<\/strong> → WinHv library → <strong>VID<\/strong> driver → <strong>hypercalls<\/strong> → hypervisor creates child partition → VSPs offer devices, VMBus channels set up → guest boots and loads its VSCs. Hypercalls set things up; packet I/O itself flows over VMBus.<\/p>\n<p>Why VSC/VSP: <strong>performance<\/strong> (no emulation), <strong>isolation<\/strong> (VM never touches hardware), extensibility, works with SR-IOV and dynamic memory.<\/p>\n<h3>Requirements (CPU)<\/h3>\n<ul>\n<li><strong>64-bit<\/strong> processor<\/li>\n<li><strong>SLAT<\/strong> (Second-Level Address Translation)<\/li>\n<li>VM Monitor Mode extensions: <strong>Intel VT or AMD-V<\/strong><\/li>\n<li>Hardware <strong>DEP<\/strong>: <strong>Intel XD or AMD NX<\/strong> bit<\/li>\n<\/ul>\n<h3>Best practices<\/h3>\n<ul>\n<li>Enough host hardware; VMs on <strong>separate disks or Cluster Shared Volumes (CSVs)<\/strong>.<\/li>\n<li><strong>Only the Hyper-V role<\/strong> on the host. <strong>Manage remotely<\/strong> (RSAT, PowerShell, RDP).<\/li>\n<li>Run the host on <strong>Server Core<\/strong> (fewer resources, fewer updates/reboots).<\/li>\n<li>Use <strong>Best Practice Analyzer<\/strong> and <strong>resource metering<\/strong>.<\/li>\n<li>Use <strong>Generation 2 VMs<\/strong> unless the guest OS doesn't support it.<\/li>\n<\/ul>\n<h3>Networking<\/h3>\n<ul>\n<li>Adapters: <strong>Legacy<\/strong> (Gen 1 only) vs <strong>Synthetic<\/strong> (Gen 1 and 2, <strong>preferred<\/strong>, faster).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Virtual switch<\/th>\n<th>VM ↔ VM<\/th>\n<th>VM ↔ host<\/th>\n<th>VM ↔ outside network<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>External<\/strong> (mapped to a physical NIC)<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Internal<\/strong><\/td>\n<td>Yes<\/td>\n<td><strong>Yes<\/strong><\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Private<\/strong><\/td>\n<td>Yes<\/td>\n<td><strong>No<\/strong><\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Advanced: Network Virtualization, bandwidth management, <strong>DHCP guard, router guard<\/strong>, port mirroring, NIC teaming, <strong>VMQ, SR-IOV<\/strong>, IPsec task offloading.<\/li>\n<li>Server 2016+ SDN: <strong>Switch Embedded Teaming (SET)<\/strong>, RDMA, VMMQ, converged adapters, NAT object. Server 2019+: <strong>RSC<\/strong>, <strong>d.VMMQ<\/strong>.<\/li>\n<\/ul>\n<h3>Storage<\/h3>\n<p>VHDs can be managed with Hyper-V Manager, Disk Management, <strong>diskpart<\/strong>, <strong><code>New-VHD<\/code><\/strong>, Windows Admin Center.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Format<\/th>\n<th>Max size<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>VHD<\/strong><\/td>\n<td><strong>2 TB<\/strong><\/td>\n<td>For older Hyper-V versions<\/td>\n<\/tr>\n<tr>\n<td><strong>VHDX<\/strong><\/td>\n<td><strong>64 TB<\/strong><\/td>\n<td>Less corruption, bigger blocks, faster, <strong>resize while running<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>VHD Set<\/strong><\/td>\n<td>—<\/td>\n<td><strong>Shared VHDs only<\/strong>, backups of VM groups; Windows 10+<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>VHD ↔ VHDX conversion is supported; <strong>VHD Set can't be converted<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Disk type<\/th>\n<th>Behaviour<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fixed<\/strong><\/td>\n<td>Allocates full size <strong>immediately<\/strong> → better performance<\/td>\n<\/tr>\n<tr>\n<td><strong>Dynamically expanding<\/strong><\/td>\n<td>Grows as data is added up to the max → better storage use<\/td>\n<\/tr>\n<tr>\n<td><strong>Differencing<\/strong><\/td>\n<td><strong>Child stores changes<\/strong> to a read-only parent; <strong>checkpoints are differencing disks<\/strong>; chains hurt performance<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>VM configuration &amp; management<\/h3>\n<ul>\n<li><strong>Configuration version<\/strong> = compatibility of VM components, set by the host's Hyper-V version. Old version may not start on a new host. Upgrade with <strong><code>Update-VMVersion &lt;vm&gt;<\/code><\/strong> — <strong>can't downgrade<\/strong>. Check with <code>Get-VMHostSupportedVersion [-Default]<\/code>.<\/li>\n<li>Settings: <strong>Hardware<\/strong> and <strong>Management<\/strong>. Files: <strong>.VMCX<\/strong> (configuration), <strong>.VMRS<\/strong> (runtime data).<\/li>\n<li><strong>Import<\/strong>: Register in-place (same ID), Restore (same ID), <strong>Copy (new ID)<\/strong>. <strong>Export<\/strong>: one checkpoint or VM with all checkpoints.<\/li>\n<\/ul>\n<p><strong>Integration services:<\/strong> Heartbeat, Guest shutdown, Time sync, <strong>Data exchange (KVP)<\/strong>, <strong>Volume shadow copy requestor<\/strong> (backup without shutdown), Guest service interface (copy files), <strong>PowerShell Direct<\/strong> (PowerShell into a VM <strong>without a network<\/strong>).<\/p>\n<p><strong>Discrete Device Assignment (DDA):<\/strong> VM gets direct access to physical <strong>PCIe<\/strong> hardware — <strong>GPUs and NVMe<\/strong> only; Gen 1 and Gen 2. Loses <strong>Dynamic Memory, save/restore, live migration, HA clustering<\/strong>.<\/p>\n<p><strong>Enhanced Session Mode:<\/strong> redirect printers, clipboard, local/USB drives into a VM via <strong>VMConnect<\/strong>. Needs the policy + mode enabled on the host, and Windows 8.1+/Server 2012 R2+ on both sides with <strong>Remote Desktop Services<\/strong> enabled in the VM.<\/p>\n<p><strong>Checkpoints:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Production (<strong>default<\/strong>)<\/th>\n<th>Standard<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Uses a <strong>backup<\/strong> function inside the VM (not saved state)<\/td>\n<td>Captures running state, data and hardware config<\/td>\n<\/tr>\n<tr>\n<td>For production<\/td>\n<td>For <strong>testing/labs<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>VM states:<\/strong> Off, Starting, Running, Pausing, <strong>Paused<\/strong> (memory still allocated), Saving, <strong>Saved<\/strong> (memory + CPU state written to disk), Stopping, Reset, Suspended (live migration), and <strong>Critical<\/strong> error states (OtherCritical/SavedCritical/PausedCritical).<\/p>", "practice": false}, {"id": "windows-5", "n": 5, "title": "Azure Virtual Desktop (AVD)", "html": "<p><strong>AVD<\/strong> is a <strong>desktop and application virtualization service in Azure<\/strong> (a VDI solution). Works on Windows, Mac, iOS, Android, Linux and most modern browsers. Enterprise scale = <strong>1,000+ virtual desktops<\/strong>.<\/p>\n<p><strong>Use cases:<\/strong> security/regulated industries (finance, healthcare, government); elastic workforce (remote workers, contractors, partners); employees (BYOD, mobile, call centers, branches); specialized workloads (design/engineering, legacy apps, dev/test).<\/p>\n<p><strong>Typical architecture:<\/strong> on-prem network extended with <strong>ExpressRoute<\/strong>; <strong>Azure AD Connect<\/strong> syncs AD DS with Azure AD; two subscriptions in <strong>hub-spoke<\/strong> joined by <strong>VNet peering<\/strong> for capacity.<\/p>\n<h3>Components<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Microsoft-managed (control plane)<\/th>\n<th>Customer-managed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Web Access<\/strong> — HTML5 browser access (can add MFA)<\/td>\n<td><strong>Azure Virtual Network<\/strong> — connect to on-prem with <strong>VPN or ExpressRoute<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Gateway<\/strong> — connects remote users from any internet device<\/td>\n<td><strong>Azure AD / Entra ID<\/strong> — identity, Conditional Access, MFA<\/td>\n<\/tr>\n<tr>\n<td><strong>Connection Broker<\/strong> — manages connections, <strong>load balancing and reconnection<\/strong><\/td>\n<td><strong>AD DS<\/strong> — VMs <strong>must domain-join<\/strong>, and AD DS must sync with Azure AD (via Azure AD Connect)<\/td>\n<\/tr>\n<tr>\n<td><strong>Diagnostics<\/strong> — event aggregator marking each action success/failure<\/td>\n<td><strong>Session hosts<\/strong> — the VMs in host pools<\/td>\n<\/tr>\n<tr>\n<td><strong>Extensibility<\/strong> — manage with <strong>PowerShell or REST APIs<\/strong><\/td>\n<td><strong>Workspace<\/strong> — management construct to publish host pool resources<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>AVD is similar to <strong>Remote Desktop Services<\/strong>: Microsoft runs infrastructure + brokering; you manage host VMs, data and clients.<\/p>\n<p>Session host OS options: Windows 7 Enterprise, Windows 10 Enterprise, <strong>Windows 10/11 Enterprise multi-session<\/strong>, Windows Server 2012 R2+, custom images.<\/p>\n<h3>Host pools: personal vs pooled<\/h3>\n<ul>\n<li><strong>Host pool<\/strong> = collection of one or more <strong>identical VMs<\/strong> (same image) registered as session hosts via the AVD agent.<\/li>\n<li><strong>Personal (persistent)<\/strong> — each user always gets <strong>the same session host<\/strong>; can customize and save files.<\/li>\n<li><strong>Pooled<\/strong> — any authorized user can connect to any session host.<\/li>\n<li>Example: Host pool A (pooled, Desktop + RemoteApp groups) for sales; host pool B (personal desktops) for engineering.<\/li>\n<li><strong>Adding session hosts needs a registration key<\/strong> — generated <strong>per host pool<\/strong>, valid only until the <strong>expiry you set<\/strong>. Portal: AVD → Host pools → pool → <strong>Registration key<\/strong> → Generate new key.<\/li>\n<\/ul>\n<h3>Load balancing<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Breadth-first (<strong>default<\/strong>)<\/th>\n<th>Depth-first<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Spreads<\/strong> users evenly across hosts<\/td>\n<td><strong>Fills one host<\/strong> to its max, then the next<\/td>\n<\/tr>\n<tr>\n<td>Best <strong>user experience<\/strong><\/td>\n<td><strong>Cost-conscious<\/strong>, fewer VMs running<\/td>\n<\/tr>\n<tr>\n<td>Picks randomly from the <strong>half of hosts with the fewest sessions<\/strong> (e.g. hosts with 11–19 sessions → any of the 11–15 ones)<\/td>\n<td>Picks the host with the <strong>most<\/strong> sessions under the limit; <strong>max session limit is required<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Both: a user with an existing session is sent back to it (even if <strong>AllowNewConnections = False<\/strong>); hosts with AllowNewConnections = False aren't used for new sessions. One method per host pool.<\/p>\n<h3>User profiles — FSLogix<\/h3>\n<ul>\n<li><strong>FSLogix profile containers<\/strong> = recommended profile solution; roams profiles.<\/li>\n<li>At sign-in the container is attached as a <strong>VHD/VHDX<\/strong> and looks like a native profile.<\/li>\n<li>Recommended storage: <strong>Azure Files<\/strong> (also Azure NetApp Files).<\/li>\n<\/ul>\n<h3>Limits<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Object<\/th>\n<th>Per<\/th>\n<th>Limit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Workspace<\/td>\n<td>Azure AD tenant<\/td>\n<td><strong>1,300<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Host pool<\/td>\n<td>Workspace<\/td>\n<td><strong>400<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Application group<\/td>\n<td>Azure AD tenant<\/td>\n<td><strong>500<\/strong> (ticket for more)<\/td>\n<\/tr>\n<tr>\n<td>RemoteApp<\/td>\n<td>Application group<\/td>\n<td><strong>500<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Role assignment<\/td>\n<td>Any AVD object<\/td>\n<td><strong>200<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Session host<\/td>\n<td>Host pool<\/td>\n<td><strong>10,000<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Recommend <strong>≤ 5,000 VMs per subscription per region<\/strong> (≈ <strong>2,500<\/strong> with autoscale tools). More → multiple subscriptions in hub-spoke or another region.<\/li>\n<li><strong>600 VM reboots/hour<\/strong> via portal (ARM throttling). <strong>132 VMs<\/strong> per ARM template deployment. Session host <strong>name prefix ≤ 11 characters<\/strong> (NetBIOS 15-char limit). <strong>800<\/strong> instances of most resources per resource group.<\/li>\n<\/ul>\n<h3>Pricing / saving money<\/h3>\n<ul>\n<li><strong>Windows 10/11 multi-session<\/strong> — more users per VM.<\/li>\n<li><strong>Azure Hybrid Benefit<\/strong> — if you have <strong>Software Assurance<\/strong>.<\/li>\n<li><strong>Reserved Instances<\/strong> — prepay; with Hybrid Benefit up to <strong>80%<\/strong> savings.<\/li>\n<li><strong>Depth-first<\/strong> load balancing for cost.<\/li>\n<\/ul>\n<h3>Network &amp; bandwidth<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Workload<\/th>\n<th>Bandwidth<\/th>\n<th>Resolution (30 fps)<\/th>\n<th>Bandwidth<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Light<\/td>\n<td><strong>1.5 Mbps<\/strong><\/td>\n<td>\\~1024×768<\/td>\n<td>1.5 Mbps<\/td>\n<\/tr>\n<tr>\n<td>Medium<\/td>\n<td><strong>3 Mbps<\/strong><\/td>\n<td>\\~1280×720<\/td>\n<td>3 Mbps<\/td>\n<\/tr>\n<tr>\n<td>Heavy<\/td>\n<td><strong>5 Mbps<\/strong><\/td>\n<td>\\~1920×1080<\/td>\n<td>5 Mbps<\/td>\n<\/tr>\n<tr>\n<td>Power<\/td>\n<td><strong>15 Mbps<\/strong><\/td>\n<td>\\~3840×2160 (4K)<\/td>\n<td>15 Mbps<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Applies to networks with <strong>&lt; 0.1% loss<\/strong>. Higher frame rate or resolution = more bandwidth.<\/p>\n<ul>\n<li><strong>AVD Experience Estimator<\/strong> — shows connection <strong>round-trip time (RTT)<\/strong> to each Azure region; lowest is highlighted.<\/li>\n<li>Requirements: VNet + subnet in the <strong>same region<\/strong> as session hosts (create it first), reachable <strong>DCs and DNS<\/strong> (hosts must domain-join), and outbound <strong>TCP 443<\/strong> to the required URL list.<\/li>\n<\/ul>\n<h3>Remote Desktop clients<\/h3>\n<ul>\n<li>Supported: Windows Desktop client (<strong>MSRDC<\/strong>), AVD Store app, <strong>web client<\/strong>, macOS, iOS/iPadOS, Android/ChromeOS, Remote Desktop app.<\/li>\n<li><strong>NOT supported: RADC (RemoteApp and Desktop Connections) or MSTSC (Remote Desktop Connection).<\/strong><\/li>\n<li>Windows client: 64-bit, 32-bit, ARM64; Windows 10/11, 10 IoT Enterprise, 7 — <strong>not Windows 8/8.1<\/strong>.<\/li>\n<li>Web client needs: <strong>domain, username, password, the admin's URL, a supported browser<\/strong>; sign in as <strong>DOMAIN\\username<\/strong>; <strong>no mobile OS<\/strong> support.<\/li>\n<\/ul>\n<h3>Admin access &amp; metadata<\/h3>\n<ul>\n<li>A <strong>Global Administrator<\/strong> may need to <strong>elevate access<\/strong> to see/regain/grant access to all subscriptions and management groups (or let an automation app access them).<\/li>\n<li>AVD stores <strong>global metadata<\/strong> (tenant, host pool, app group names, UPNs) in the geography of the region you pick: <strong>US, EU (GA), UK (preview)<\/strong>. Encrypted at rest, geo-redundant within the geography.<\/li>\n<\/ul>\n<h3>Application groups &amp; publishing<\/h3>\n<ul>\n<li>Two ways to deliver apps: <strong>full desktop<\/strong> or <strong>individual RemoteApps<\/strong>. Publish by adding apps to an <strong>application group<\/strong> (tied to a host pool + workspace) and <strong>assign users<\/strong>.<\/li>\n<li>Assign users: Application groups → group → <strong>Assignments<\/strong> → + Add.<\/li>\n<li>Rename a RemoteApp: Application groups → group → Applications → change <strong>Display name<\/strong> → Save.<\/li>\n<\/ul>\n<h3>App attach vs MSIX app attach<\/h3>\n<p>Both attach apps <strong>dynamically<\/strong> from a package; apps <strong>aren't installed<\/strong> on hosts/images and run in <strong>containers<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>MSIX app attach<\/th>\n<th>App attach<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Permissions by <strong>application group<\/strong><\/td>\n<td>Permissions <strong>per app, per user<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Package works on <strong>one host pool<\/strong><\/td>\n<td><strong>Same package across many host pools<\/strong> (same region)<\/td>\n<\/tr>\n<tr>\n<td>Update = delete + recreate in a <strong>maintenance window<\/strong><\/td>\n<td>Upgrade with a new disk image, <strong>no maintenance window<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Can't run two versions on one host<\/td>\n<td><strong>Can run two versions<\/strong> at once<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "practice": false}, {"id": "windows-6", "n": 6, "title": "PowerShell", "html": "<p><strong>PowerShell<\/strong> = automation solution made of 3 parts: a <strong>command-line shell<\/strong>, a <strong>scripting language<\/strong>, and a <strong>configuration-management framework (DSC)<\/strong>. Runs on Windows, macOS and Linux.<\/p>\n<ul>\n<li><strong>Shell<\/strong>: replaces Command Prompt; works with <strong>.NET objects<\/strong> (not text). Features: history, tab completion/predictions, aliases, <strong>pipeline<\/strong>, in-console help.<\/li>\n<li><strong>.NET objects<\/strong> have <strong>properties<\/strong> (data, e.g. <code>$file.Name<\/code>, <code>$file.Length<\/code>) and <strong>methods<\/strong> (actions, e.g. <code>$text.ToUpper()<\/code>).<\/li>\n<li><strong>Language<\/strong>: command types = cmdlets, functions, filters, scripts, applications, configurations, workflows.<\/li>\n<li><strong>DSC (Desired State Configuration)<\/strong> = <strong>Infrastructure as Code<\/strong>. Benefits: consistency, scalability, version control, custom resources, integration, monitoring.<\/li>\n<li>In enterprises, some features can <strong>only<\/strong> be managed with PowerShell, and GUI actions often run PowerShell behind the scenes.<\/li>\n<\/ul>\n<h3>Hosts<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Windows PowerShell console<\/th>\n<th>Windows PowerShell ISE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Built-in console; run commands and tasks<\/td>\n<td>Rich editor with <strong>IntelliSense<\/strong>; design/test scripts<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>Doesn't support PowerShell 6 or 7<\/strong> → use <strong>VS Code + PowerShell extension<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Execution policy<\/h3>\n<p>Prevents users from accidentally running scripts. <strong>By default scripts don't run, but individual commands do.<\/strong><\/p>\n<ul>\n<li>Check: <strong><code>Get-ExecutionPolicy<\/code><\/strong>. Change: <strong><code>Set-ExecutionPolicy -ExecutionPolicy &lt;Policy&gt;<\/code><\/strong>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Policy<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Restricted<\/strong><\/td>\n<td><strong>Default on clients<\/strong>. Commands OK, <strong>no scripts<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>RemoteSigned<\/strong><\/td>\n<td><strong>Default on servers<\/strong>. Local scripts run; <strong>downloaded<\/strong> scripts must be signed by a trusted publisher<\/td>\n<\/tr>\n<tr>\n<td><strong>AllSigned<\/strong><\/td>\n<td><strong>All<\/strong> scripts must be signed, even local ones<\/td>\n<\/tr>\n<tr>\n<td><strong>Unrestricted<\/strong><\/td>\n<td>Unsigned scripts run; <strong>default on non-Windows<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Default<\/strong><\/td>\n<td>Sets the default (RemoteSigned servers / Restricted clients)<\/td>\n<\/tr>\n<tr>\n<td><strong>Undefined<\/strong><\/td>\n<td>Nothing set → falls back to the default<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Cmdlet structure<\/h3>\n<ul>\n<li><strong>Verb-Noun<\/strong> naming (e.g. <code>Get-Command<\/code>). Verb = action, noun = resource.<\/li>\n<li>Common verbs: <strong>Get<\/strong> (retrieve), <strong>Set<\/strong> (change), <strong>New<\/strong> (create), <strong>Add<\/strong> (add to a container), <strong>Remove<\/strong> (delete from a container).<\/li>\n<li>Noun prefixes group families: AD cmdlets use <strong>AD<\/strong> (ADUser, ADGroup, ADComputer).<\/li>\n<li><strong>Parameters<\/strong> start with <code>-<\/code>, value after a space; values with spaces in <strong>quotes<\/strong>; multiple values <strong>comma-separated, no spaces<\/strong>. <strong>Switches<\/strong> = Boolean parameters. Tab completion (Shift-Tab goes back).<\/li>\n<\/ul>\n<h3>Modules<\/h3>\n<ul>\n<li>Containers of cmdlets. <code>Import-Module &lt;Name&gt;<\/code>. Since <strong>PowerShell 3.0<\/strong>, modules <strong>auto-load<\/strong> if they're in the module folders (<code>%systemdir%\\WindowsPowerShell\\v1.0\\Modules<\/code>, <code>%userprofile%\\Documents\\WindowsPowerShell\\Modules<\/code>). Check paths: <strong><code>$env:PSModulePath<\/code><\/strong>. Get new ones with <code>Install-Module<\/code>.<\/li>\n<\/ul>\n<h3>Finding commands<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cmdlet<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong><code>Get-Help<\/code><\/strong><\/td>\n<td>Help + examples; wildcards (<code>Get-Help *process*<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><strong><code>Get-Command<\/code><\/strong><\/td>\n<td>Find commands; wildcards (<code>Get-Command *event*<\/code>); <code>-Module &lt;name&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong><code>Get-Module<\/code><\/strong><\/td>\n<td>Cmdlets in a module<\/td>\n<\/tr>\n<tr>\n<td><strong><code>Get-Alias<\/code> / <code>New-Alias<\/code><\/strong><\/td>\n<td>List / create aliases<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Reading Get-Help:<\/strong> separate syntax blocks = <strong>parameter sets<\/strong> (can't mix, e.g. <code>-List<\/code> vs <code>-LogName<\/code>). <strong>Positional<\/strong> parameter = name in brackets <code>[-LogName]<\/code>, so <code>Get-EventLog Application<\/code> works. <code>&lt;string[]&gt;<\/code> = <strong>multiple values<\/strong> (<code>-ComputerName DC01,DC02<\/code>). Square brackets = <strong>optional<\/strong>. Data types like <code>&lt;int&gt;<\/code>, and fixed value sets like <code>{Error | Warning …}<\/code>.<\/p>\n<p><strong>Aliases:<\/strong> <code>dir<\/code> → <strong>Get-ChildItem<\/strong>, <code>cd<\/code> → <strong>Set-Location<\/strong>, <code>mkdir<\/code> → <strong>New-Item<\/strong>. Aliases <strong>aren't saved<\/strong> between sessions unless put in a <strong>profile<\/strong>.<\/p>\n<h3>Pipeline, variables, formatting<\/h3>\n<ul>\n<li><strong>Pipeline <code>|<\/code><\/strong> passes one command's output as the next one's input. Multi-line entry shows the <strong><code>&gt;&gt;<\/code><\/strong> prompt (also happens by accident on typos).<\/li>\n<li><strong>Variables<\/strong> start with <strong><code>$<\/code><\/strong> (<code>$MyVariable<\/code>, <code>${My Variable}<\/code> if spaces). <strong>Don't persist<\/strong> after the shell closes. Object variables expose methods (e.g. a service's <code>.Stop()<\/code> / <code>.Start()<\/code>).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cmdlet<\/th>\n<th>Output<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Format-Table<\/code><\/td>\n<td>Table (<code>-AutoSize<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>Format-List<\/code><\/td>\n<td>List of properties<\/td>\n<\/tr>\n<tr>\n<td><code>Format-Wide<\/code><\/td>\n<td>Columns (<code>Format-Wide Name -Column 4<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>Out-GridView<\/code><\/td>\n<td>Separate grid window<\/td>\n<\/tr>\n<tr>\n<td><code>ConvertTo-Html<\/code><\/td>\n<td>HTML, e.g. pipe <code>Get-Service<\/code> into <code>ConvertTo-Html -Property Name, Status<\/code>, then into <code>Out-File Services.html<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Tip: put <strong>format cmdlets at the end<\/strong> of the pipeline; use <code>Select-Object<\/code> to choose properties.<\/p>\n<h3>Scripting<\/h3>\n<ul>\n<li>Scripts end in <strong>.ps1<\/strong> (not .txt).<\/li>\n<li><strong>Flow control<\/strong>: conditionals (<strong>if/else, switch<\/strong>), loops (<strong>foreach, for, while<\/strong>), <strong>input sanitization<\/strong> (validate parameters, e.g. age 0–120 with <code>throw<\/code>).<\/li>\n<li><strong>Functions<\/strong>: <code>function Name { param($x) … }<\/code>; params can have defaults/be mandatory; return with <code>return<\/code> or implicitly; script or global scope.<\/li>\n<\/ul>\n<h3>Error handling<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Terminating<\/th>\n<th>Non-terminating<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Stops<\/strong> the script (e.g. divide by zero)<\/td>\n<td>Script <strong>continues<\/strong> (e.g. file not found in <code>Get-Content<\/code>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Try / Catch / Finally<\/strong> — error in try jumps to catch; <strong>finally always runs<\/strong>.<\/li>\n<li><strong><code>$ErrorActionPreference = 'Stop'<\/code><\/strong> — makes non-terminating errors terminating.<\/li>\n<li><strong><code>-ErrorVariable<\/code><\/strong> — store errors in your own variable (often with <code>-ErrorAction SilentlyContinue<\/code>).<\/li>\n<\/ul>\n<h3>Profiles<\/h3>\n<p>Scripts that run when PowerShell starts.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Profile<\/th>\n<th>Variable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Current user, current host<\/td>\n<td><strong><code>$PROFILE<\/code><\/strong><\/td>\n<\/tr>\n<tr>\n<td>Current user, all hosts<\/td>\n<td><code>$PROFILE.CurrentUserAllHosts<\/code><\/td>\n<\/tr>\n<tr>\n<td>All users, current host<\/td>\n<td><code>$PROFILE.AllUsersCurrentHost<\/code><\/td>\n<\/tr>\n<tr>\n<td>All users, all hosts<\/td>\n<td><code>$PROFILE.AllUsersAllHosts<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Check: <code>Test-Path $PROFILE<\/code>. Create: <code>New-Item -Path $PROFILE -Type File -Force<\/code>. Edit: <code>notepad $PROFILE<\/code>. Keep profiles light.<\/p>\n<h3>Remoting<\/h3>\n<ul>\n<li>Run cmdlets on a remote computer as if local. Enable with a cmdlet or <strong>Group Policy<\/strong>.<\/li>\n<li><strong><code>Enter-PSSession &lt;computer&gt;<\/code><\/strong> — interactive; remote name shows in <strong>[brackets]<\/strong> at the prompt.<\/li>\n<li><strong><code>Invoke-Command<\/code><\/strong> — run a script block on <strong>multiple computers<\/strong> at once.<\/li>\n<li><strong><code>Get-Credential<\/code><\/strong> — prompts for username/password.<\/li>\n<li><strong>PowerShell Web Access (PSWA)<\/strong> — run PowerShell through a <strong>web browser<\/strong>.<\/li>\n<li>Works with AD, Exchange, Microsoft 365, Azure, SQL Server, and non-Microsoft (VMware, REST APIs, Git).<\/li>\n<\/ul>", "practice": false}, {"id": "windows-7", "n": 7, "title": "Cram Sheet", "html": "<h3>Commands<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Command<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Which DCs hold FSMO roles<\/td>\n<td><code>netdom query fsmo<\/code><\/td>\n<\/tr>\n<tr>\n<td>Applied Group Policies<\/td>\n<td><code>gpresult /r<\/code><\/td>\n<\/tr>\n<tr>\n<td>Replication status<\/td>\n<td><code>repadmin /showrepl<\/code>, <code>/replsummary<\/code>, <code>/syncall<\/code><\/td>\n<\/tr>\n<tr>\n<td>Domain health tests<\/td>\n<td><code>dcdiag<\/code><\/td>\n<\/tr>\n<tr>\n<td>Which DHCP server gave my IP<\/td>\n<td><code>ipconfig /all<\/code><\/td>\n<\/tr>\n<tr>\n<td>DNS cache / flush / re-register<\/td>\n<td><code>ipconfig /displaydns<\/code>, <code>/flushdns<\/code>, <code>/registerdns<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reverse lookup<\/td>\n<td><code>nslookup<\/code><\/td>\n<\/tr>\n<tr>\n<td>Add DNS record<\/td>\n<td><code>Add-DnsServerResourceRecord&lt;Type&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>New virtual disk<\/td>\n<td><code>New-VHD<\/code><\/td>\n<\/tr>\n<tr>\n<td>Upgrade VM config version<\/td>\n<td><code>Update-VMVersion &lt;vm&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>Supported VM versions<\/td>\n<td><code>Get-VMHostSupportedVersion<\/code><\/td>\n<\/tr>\n<tr>\n<td>Execution policy<\/td>\n<td><code>Get-ExecutionPolicy<\/code> / <code>Set-ExecutionPolicy<\/code><\/td>\n<\/tr>\n<tr>\n<td>Module paths<\/td>\n<td><code>$env:PSModulePath<\/code><\/td>\n<\/tr>\n<tr>\n<td>Remote session<\/td>\n<td><code>Enter-PSSession<\/code> (one), <code>Invoke-Command<\/code> (many)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Numbers &amp; defaults<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>FSMO roles<\/td>\n<td><strong>5<\/strong> — 2 per forest (Schema, Domain naming), 3 per domain (RID, PDC, Infrastructure)<\/td>\n<\/tr>\n<tr>\n<td>GPO order<\/td>\n<td><strong>Local → Site → Domain → OU → child OU<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Min DCs per domain (availability)<\/td>\n<td><strong>2<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Server Manager<\/td>\n<td>Local + <strong>100<\/strong> remote servers<\/td>\n<\/tr>\n<tr>\n<td>DHCP renew<\/td>\n<td><strong>50%<\/strong> of lease<\/td>\n<\/tr>\n<tr>\n<td>DHCP options<\/td>\n<td>Router <strong>003<\
